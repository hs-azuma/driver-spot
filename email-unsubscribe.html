<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>スポドラ｜メール配信停止</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif;line-height:1.7}main{max-width:580px;margin:40px auto;padding:20px}.logo{width:240px;max-width:80%;height:auto}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px;margin-top:24px}h1{font-size:26px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#1769d2;color:white;font-size:17px;font-weight:bold}button:disabled{opacity:.6}a{color:#1769d2}#message{margin:16px 0;color:#68758b}</style></head><body><main><a href="./"><img class="logo" src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><section class="card"><h1>求人メールの配信停止</h1><p>希望条件に合う新しい求人のお知らせメールを停止します。</p><p>採用・選考結果、ログイン確認など、サービス利用に必要なメールは引き続き届きます。LINE通知の設定は変更しません。</p><button id="stop">求人メールの配信を停止する</button><p id="message" role="status" aria-live="polite"></p><p><a href="./driver.html">ドライバー画面へ</a></p></section></main><script>const token=new URLSearchParams(location.hash.slice(1)).get('token')||'',button=document.getElementById('stop'),message=document.getElementById('message');if(!token){button.hidden=true;message.textContent='メール内の「配信停止」リンクから開いてください。'}button.onclick=async()=>{button.disabled=true;message.textContent='停止しています…';try{const response=await fetch('https://wyxuekjikvflpcmlliwn.supabase.co/functions/v1/email-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'save_failed');button.hidden=true;message.style.color='#16803c';message.textContent='求人メールの配信を停止しました。再開する場合はドライバーのプロフィールでメール通知を有効にしてください。';history.replaceState(null,'',location.pathname)}catch(error){button.disabled=false;message.style.color='#b42318';message.textContent=error.message==='invalid_link'?'このリンクは無効です。新しいメールのリンクから開くか、プロフィールでメール通知を停止してください。':'停止できませんでした。もう一度お試しください。'}};</script></body></html>
