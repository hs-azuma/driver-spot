<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #dbe3ef;padding:22px}header h1{margin:0;color:#1769d2}header p{margin:6px 0;color:#68758b}main{max-width:1000px;margin:auto;padding:25px}.status,.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:16px;margin-bottom:20px}.tabs,.inline{display:flex;gap:10px;flex-wrap:wrap}.tabs{margin-bottom:20px}.inline select{width:150px}button{border:1px solid #1769d2;background:#fff;color:#1769d2;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold}.primary{background:#1769d2;color:#fff}.danger{border-color:#dc2626;color:#dc2626}.location,.note{color:#68758b}.salary{font-size:22px;font-weight:bold;color:#e64728;margin:10px 0}.badge{display:inline-block;background:#edf4ff;color:#1769d2;padding:5px 10px;border-radius:999px;margin-right:5px}.empty{text-align:center;padding:40px;color:#68758b}.error{color:#c62828;font-weight:bold}.success{color:#16803c;font-weight:bold}input,select,textarea{width:100%;max-width:560px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}textarea{min-height:90px}label{display:block;margin:16px 0 6px;font-weight:bold}.subbox{max-width:560px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-top:8px}.authbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.jobactions{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.password-row{display:flex;gap:8px;align-items:center;max-width:560px}.password-row input{flex:1}.password-row button{padding:12px 14px;white-space:nowrap}</style></head><body><header><h1>DRIVER SPOT</h1><p>ドライバーと企業を直接つなぐ求人プラットフォーム</p></header><main><div class="status authbar"><div>Supabase接続：<span id="connectionStatus">確認中...</span>　<span id="authStatus">未ログイン</span></div><div id="authActions"><button onclick="showLogin()">ログイン</button></div></div><div class="tabs"><button onclick="loadJobs()">求人を見る</button><button onclick="showDriver()">ドライバー登録</button><button onclick="showCompany()">企業・求人登録</button></div><div id="content"></div></main><script>
const SUPABASE_URL='https://wyxuekjikvflpcmlliwn.supabase.co',SUPABASE_KEY='sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),jp='lang="ja"';let currentUser=null,currentDriver=null;
function expLabel(x){const n=Number(x||0);return n>=4?'4年以上':n>=1?'1〜3年':'1年未満'}function expLabel(x){const n=Number(x||0);return n>=4?'4年以上':n>=1?'1〜3年':'1年未満'}function v(id){const e=document.getElementById(id);return e?e.value.trim():''}function msg(e,t,ok){e.className=ok?'success':'error';e.textContent=t}function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function fmtTime(t){return t?esc(String(t).slice(0,5)):''}function togglePassword(id,btn){const e=document.getElementById(id);if(!e)return;e.type=e.type==='password'?'text':'password';btn.textContent=e.type==='password'?'表示':'隠す'}
async function refreshAuth(){const {data:{user}}=await db.auth.getUser();currentUser=user||null;currentDriver=null;if(currentUser){const {data,error}=await db.from('drivers').select('*').eq('user_id',currentUser.id).maybeSingle();if(!error)currentDriver=data||null;document.getElementById('authStatus').textContent=currentDriver?`${currentDriver.name}さん ログイン中`:`${currentUser.email} ログイン中（プロフィール未登録）`;document.getElementById('authActions').innerHTML='<button onclick="logout()">ログアウト</button>'}else{document.getElementById('authStatus').textContent='未ログイン';document.getElementById('authActions').innerHTML='<button onclick="showLogin()">ログイン</button>'}}
async function logout(){await db.auth.signOut();await refreshAuth();loadJobs()}
function showLogin(){document.getElementById('content').innerHTML=`<div class="card"><h2>ドライバーログイン</h2><label>メールアドレス</label><input id="loginEmail" type="email"><label>パスワード</label><div class="password-row"><input id="loginPassword" type="password"><button type="button" onclick="togglePassword('loginPassword',this)">表示</button></div><br><button class="primary" onclick="loginDriver()">ログイン</button><p id="loginMessage"></p></div>`}
async function loginDriver(){const m=document.getElementById('loginMessage');m.textContent='ログイン中...';const {error}=await db.auth.signInWithPassword({email:v('loginEmail'),password:v('loginPassword')});if(error)return msg(m,'ログインエラー：'+error.message,false);await refreshAuth();if(!currentDriver)return showCompleteDriverProfile();loadJobs()}
function showCompleteDriverProfile(){const md=currentUser?.user_metadata||{};document.getElementById('content').innerHTML=`<div class="card"><h2>ドライバープロフィール登録</h2><p class="note">アカウント認証は完了しています。プロフィールだけ登録してください。</p><label>氏名</label><input id="completeName" value="${esc(md.driver_name||'')}" ${jp}><label>電話番号</label><input id="completePhone" type="tel" value="${esc(md.driver_phone||'')}"><label>住所・希望エリア</label><input id="completeArea" value="${esc(md.driver_area||'')}" ${jp}><label>免許種類</label><select id="completeLicense"><option value="">選択してください</option><option>普通</option><option>準中型</option><option>中型</option><option>大型</option><option>けん引</option></select><label>ドライバー経験年数</label><select id="completeYears"><option value="0">1年未満</option><option value="2">1〜3年</option><option value="4">4年以上</option></select><br><br><button class="primary" id="completeSubmit" onclick="completeDriverProfile()">ドライバー情報を登録する</button><p id="completeMessage"></p></div>`;if(md.driver_license)document.getElementById('completeLicense').value=md.driver_license;const n=Number(md.driver_experience_years||0);document.getElementById('completeYears').value=n>=4?'4':n>=1?'2':'0'}
async function completeDriverProfile(){const m=document.getElementById('completeMessage'),name=v('completeName');if(!name)return msg(m,'氏名を入力してください。',false);const payload={user_id:currentUser.id,name,phone:v('completePhone'),email:currentUser.email,area:v('completeArea'),license_type:v('completeLicense'),experience_years:Number(v('completeYears')||0)};const {error}=await db.from('drivers').upsert([payload],{onConflict:'user_id'});if(error)return msg(m,'プロフィール登録エラー：'+error.message,false);await refreshAuth();showDriver()}
function transportationText(j){if(j.transportation_fee_type==='全額支給')return j.transportation_fee_limit_type==='あり'&&j.transportation_fee_limit?`交通費：全額支給（上限 ${Number(j.transportation_fee_limit).toLocaleString()}円）`:'交通費：全額支給（上限なし）';return Number(j.transportation_fee||0)>0?`交通費：${Number(j.transportation_fee).toLocaleString()}円`:'交通費：なし'}
async function loadJobs(){const s=document.getElementById('connectionStatus'),c=document.getElementById('content');s.textContent='接続中...';const {data,error}=await db.from('jobs').select('*').order('created_at',{ascending:false});if(error){s.textContent='接続エラー';return c.innerHTML=`<div class="card error">${esc(error.message)}</div>`}s.textContent='接続成功';s.className='success';let applied=new Map();if(currentDriver){const {data:a,error:ae}=await db.from('applications').select('id,job_id,status').eq('driver_id',currentDriver.id);if(!ae)(a||[]).forEach(x=>applied.set(Number(x.job_id),x))}if(!data?.length)return c.innerHTML='<div class="card empty"><h2>現在、登録求人はありません</h2></div>';c.innerHTML=data.map(j=>{const pt=j.pay_type||'時給',pa=j.pay_amount??j.hourly_wage??0,a=applied.get(Number(j.id));const action=a?`<span class="success">応募済み</span><button class="danger" onclick="cancelApplication(${Number(a.id)})">応募をキャンセル</button>`:`<button class="primary" onclick="applyJob(${Number(j.id)})">この求人に応募する</button>`;return `<div class="card"><h2>${esc(j.job_description||'ドライバー求人')}</h2><div class="location">${esc(j.location)}${j.destination?' → '+esc(j.destination):''}</div><div class="salary">${esc(pt)} ${Number(pa).toLocaleString()}円</div><span class="badge">${esc(j.vehicle_type||'車種未設定')}</span><span class="badge">${esc(j.required_license||'免許条件なし')}</span><p>${esc(j.work_date)} ${fmtTime(j.start_time)}〜${fmtTime(j.end_time)}</p><p>${esc(transportationText(j))}</p><div class="jobactions">${action}</div></div>`}).join('')}
async function applyJob(jobId){if(!currentUser){showLogin();return alert('応募するにはドライバーとしてログインしてください。')}if(!currentDriver){showCompleteDriverProfile();return alert('応募前にドライバープロフィールを登録してください。')}if(!confirm('この求人に応募しますか？'))return;const {error}=await db.from('applications').insert([{job_id:jobId,driver_id:currentDriver.id,status:'応募中'}]);if(error){if(error.code==='23505')return alert('この求人にはすでに応募済みです。');return alert('応募エラー：'+error.message)}alert('応募が完了しました！');loadJobs()}
async function cancelApplication(id){if(!confirm('この求人への応募をキャンセルしますか？'))return;const {error}=await db.from('applications').delete().eq('id',id);if(error)return alert('キャンセルエラー：'+error.message);alert('応募をキャンセルしました。');loadJobs()}
async function showDriver(){if(currentUser){await refreshAuth();if(!currentDriver)return showCompleteDriverProfile();document.getElementById('content').innerHTML=`<div class="card"><h2>ドライバー登録済み</h2><p class="success">${esc(currentDriver.name)}さんのドライバー情報は登録済みです。</p><p>メール：${esc(currentUser.email||'')}</p><p>電話番号：${esc(currentDriver.phone||'未設定')}</p><p>希望エリア：${esc(currentDriver.area||'未設定')}</p><p>免許種類：${esc(currentDriver.license_type||'未設定')}</p><p>経験年数：${esc(expLabel(currentDriver.experience_years))}</p><button class="primary" onclick="loadJobs()">求人を見る</button></div>`;return}document.getElementById('content').innerHTML=`<div class="card"><h2>ドライバー登録</h2><label>氏名</label><input id="driverName" ${jp}><label>電話番号</label><input id="driverPhone" type="tel"><label>メールアドレス</label><input id="driverEmail" type="email"><label>パスワード</label><div class="password-row"><input id="driverPassword" type="password" minlength="6"><button type="button" onclick="togglePassword('driverPassword',this)">表示</button></div><p class="note">6文字以上で設定してください。</p><label>住所・希望エリア</label><input id="driverArea" ${jp}><label>免許種類</label><select id="driverLicense"><option value="">選択してください</option><option>普通</option><option>準中型</option><option>中型</option><option>大型</option><option>けん引</option></select><label>ドライバー経験年数</label><select id="driverExperienceYears"><option value="0">1年未満</option><option value="2">1〜3年</option><option value="4">4年以上</option></select><br><br><button class="primary" id="driverSubmit" onclick="registerDriver()">アカウントを作成する</button><p id="driverMessage"></p></div>`}
async function registerDriver(){const m=document.getElementById('driverMessage'),name=v('driverName'),email=v('driverEmail'),password=v('driverPassword'),phone=v('driverPhone'),area=v('driverArea'),license_type=v('driverLicense'),experience_years=Number(v('driverExperienceYears')||0);if(!name||!email||password.length<6)return msg(m,'氏名・メールアドレス・6文字以上のパスワードは必須です。',false);const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:'https://hs-azuma.github.io/driver-spot/',data:{driver_name:name,driver_phone:phone,driver_area:area,driver_license:license_type,driver_experience_years:experience_years}}});if(error)return msg(m,'アカウント登録エラー：'+error.message,false);if(!data.session)return msg(m,'確認メールを送りました。メール内のリンクを押すと登録が完了します。',true);await refreshAuth();showCompleteDriverProfile()}
function showCompany(){document.getElementById('content').innerHTML=`<div class="card"><h2>企業登録</h2><label>会社名</label><input id="companyName" ${jp}><label>担当者名</label><input id="contactName" ${jp}><label>電話番号</label><input id="companyPhone" type="tel"><label>メールアドレス</label><input id="companyEmail" type="email"><label>会社住所</label><input id="companyAddress" ${jp}><br><br><button class="primary" id="companySubmit" onclick="registerCompany()">企業を登録して求人入力へ</button><p id="companyMessage"></p></div>`}
async function registerCompany(){const m=document.getElementById('companyMessage'),company_name=v('companyName');if(!company_name)return msg(m,'会社名を入力してください。',false);const {data,error}=await db.rpc('register_company',{p_company_name:company_name,p_contact_name:v('contactName')||null,p_phone:v('companyPhone')||null,p_email:v('companyEmail')||null,p_address:v('companyAddress')||null});if(error)return msg(m,'登録エラー：'+error.message,false);showJobForm(data,company_name)}
function hourOptions(){let o='<option value="">時</option>';for(let h=0;h<24;h++){let x=String(h).padStart(2,'0');o+=`<option value="${x}">${x}時</option>`}return o}function minuteOptions(){let o='<option value="">分</option>';for(let m=0;m<60;m+=10){let x=String(m).padStart(2,'0');o+=`<option value="${x}">${x}分</option>`}return o}function makeTime(h,m){return h&&m!==''?h+':'+m:null}
function toggleTransport(){let t=v('transportationFeeType');document.getElementById('transportAmountBox').style.display=t==='金額指定'?'block':'none';document.getElementById('transportLimitBox').style.display=t==='全額支給'?'block':'none';toggleLimit()}function toggleLimit(){let e=document.getElementById('transportLimitAmountBox');if(e)e.style.display=v('transportLimitType')==='あり'?'block':'none'}
function showJobForm(companyId,companyName){document.getElementById('content').innerHTML=`<div class="card"><h2>求人登録</h2><p><b>${esc(companyName)}</b> の求人を登録します。</p><label>勤務日</label><input id="workDate" type="date"><label>開始時間</label><div class="inline"><select id="startHour">${hourOptions()}</select><select id="startMinute">${minuteOptions()}</select></div><label>終了時間</label><div class="inline"><select id="endHour">${hourOptions()}</select><select id="endMinute">${minuteOptions()}</select></div><label>出発地・勤務地</label><input id="jobLocation" ${jp}><label>集荷/配送先</label><input id="destination" ${jp}><label>車種</label><select id="vehicleType"><option value="">選択してください</option><option>軽貨物</option><option>1t</option><option>2t</option><option>4t</option><option>大型</option><option>トレーラー</option></select><label>仕事内容</label><textarea id="jobDescription" ${jp}></textarea><label>必要免許</label><select id="requiredLicense"><option value="">選択してください</option><option>普通</option><option>準中型</option><option>中型</option><option>大型</option><option>けん引</option></select><label>必要経験</label><input id="requiredExperience" ${jp}><label>給与区分</label><select id="payType"><option>時給</option><option>日給</option></select><label>給与額</label><input id="payAmount" type="number" min="0"><label>交通費</label><select id="transportationFeeType" onchange="toggleTransport()"><option>金額指定</option><option>全額支給</option><option>なし</option></select><div id="transportAmountBox" class="subbox"><label>交通費支給額</label><input id="transportationFee" type="number" min="0" value="0"></div><div id="transportLimitBox" class="subbox" style="display:none"><label>上限</label><select id="transportLimitType" onchange="toggleLimit()"><option value="なし">上限なし</option><option value="あり">上限あり</option></select><div id="transportLimitAmountBox" style="display:none"><label>上限金額</label><input id="transportLimit" type="number" min="0"></div></div><br><button class="primary" onclick="registerJob(${Number(companyId)})">求人を登録する</button><p id="jobMessage"></p></div>`}
async function registerJob(company_id){const m=document.getElementById('jobMessage'),work_date=v('workDate'),start_time=makeTime(v('startHour'),v('startMinute')),end_time=makeTime(v('endHour'),v('endMinute')),location=v('jobLocation'),destination=v('destination'),vehicle_type=v('vehicleType'),job_description=v('jobDescription'),required_license=v('requiredLicense'),required_experience=v('requiredExperience'),pay_type=v('payType'),pay_amount=Number(v('payAmount')),transportation_fee_type=v('transportationFeeType'),transportation_fee=transportation_fee_type==='金額指定'?Number(v('transportationFee')||0):0,transportation_fee_limit_type=transportation_fee_type==='全額支給'?v('transportLimitType'):'なし',transportation_fee_limit=transportation_fee_type==='全額支給'&&transportation_fee_limit_type==='あり'?Number(v('transportLimit')||0):null,hourly_wage=pay_type==='時給'?pay_amount:null;if(!work_date||!location||!pay_amount)return msg(m,'勤務日・勤務地・給与額は必須です。',false);const {error}=await db.from('jobs').insert([{company_id,work_date,start_time,end_time,location,destination,vehicle_type,job_description,required_license,required_experience,hourly_wage,pay_type,pay_amount,transportation_fee,transportation_fee_type,transportation_fee_limit_type,transportation_fee_limit}]);if(error)return msg(m,'登録エラー：'+error.message,false);msg(m,'求人登録が完了しました！',true);setTimeout(loadJobs,800)}
db.auth.onAuthStateChange(()=>setTimeout(refreshAuth,0));(async()=>{await refreshAuth();loadJobs()})();
</script></body></html>
