<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIVER SPOT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #dbe3ef;padding:22px}header h1{margin:0;color:#1769d2}header p{margin:6px 0 0;color:#68758b}main{max-width:1000px;margin:auto;padding:25px}.status,.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:16px;margin-bottom:20px}.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}button{border:1px solid #1769d2;background:#fff;color:#1769d2;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold}button.active{background:#1769d2;color:#fff}.card{border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.card h2{margin-top:0}.location{color:#68758b}.salary{font-size:22px;font-weight:bold;color:#e64728;margin:10px 0}.badge{display:inline-block;background:#edf4ff;color:#1769d2;padding:5px 10px;border-radius:999px;margin-right:5px}.empty{text-align:center;padding:40px;color:#68758b}.error{color:#c62828;font-weight:bold}.success{color:#16803c;font-weight:bold}input,select{width:100%;max-width:520px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}label{display:block;margin:16px 0 6px;font-weight:bold}#driverMessage{margin-top:16px}
</style>
</head>
<body>
<header><h1>DRIVER SPOT</h1><p>ドライバーと企業を直接つなぐ求人プラットフォーム</p></header>
<main>
<div class="status">Supabase接続：<span id="connectionStatus">確認中...</span></div>
<div class="tabs"><button class="active" onclick="loadJobs()">求人を見る</button><button onclick="showDriver()">ドライバー登録</button><button onclick="showCompany()">企業登録</button></div>
<div id="content"><div class="empty">求人情報を読み込んでいます...</div></div>
</main>
<script>
const SUPABASE_URL="https://wyxuekjikvflpcmlliwn.supabase.co";
const SUPABASE_KEY="sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function loadJobs(){
 const status=document.getElementById("connectionStatus"),content=document.getElementById("content");
 status.textContent="接続中...";
 try{
  const {data,error}=await db.from("jobs").select("*").order("created_at",{ascending:false});
  if(error)throw error;
  status.textContent="接続成功";status.className="success";
  if(!data||data.length===0){content.innerHTML='<div class="card empty"><h2>現在、登録求人はありません</h2><p>Supabaseとの接続には成功しています。</p></div>';return;}
  content.innerHTML=data.map(job=>`<div class="card"><h2>${escapeHtml(job.title||"")}</h2><div class="location">${escapeHtml(job.location||"勤務地未設定")}</div><div class="salary">${escapeHtml(job.salary||"給与応相談")}</div><span class="badge">${escapeHtml(job.employment_type||"雇用形態未設定")}</span><p>${escapeHtml(job.description||"")}</p></div>`).join("");
 }catch(e){status.textContent="接続エラー";status.className="error";content.innerHTML='<div class="card error">'+escapeHtml(e.message||String(e))+'</div>';}
}

function showDriver(){
 document.getElementById("content").innerHTML=`<div class="card"><h2>ドライバー登録</h2>
 <label>氏名</label><input id="driverName" type="text" placeholder="例：山田 太郎">
 <label>電話番号</label><input id="driverPhone" type="tel" placeholder="例：090-1234-5678">
 <label>メールアドレス</label><input id="driverEmail" type="email" placeholder="例：sample@example.com">
 <label>住所・希望エリア</label><input id="driverArea" type="text" placeholder="例：大阪府大阪市">
 <label>免許種類</label><select id="driverLicense"><option value="">選択してください</option><option value="普通">普通免許</option><option value="準中型">準中型免許</option><option value="中型">中型免許</option><option value="大型">大型免許</option><option value="けん引">けん引免許</option></select>
 <label>ドライバー経験年数</label><input id="driverExperienceYears" type="number" min="0" step="1" placeholder="例：10">
 <br><br><button id="driverSubmit" onclick="registerDriver()">登録する</button><p id="driverMessage"></p></div>`;
}

async function registerDriver(){
 const message=document.getElementById("driverMessage"),button=document.getElementById("driverSubmit");
 const name=document.getElementById("driverName").value.trim();
 const phone=document.getElementById("driverPhone").value.trim();
 const email=document.getElementById("driverEmail").value.trim();
 const area=document.getElementById("driverArea").value.trim();
 const license_type=document.getElementById("driverLicense").value;
 const rawYears=document.getElementById("driverExperienceYears").value;
 const experience_years=rawYears===""?0:Number(rawYears);
 if(!name){message.className="error";message.textContent="氏名を入力してください。";return;}
 if(!Number.isInteger(experience_years)||experience_years<0){message.className="error";message.textContent="経験年数は0以上の整数で入力してください。";return;}
 message.className="";message.textContent="登録中...";button.disabled=true;
 try{
  const {error}=await db.from("drivers").insert([{name,phone,email,area,license_type,experience_years}]);
  if(error)throw error;
  message.className="success";message.textContent="登録が完了しました！";
  button.disabled=true;
 }catch(e){console.error(e);message.className="error";message.textContent="登録エラー："+(e.message||String(e));button.disabled=false;}
}

function showCompany(){document.getElementById("content").innerHTML='<div class="card"><h2>企業登録</h2><p>次の工程で、企業情報と求人情報を登録できるようにします。</p></div>';}
function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
loadJobs();
</script>
</body>
</html>
