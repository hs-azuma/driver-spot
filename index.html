<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #dbe3ef;padding:22px}header h1{margin:0}header h1 a{color:#1769d2;text-decoration:none}main{max-width:1000px;margin:auto;padding:25px}.status,.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:16px;margin-bottom:20px}.tabs,.jobactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tabs{margin-bottom:20px}button{border:1px solid #1769d2;background:#fff;color:#1769d2;padding:12px 18px;border-radius:10px;font-weight:bold}.primary{background:#1769d2;color:#fff}.danger{border-color:#dc2626;color:#dc2626}.location,.note{color:#68758b}.salary{font-size:22px;font-weight:bold;color:#e64728;margin:10px 0}.badge,.decision{display:inline-block;background:#edf4ff;color:#1769d2;padding:6px 10px;border-radius:999px}.hired{background:#e9f8ef;color:#16803c}.rejected{background:#fff0f0;color:#c62828}.error{color:#c62828}.success{color:#16803c;font-weight:bold}input,select{width:100%;max-width:560px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}label{display:block;margin:16px 0 6px;font-weight:bold}.authbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.password-row{display:flex;gap:8px;max-width:560px}.password-row input{flex:1}</style></head><body><header><h1><a href="./">DRIVER SPOT</a></h1><p>ドライバーと企業を直接つなぐ求人プラットフォーム</p></header><main><div class="status authbar"><div>Supabase接続：<span id="connectionStatus">確認中...</span>　<span id="authStatus">未ログイン</span></div><div id="authActions"></div></div><div class="tabs"><button onclick="loadJobs()">求人を見る</button><button onclick="showDriver()">ドライバー登録</button><button onclick="location.href='./company-register.html'">企業・求人登録</button></div><div id="content"></div></main><script>
const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let currentUser=null,currentDriver=null;const v=id=>document.getElementById(id)?.value.trim()||'',esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function fmtTime(t){return t?String(t).slice(0,5):''}function togglePassword(id,b){let x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'表示':'隠す'}async function findCurrentDriver(){if(!currentUser)return null;let r=await db.rpc('get_my_driver');if(!r.error&&r.data?.length)return r.data[0];let q=await db.from('drivers').select('*').eq('user_id',currentUser.id).limit(1);return q.data?.[0]||null}async function refreshAuth(){currentUser=(await db.auth.getUser()).data.user||null;currentDriver=currentUser?await findCurrentDriver():null;document.getElementById('authStatus').textContent=currentUser?(currentDriver?currentDriver.name+'さん ログイン中':currentUser.email+' ログイン中'):'未ログイン';document.getElementById('authActions').innerHTML=currentUser?'<button onclick="logout()">ログアウト</button>':'<button onclick="showLogin()">ログイン</button>'}async function logout(){await db.auth.signOut();loadJobs()}
function showLogin(){document.getElementById('content').innerHTML=`<div class="card"><h2>ログイン</h2><label>メールアドレス</label><input id="loginEmail"><label>パスワード</label><div class="password-row"><input id="loginPassword" type="password"><button onclick="togglePassword('loginPassword',this)">表示</button></div><br><button class="primary" onclick="loginDriver()">ログイン</button></div>`}async function loginDriver(){let r=await db.auth.signInWithPassword({email:v('loginEmail'),password:v('loginPassword')});if(r.error)return alert(r.error.message);loadJobs()}function statusView(s){if(s==='採用')return '<span class="decision hired">採用されました</span>';if(s==='見送り')return '<span class="decision rejected">今回は見送り</span>';if(s==='採用候補')return '<span class="decision">採用候補</span>';return '<span class="decision">応募中</span>'}
async function loadJobs(){await refreshAuth();let r=await db.from('jobs').select('*').order('created_at',{ascending:false}),jobs=r.data||[],applied=new Map(),blocked=new Set();document.getElementById('connectionStatus').textContent=r.error?'接続エラー':'接続成功';if(currentDriver){let a=await db.from('applications').select('id,job_id,status').eq('driver_id',currentDriver.id);(a.data||[]).forEach(x=>applied.set(Number(x.job_id),x));let b=await db.from('company_driver_blocks').select('company_id').eq('driver_id',currentDriver.id);(b.data||[]).forEach(x=>blocked.add(Number(x.company_id)));jobs=jobs.filter(j=>!blocked.has(Number(j.company_id)))}document.getElementById('content').innerHTML=jobs.map(j=>{let a=applied.get(Number(j.id)),action=a?`${statusView(a.status)} ${a.status==='応募中'||a.status==='採用候補'?`<button class="danger" onclick="cancelApplication(${a.id})">応募をキャンセル</button>`:''}`:`<button class="primary" onclick="applyJob(${j.id})">この求人に応募する</button>`;return `<div class="card"><h2>${esc(j.job_description||'ドライバー求人')}</h2><div class="location">${esc(j.location||'')}${j.destination?' → '+esc(j.destination):''}</div><div class="salary">${esc(j.pay_type||'時給')} ${Number(j.pay_amount||0).toLocaleString()}円</div><span class="badge">${esc(j.required_license||'免許条件なし')}</span><p>${esc(j.work_date||'')} ${fmtTime(j.start_time)}〜${fmtTime(j.end_time)}</p><div class="jobactions">${action}</div></div>`}).join('')||'<div class="card">現在、表示できる求人はありません。</div>'}
async function applyJob(id){if(!currentUser)return showLogin();if(!currentDriver)return showCompleteDriverProfile();if(!confirm('この求人に応募しますか？'))return;let r=await db.from('applications').insert({job_id:id,driver_id:currentDriver.id,status:'応募中'});if(r.error)return alert(r.error.message);alert('応募が完了しました！');loadJobs()}async function cancelApplication(id){if(!confirm('応募をキャンセルしますか？'))return;let r=await db.from('applications').delete().eq('id',id);if(r.error)return alert(r.error.message);loadJobs()}
function showCompleteDriverProfile(){document.getElementById('content').innerHTML=`<div class="card"><h2>ドライバープロフィール登録</h2><label>氏名</label><input id="completeName"><label>電話番号</label><input id="completePhone"><label>住所・希望エリア</label><input id="completeArea"><label>免許種類</label><select id="completeLicense"><option>普通</option><option>準中型</option><option>中型</option><option>大型</option></select><label>経験年数</label><select id="completeYears"><option value="0">1年未満</option><option value="2">1〜3年</option><option value="4">4年以上</option></select><br><button class="primary" onclick="completeDriverProfile()">登録する</button></div>`}async function completeDriverProfile(){let r=await db.from('drivers').upsert({user_id:currentUser.id,name:v('completeName'),phone:v('completePhone'),email:currentUser.email,area:v('completeArea'),license_type:v('completeLicense'),experience_years:Number(v('completeYears')||0)},{onConflict:'user_id'});if(r.error)return alert(r.error.message);loadJobs()}async function showDriver(){await refreshAuth();if(currentDriver){document.getElementById('content').innerHTML=`<div class="card"><h2>ドライバー登録済み</h2><p>${esc(currentDriver.name)}さん</p><button onclick="loadJobs()">求人を見る</button></div>`;return}if(currentUser)return showCompleteDriverProfile();document.getElementById('content').innerHTML=`<div class="card"><h2>ドライバー登録</h2><p>先にログインまたはアカウント登録してください。</p><button onclick="showLogin()">ログイン</button></div>`}db.auth.onAuthStateChange(()=>setTimeout(refreshAuth,0));loadJobs();
</script></body></html>
