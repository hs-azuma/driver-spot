e:18px;margin-top:24px}.driver .btn{background:#1769d2;color:#fff}.business .btn{background:#172033;color:#fff}.share{margin:32px auto 0;text-align:center}.share button{border:1px solid #cbd7e8;background:#fff;color:#1769d2;border-radius:10px;padding:11px 16px;margin:5px;font-weight:bold;font-size:14px;cursor:pointer}.mailbox{display:none;max-width:520px;margin:18px auto 0;background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px}.mailbox.open{display:block}.mailbox label{display:block;text-align:left;font-weight:bold;margin-bottom:8px}.mailrow{display:flex;gap:8px}.mailrow input{flex:1;min-width:0;border:1px solid #cbd7e8;border-radius:10px;padding:13px;font-size:16px}.mailrow button{margin:0;background:#1769d2;color:#fff;border-color:#1769d2;min-width:100px}.msg{font-size:13px;margin:10px 0 0;min-height:18px}.sub{font-size:13px;color:#8a94a6;text-align:center;margin-top:28px}@media(max-width:700px){.wrap{padding:42px 16px}.logo{font-size:50px}.choices{grid-template-columns:1fr}.portal{padding:28px 22px}.portal p{min-height:0}.share>button{display:block;width:100%;margin:8px 0}.mailrow{display:block}.mailrow button{display:block;width:100%;margin-top:8px}}</style></head><body><main class="wrap"><div class="brand"><div class="logo">スポドラ</div><p>ドライバーと企業をやさしくつなぐ</p></div><div class="choices"><section class="portal driver"><div class="icon">🚚</div><h2>ドライバーの方</h2><p>求人を探す・応募する・仕事を管理する<br>出退勤QRもこちらから</p><a class="btn" href="./driver.html">ドライバーサイトへ</a></section><section class="portal business"><div class="icon">🏢</div><h2>企業の方</h2><p>求人掲載・応募者管理・採用管理<br>勤怠・QR打刻を管理</p><a class="btn" href="./company-register.html">企業サイトへ</a></section></div><div class="share"><button type="button" onclick="shareSite()">共有する</button><button type="button" onclick="toggleMail()">メールで紹介</button><div id="mailbox" class="mailbox"><label for="shareEmail">紹介したい相手のメールアドレス</label><div class="mailrow"><input id="shareEmail" type="email" inputmode="email" autocomplete="email" placeholder="example@example.com"><button id="sendBtn" type="button" onclick="sendIntro()">送信する</button></div><p id="mailMsg" class="msg"></p></div></div><p class="sub">スポドラ</p></main><script>const siteData={title:'スポドラ｜ドライバーと企業をやさしくつなぐ',text:'スポドラ\nドライバーと企業をやさしくつなぐ\n\n仕事探し・求人掲載・採用・勤怠管理までスムーズに。\n\nスポドラを見る',url:'https://hs-azuma.github.io/driver-spot/'};async function shareSite(){if(navigator.share){try{await navigator.share(siteData)}catch(e){}}else{try{await navigator.clipboard.writeText(siteData.text+'\n'+siteData.url);alert('スポドラの紹介文とURLをコピーしました。')}catch(e){}}}function toggleMail(){document.getElementById('mailbox').classList.toggle('open');setTimeout(()=>document.getElementById('shareEmail').focus(),50)}async function sendIntro(){const input=document.getElementById('shareEmail'),msg=document.getElementById('mailMsg'),btn=document.getElementById('sendBtn'),to=input.value.trim();if(!input.checkValidity()||!to){msg.textContent='正しいメールアドレスを入力してください。';return}btn.disabled=true;btn.textContent='送信中…';msg.textContent='';try{const r=await fetch('https://wyxuekjikvflpcmlliwn.supabase.co/functions/v1/share-driver-spot-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to})});const x=await r.json();if(!r.ok)throw new Error(x.detail||x.error||'送信できませんでした');msg.textContent='スポドラの紹介メールを送信しました。';input.value=''}catch(e){msg.textContent='送信できませんでした。時間をおいてもう一度お試しください。'}finally{btn.disabled=false;btn.textContent='送信する'}}</script></body></html>
