<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIVER SPOT</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Helvetica Neue", sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #dbe3ef;
      padding: 22px;
    }

    header h1 {
      margin: 0;
      color: #1769d2;
    }

    header p {
      margin: 6px 0 0;
      color: #68758b;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .status {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #dbe3ef;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      border: 1px solid #1769d2;
      background: white;
      color: #1769d2;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button.active {
      background: #1769d2;
      color: white;
    }

    .card {
      background: white;
      border: 1px solid #dbe3ef;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .card h2 {
      margin-top: 0;
    }

    .location {
      color: #68758b;
    }

    .salary {
      font-size: 22px;
      font-weight: bold;
      color: #e64728;
      margin: 10px 0;
    }

    .badge {
      display: inline-block;
      background: #edf4ff;
      color: #1769d2;
      padding: 5px 10px;
      border-radius: 999px;
      margin-right: 5px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #68758b;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>DRIVER SPOT</h1>
  <p>ドライバーと企業を直接つなぐ求人プラットフォーム</p>
</header>

<main>

  <div class="status">
    Supabase接続：
    <span id="connectionStatus">確認中...</span>
  </div>

  <div class="tabs">
    <button class="active" onclick="loadJobs()">求人を見る</button>
    <button onclick="showDriver()">ドライバー登録</button>
    <button onclick="showCompany()">企業登録</button>
  </div>

  <div id="content">
    <div class="empty">求人情報を読み込んでいます...</div>
  </div>

</main>

<script>
const SUPABASE_URL =
  "https://wyxuekjikvflpcmlliwn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadJobs() {

  const status =
    document.getElementById("connectionStatus");

  const content =
    document.getElementById("content");

  status.textContent = "接続中...";

  const { data, error } =
    await db
      .from("jobs")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    status.textContent = "接続エラー";
    status.className = "error";

    content.innerHTML =
      '<div class="card error">' +
      error.message +
      '</div>';

    return;
  }

  status.textContent = "接続成功";
  status.className = "success";

  if (!data || data.length === 0) {

    content.innerHTML =
      '<div class="card empty">' +
      '<h2>現在、登録求人はありません</h2>' +
      '<p>Supabaseとの接続には成功しています。</p>' +
      '</div>';

    return;
  }

  content.innerHTML =
    data.map(job => `

      <div class="card">

        <h2>
          ${escapeHtml(job.title || "")}
        </h2>

        <div class="location">
          ${escapeHtml(job.location || "勤務地未設定")}
        </div>

        <div class="salary">
          ${escapeHtml(job.salary || "給与応相談")}
        </div>

        <span class="badge">
          ${escapeHtml(job.employment_type || "雇用形態未設定")}
        </span>

        <p>
          ${escapeHtml(job.description || "")}
        </p>

      </div>

    `).join("");
}

function showDriver() {

  document.getElementById("content").innerHTML = `

    <div class="card">

      <h2>ドライバー登録</h2>

      <p>
        次の工程で、氏名・免許・経験・希望条件などを
        登録できるようにします。
      </p>

    </div>

  `;
}

function showCompany() {

  document.getElementById("content").innerHTML = `

    <div class="card">

      <h2>企業登録</h2>

      <p>
        次の工程で、企業情報と求人情報を
        登録できるようにします。
      </p>

    </div>

  `;
}

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadJobs();
</script>

</body>
</html>
