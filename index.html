<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜ドライバーと企業をやさしくつなぐ</title><meta name="description" content="スポドラは、ドライバーと企業をやさしくつなぐスポットワークサービスです。求人検索・応募・採用・勤怠管理までスムーズに。"><meta property="og:type" content="website"><meta property="og:site_name" content="スポドラ"><meta property="og:title" content="スポドラ｜ドライバーと企業をやさしくつなぐ"><meta property="og:description" content="ドライバーの仕事探しから、企業の求人掲載・採用・勤怠管理まで。"><meta property="og:url" content="https://hs-azuma.github.io/driver-spot/"><meta property="og:image" content="https://hs-azuma.github.io/driver-spot/assets/supodora-logo-final.png"><meta name="twitter:card" content="summary_large_image"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033;min-height:100vh}.wrap{max-width:920px;margin:auto;padding:70px 24px}.brand{text-align:center;margin-bottom:42px}.brand img{display:block;width:300px;max-width:72vw;height:auto;margin:0 auto 14px}.brand p{color:#68758b;font-size:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:24px}.portal{background:#fff;border:1px solid #dbe3ef;border-radius:20px;padding:38px 30px;text-align:center;box-shadow:0 8px 30px rgba(23,32,51,.05)}.icon{font-size:46px}.portal h2{font-size:27px;margin:14px 0 8px}.portal p{color:#68758b;line-height:1.7;min-height:58px}.btn{display:block;text-decoration:none;padding:16px;border-radius:12px;font-weight:bold;font-size:18px;margin-top:24px}.driver .btn{background:#1769d2;color:#fff}.business .btn{background:#172033;color:#fff}.share{margin:32px auto 0;text-align:center}.share button{border:1px solid #cbd7e8;background:#fff;color:#1769d2;border-radius:10px;padding:11px 16px;margin:5px;font-weight:bold;font-size:14px;cursor:pointer}.mailbox,.qrbox{display:none;max-width:520px;margin:18px auto 0;background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px}.mailbox.open,.qrbox.open{display:block}.mailbox label{display:block;text-align:left;font-weight:bold;margin-bottom:8px}.mailrow{display:flex;gap:8px}.mailrow input{flex:1;min-width:0;border:1px solid #cbd7e8;border-radius:10px;padding:13px;font-size:16px}.mailrow button{margin:0;background:#1769d2;color:#fff;border-color:#1769d2;min-width:100px}.qrbox h3{margin:0 0 8px}.qrbox p{color:#68758b;line-height:1.5}.qrimg{display:flex;justify-content:center;margin:18px auto}.msg{font-size:13px;margin:10px 0 0;min-height:18px}.sub{font-size:13px;color:#8a94a6;text-align:center;margin-top:28px}@media(max-width:700px){.wrap{padding:42px 16px}.brand img{width:250px}.choices{grid-template-columns:1fr}.portal{padding:28px 22px}.portal p{min-height:0}.share>button{display:block;width:100%;margin:8px 0}.mailrow{display:block}.mailrow button{display:block;width:100%;margin-top:8px}}</style></head><body><main class="wrap"><div class="brand"><img src="./assets/supodora-logo-final.png?v=20261001c" alt="スポドラ"><p>ドライバーと企業をやさしくつなぐ</p></div><div class="choices"><section class="portal driver"><div class="icon">🚚</div><h2>ドライバーの方</h2><p>求人を探す・応募する・仕事を管理する<br>出退勤QRもこちらから</p><a class="btn" id="driverLink" href="./driver.html">ドライバーサイトへ</a></section><section class="portal business"><div class="icon">🏢</div><h2>企業の方</h2><p>求人掲載・応募者管理・採用管理<br>勤怠・QR打刻を管理</p><a class="btn" id="businessLink" href="./company-register.html">企業サイトへ</a></section></div><div class="share"><button type="button" onclick="shareSite()">共有する</button><button type="button" onclick="toggleQR()">QRコードで紹介</button><button type="button" onclick="toggleMail()">メールで紹介</button><div id="qrbox" class="qrbox"><h3>スポドラを紹介</h3><p>相手のスマートフォンで読み取ると、スポドラのトップ画面が開きます。</p><div id="shareQR" class="qrimg"></div><p>チラシ・名刺・店頭案内にもこのQRを使えます。</p></div><div id="mailbox" class="mailbox"><label for="shareEmail">紹介したい相手のメールアドレス</label><div class="mailrow"><input id="shareEmail" type="email" inputmode="email" autocomplete="email" placeholder="example@example.com"><button id="sendBtn" type="button" onclick="sendIntro()">送信する</button></div><p id="mailMsg" class="msg"></p></div></div><p class="sub">スポドラ</p></main><script>const BASE='https://hs-azuma.github.io/driver-spot/';const params=new URLSearchParams(location.search);const tracking=['utm_source','utm_medium','utm_campaign','utm_content','ref'];const campaign=new URLSearchParams();tracking.forEach(k=>{if(params.get(k))campaign.set(k,params.get(k))});function withTracking(path){const u=new URL(path,BASE);campaign.forEach((v,k)=>u.searchParams.set(k,v));return u.href}document.getElementById('driverLink').href=withTracking('./driver.html');document.getElementById('businessLink').href=withTracking('./company-register.html');try{if([...campaign].length)localStorage.setItem('spodora_acquisition',JSON.stringify(Object.fromEntries(campaign)))}catch(e){}const shareUrl=withTracking('./');const siteData={title:'スポドラ｜ドライバーと企業をやさしくつなぐ',text:'スポドラ\nドライバーと企業をやさしくつなぐ\n\n仕事探し・求人掲載・採用・勤怠管理までスムーズに。\n\nスポドラを見る',url:shareUrl};async function shareSite(){if(navigator.share){try{await navigator.share(siteData)}catch(e){}}else{try{await navigator.clipboard.writeText(siteData.text+'\n'+siteData.url);alert('スポドラの紹介文とURLをコピーしました。')}catch(e){}}}let qrMade=false;function toggleQR(){const box=document.getElementById('qrbox');box.classList.toggle('open');if(box.classList.contains('open')&&!qrMade){new QRCode(document.getElementById('shareQR'),{text:withTracking('./?utm_source=qr&utm_medium=offline&utm_campaign=share'),width:230,height:230,correctLevel:QRCode.CorrectLevel.M});qrMade=true}}function toggleMail(){document.getElementById('mailbox').classList.toggle('open');setTimeout(()=>document.getElementById('shareEmail').focus(),50)}async function sendIntro(){const input=document.getElementById('shareEmail'),msg=document.getElementById('mailMsg'),btn=document.getElementById('sendBtn'),to=input.value.trim();if(!input.checkValidity()||!to){msg.textContent='正しいメールアドレスを入力してください。';return}btn.disabled=true;btn.textContent='送信中…';msg.textContent='';try{const r=await fetch('https://wyxuekjikvflpcmlliwn.supabase.co/functions/v1/share-driver-spot-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,url:withTracking('./?utm_source=email&utm_medium=referral&utm_campaign=share')})});const x=await r.json();if(!r.ok)throw new Error(x.detail||x.error||'送信できませんでした');msg.textContent='スポドラの紹介メールを送信しました。';input.value=''}catch(e){msg.textContent='送信できませんでした。時間をおいてもう一度お試しください。'}finally{btn.disabled=false;btn.textContent='送信する'}}</script></body></html>
