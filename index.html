<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}header a{color:#1769d2;text-decoration:none}main{max-width:1000px;margin:auto;padding:25px}.card,.status{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:16px;margin-bottom:20px}.tabs,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tabs{margin-bottom:20px}button{border:1px solid #1769d2;background:white;color:#1769d2;padding:12px 18px;border-radius:10px;font-weight:bold}.primary{background:#1769d2;color:white}.danger{border-color:#dc2626;color:#dc2626}.badge,.decision{display:inline-block;background:#edf4ff;color:#1769d2;padding:6px 10px;border-radius:999px}.green{background:#e9f8ef;color:#16803c;font-weight:bold}.yellow{background:#fff7df;color:#9a6700}.red{background:#fff0f0;color:#c62828}.salary{font-size:22px;font-weight:bold;color:#e64728}.notice{background:#e9f8ef;border:1px solid #bde6ca;color:#16803c;padding:12px;border-radius:10px;font-weight:bold}.summary{background:#f4f7fb;border:1px solid #dbe3ef;border-radius:10px;padding:10px 14px;font-weight:bold}.qr{text-align:center}.qr #driverQr{display:flex;justify-content:center;margin:15px}input,select{width:100%;max-width:560px;padding:12px;margin:6px 0 12px}.password-row{display:flex;gap:8px;max-width:560px}.password-row input{flex:1}</style></head><body><header><h1><a href="./">DRIVER SPOT</a></h1><p>ドライバーと企業を直接つなぐ求人プラットフォーム</p></header><main><div class="status row"><span id="authStatus">確認中...</span><span style="margin-left:auto"></span><button id="authBtn" onclick="showLogin()">ログイン</button></div><div class="tabs"><button onclick="loadJobs()">求人を見る</button><button onclick="showMyPage()">応募・仕事管理</button><button onclick="showMyQR()">出退勤QR</button><button onclick="showDriver()">ドライバー登録</button><button onclick="location.href='./company-register.html'">企業・求人登録</button></div><div id="content"></div></main><script>
const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let currentUser,currentDriver;const $=x=>document.getElementById(x),v=x=>$(x)?.value.trim()||'',e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),tm=x=>x?String(x).slice(0,5):'';async function auth(){currentUser=(await db.auth.getUser()).data.user||null;currentDriver=null;if(currentUser){let r=await db.from('drivers').select('*').eq('user_id',currentUser.id).maybeSingle();currentDriver=r.data}$('authStatus').textContent=currentUser?(currentDriver?currentDriver.name+'さん ログイン中':currentUser.email+' ログイン中'):'未ログイン';$('authBtn').textContent=currentUser?'ログアウト':'ログイン';$('authBtn').onclick=currentUser?logout:showLogin}async function logout(){await db.auth.signOut();loadJobs()}function state(s){if(s==='勤務完了')return '<span class="decision green">勤務完了</span>';if(s==='勤務確定')return '<span class="decision green">勤務確定</span>';if(s==='採用')return '<span class="decision green">採用済み</span>';if(s==='採用候補')return '<span class="decision yellow">採用候補</span>';if(s==='見送り')return '<span class="decision red">見送り</span>';return '<span class="decision">応募中</span>'}function showLogin(){$('content').innerHTML=`<div class="card"><h2>ログイン</h2><input id="em" placeholder="メールアドレス"><div class="password-row"><input id="pw" type="password" placeholder="パスワード"><button onclick="let x=$('pw');x.type=x.type==='password'?'text':'password'">表示</button></div><button class="primary" onclick="login()">ログイン</button></div>`}async function login(){let r=await db.auth.signInWithPassword({email:v('em'),password:v('pw')});if(r.error)return alert(r.error.message);loadJobs()}async function loadJobs(){await auth();let r=await db.from('jobs').select('*').order('created_at',{ascending:false}),jobs=r.data||[],apps=new Map(),blocked=new Set();if(currentDriver){let a=await db.from('applications').select('id,job_id,status').eq('driver_id',currentDriver.id);(a.data||[]).forEach(x=>apps.set(Number(x.job_id),x));let b=await db.from('company_driver_blocks').select('company_id').eq('driver_id',currentDriver.id);(b.data||[]).forEach(x=>blocked.add(Number(x.company_id)));jobs=jobs.filter(j=>!blocked.has(Number(j.company_id)))}$('content').innerHTML=jobs.map(j=>{let a=apps.get(Number(j.id));return `<div class="card"><h2>${e(j.job_description||'ドライバー求人')}</h2><p>${e(j.location||'')}${j.destination?' → '+e(j.destination):''}</p><div class="salary">${e(j.pay_type||'')} ${Number(j.pay_amount||0).toLocaleString()}円</div><p>${e(j.work_date||'')} ${tm(j.start_time)}〜${tm(j.end_time)}</p><div class="row">${a?state(a.status)+(a.status==='応募中'||a.status==='採用候補'?` <button class="danger" onclick="cancelApp(${a.id})">応募をキャンセル</button>`:''):`<button class="primary" onclick="apply(${j.id})">この求人に応募する</button>`}</div></div>`}).join('')||'<div class="card">現在、表示できる求人はありません。</div>'}async function showMyPage(){await auth();if(!currentUser)return showLogin();if(!currentDriver)return showDriver();let r=await db.from('applications').select('id,status,hired_at,work_confirmed_at,completed_at,jobs(job_description,work_date,location,destination,start_time,end_time,pay_type,pay_amount,companies(company_name))').eq('driver_id',currentDriver.id);if(r.error)return $('content').innerHTML='<div class="card">'+e(r.error.message)+'</div>';let rows=(r.data||[]).sort((a,b)=>String(b.jobs?.work_date||'').localeCompare(String(a.jobs?.work_date||''))),count=s=>rows.filter(x=>x.status===s).length;$('content').innerHTML=`<div class="card"><h2>${e(currentDriver.name)}さんの応募・仕事管理</h2><div class="row"><span class="summary">応募 ${rows.length}件</span><span class="summary">採用 ${rows.filter(x=>['採用','勤務確定','勤務完了'].includes(x.status)).length}件</span><span class="summary">勤務確定 ${count('勤務確定')}件</span><span class="summary">勤務完了 ${count('勤務完了')}件</span></div></div>`+rows.map(a=>{let j=a.jobs||{},notice=a.status==='勤務完了'?'勤務お疲れさまでした。勤務完了として記録されています。':a.status==='勤務確定'?'勤務が確定しました。日時・場所をご確認ください。':a.status==='採用'?'🎉 採用されました':'';return `<div class="card">${notice?`<div class="notice">${notice}</div>`:''}<div class="row"><h3>${e(j.job_description||'')}</h3>${state(a.status)}</div><p><b>${e(j.companies?.company_name||'')}</b></p><p>${e(j.work_date||'')}　${tm(j.start_time)}〜${tm(j.end_time)}</p><p>${e(j.location||'')}${j.destination?' → '+e(j.destination):''}</p><p>${e(j.pay_type||'')} ${Number(j.pay_amount||0).toLocaleString()}円</p>${a.status==='応募中'||a.status==='採用候補'?`<button class="danger" onclick="cancelApp(${a.id},true)">応募をキャンセル</button>`:''}</div>`}).join('')}async function showMyQR(){await auth();if(!currentDriver)return showDriver();if(!currentDriver.attendance_token){$('content').innerHTML='<div class="card">出退勤QRを準備中です。再読み込みしてください。</div>';return}let text='DRIVERSPOT:'+currentDriver.attendance_token;$('content').innerHTML=`<div class="card qr"><h2>あなたの出退勤QR</h2><p><b>${e(currentDriver.name)}さん</b></p><div id="driverQr"></div><p>勤務先の会社端末にこのQRをかざしてください。<br>会社端末側で「出勤」または「退勤」を選択して読み取ります。</p></div>`;new QRCode($('driverQr'),{text,width:280,height:280,correctLevel:QRCode.CorrectLevel.M})}async function apply(id){if(!currentUser)return showLogin();if(!currentDriver)return showDriver();if(!confirm('応募しますか？'))return;let r=await db.from('applications').insert({job_id:id,driver_id:currentDriver.id,status:'応募中'});if(r.error)return alert(r.error.message);loadJobs()}async function cancelApp(id,m=false){if(!confirm('応募をキャンセルしますか？'))return;let r=await db.from('applications').delete().eq('id',id);if(r.error)return alert(r.error.message);m?showMyPage():loadJobs()}async function showDriver(){await auth();if(currentDriver){$('content').innerHTML=`<div class="card"><h2>ドライバー登録済み</h2><p>${e(currentDriver.name)}さん</p><button onclick="showMyPage()">応募・仕事管理</button></div>`;return}if(!currentUser){$('content').innerHTML='<div class="card"><h2>ドライバー登録</h2><p>先にログインしてください。</p><button onclick="showLogin()">ログイン</button></div>';return}$('content').innerHTML=`<div class="card"><h2>ドライバープロフィール登録</h2><input id="nm" placeholder="氏名"><input id="ph" placeholder="電話番号"><input id="ar" placeholder="希望エリア"><select id="li"><option>普通</option><option>準中型</option><option>中型</option><option>大型</option></select><select id="ex"><option value="0">1年未満</option><option value="2">1〜3年</option><option value="4">4年以上</option></select><button class="primary" onclick="saveDriver()">登録する</button></div>`}async function saveDriver(){let r=await db.from('drivers').upsert({user_id:currentUser.id,name:v('nm'),phone:v('ph'),email:currentUser.email,area:v('ar'),license_type:v('li'),experience_years:Number(v('ex'))},{onConflict:'user_id'});if(r.error)return alert(r.error.message);loadJobs()}db.auth.onAuthStateChange(()=>setTimeout(auth,0));loadJobs();
</script></body></html>
