<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DRIVER SPOT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #dbe3ef;padding:22px}header h1{margin:0;color:#1769d2}header p{margin:6px 0 0;color:#68758b}main{max-width:1000px;margin:auto;padding:25px}.status,.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:16px;margin-bottom:20px}.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}button{border:1px solid #1769d2;background:#fff;color:#1769d2;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold}button.active,.primary{background:#1769d2;color:#fff}.card{border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.location{color:#68758b}.salary{font-size:22px;font-weight:bold;color:#e64728;margin:10px 0}.badge{display:inline-block;background:#edf4ff;color:#1769d2;padding:5px 10px;border-radius:999px;margin-right:5px}.empty{text-align:center;padding:40px;color:#68758b}.error{color:#c62828;font-weight:bold}.success{color:#16803c;font-weight:bold}input,select,textarea{width:100%;max-width:560px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}textarea{min-height:90px}label{display:block;margin:16px 0 6px;font-weight:bold}.hint{font-size:13px;color:#68758b}.form-message{margin-top:16px}.section-title{margin-top:30px;border-top:1px solid #e5e7eb;padding-top:20px}</style>
</head><body>
<header><h1>DRIVER SPOT</h1><p>ドライバーと企業を直接つなぐ求人プラットフォーム</p></header><main>
<div class="status">Supabase接続：<span id="connectionStatus">確認中...</span></div>
<div class="tabs"><button onclick="loadJobs()">求人を見る</button><button onclick="showDriver()">ドライバー登録</button><button onclick="showCompany()">企業・求人登録</button></div>
<div id="content"><div class="empty">求人情報を読み込んでいます...</div></div></main>
<script>
const SUPABASE_URL="https://wyxuekjikvflpcmlliwn.supabase.co";const SUPABASE_KEY="sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const jp='lang="ja" style="ime-mode:active"';const latin='lang="en" inputmode="text" style="ime-mode:inactive"';
async function loadJobs(){const status=document.getElementById("connectionStatus"),content=document.getElementById("content");status.textContent="接続中...";try{const {data,error}=await db.from("jobs").select("*").order("created_at",{ascending:false});if(error)throw error;status.textContent="接続成功";status.className="success";if(!data||!data.length){content.innerHTML='<div class="card empty"><h2>現在、登録求人はありません</h2><p>Supabaseとの接続には成功しています。</p></div>';return}content.innerHTML=data.map(j=>`<div class="card"><h2>${escapeHtml(j.job_description||"ドライバー求人")}</h2><div class="location">${escapeHtml(j.location||"")}${j.destination?' → '+escapeHtml(j.destination):''}</div><div class="salary">時給 ${Number(j.hourly_wage||0).toLocaleString()}円</div><span class="badge">${escapeHtml(j.vehicle_type||"車種未設定")}</span><span class="badge">${escapeHtml(j.required_license||"免許条件なし")}</span><p>${escapeHtml(j.work_date||"")} ${escapeHtml(j.start_time||"")}〜${escapeHtml(j.end_time||"")}</p></div>`).join("")}catch(e){status.textContent="接続エラー";status.className="error";content.innerHTML='<div class="card error">'+escapeHtml(e.message||String(e))+'</div>'}}
function showDriver(){document.getElementById("content").innerHTML=`<div class="card"><h2>ドライバー登録</h2><label>氏名</label><input id="driverName" ${jp} autocomplete="name" placeholder="例：山田 太郎"><label>電話番号</label><input id="driverPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="例：090-1234-5678"><label>メールアドレス</label><input id="driverEmail" type="email" inputmode="email" autocomplete="email" placeholder="例：sample@example.com"><label>住所・希望エリア</label><input id="driverArea" ${jp} autocomplete="street-address" placeholder="例：大阪府大阪市"><label>免許種類</label><select id="driverLicense"><option value="">選択してください</option><option>普通</option><option>準中型</option><option>中型</option><option>大型</option><option>けん引</option></select><label>ドライバー経験年数</label><input id="driverExperienceYears" type="number" inputmode="numeric" min="0" step="1" placeholder="例：10"><br><br><button class="primary" id="driverSubmit" onclick="registerDriver()">登録する</button><p id="driverMessage" class="form-message"></p></div>`}
async function registerDriver(){const m=document.getElementById("driverMessage"),b=document.getElementById("driverSubmit"),name=v("driverName"),phone=v("driverPhone"),email=v("driverEmail"),area=v("driverArea"),license_type=v("driverLicense"),raw=v("driverExperienceYears"),experience_years=raw===""?0:Number(raw);if(!name)return msg(m,"氏名を入力してください。",false);if(!Number.isInteger(experience_years)||experience_years<0)return msg(m,"経験年数は0以上の整数で入力してください。",false);b.disabled=true;m.className="";m.textContent="登録中...";try{const {error}=await db.from("drivers").insert([{name,phone,email,area,license_type,experience_years}]);if(error)throw error;msg(m,"登録が完了しました！",true)}catch(e){msg(m,"登録エラー："+(e.message||e),false);b.disabled=false}}
function showCompany(){document.getElementById("content").innerHTML=`<div class="card"><h2>企業登録</h2><label>会社名</label><input id="companyName" ${jp} autocomplete="organization" placeholder="例：浪速運送株式会社"><label>担当者名</label><input id="contactName" ${jp} autocomplete="name" placeholder="例：山田 太郎"><label>電話番号</label><input id="companyPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="例：06-1234-5678"><label>メールアドレス</label><input id="companyEmail" type="email" inputmode="email" autocomplete="email" placeholder="例：recruit@example.com"><label>会社住所</label><input id="companyAddress" ${jp} autocomplete="street-address" placeholder="例：大阪府大阪市"><br><br><button class="primary" id="companySubmit" onclick="registerCompany()">企業を登録して求人入力へ</button><p id="companyMessage" class="form-message"></p></div>`}
async function registerCompany(){const m=document.getElementById("companyMessage"),b=document.getElementById("companySubmit"),company_name=v("companyName"),contact_name=v("contactName"),phone=v("companyPhone"),email=v("companyEmail"),address=v("companyAddress");if(!company_name)return msg(m,"会社名を入力してください。",false);b.disabled=true;m.textContent="登録中...";try{const {data,error}=await db.from("companies").insert([{company_name,contact_name,phone,email,address}]).select("id").single();if(error)throw error;showJobForm(data.id,company_name)}catch(e){msg(m,"登録エラー："+(e.message||e),false);b.disabled=false}}
function showJobForm(companyId,companyName){document.getElementById("content").innerHTML=`<div class="card"><h2>求人登録</h2><p><b>${escapeHtml(companyName)}</b> の求人を登録します。</p><label>勤務日</label><input id="workDate" type="date"><label>開始時間</label><input id="startTime" type="time"><label>終了時間</label><input id="endTime" type="time"><label>出発地・勤務地</label><input id="jobLocation" ${jp} placeholder="例：大阪市浪速区"><label>配送先</label><input id="destination" ${jp} placeholder="例：神戸市中央区"><label>車種</label><select id="vehicleType"><option value="">選択してください</option><option>軽貨物</option><option>1t</option><option>2t</option><option>4t</option><option>大型</option><option>トレーラー</option></select><label>仕事内容</label><textarea id="jobDescription" ${jp} placeholder="仕事内容を入力"></textarea><label>必要免許</label><select id="requiredLicense"><option value="">選択してください</option><option>普通</option><option>準中型</option><option>中型</option><option>大型</option><option>けん引</option></select><label>必要経験</label><input id="requiredExperience" ${jp} placeholder="例：4t車経験1年以上"><label>時給</label><input id="hourlyWage" type="number" inputmode="numeric" min="0" step="1" placeholder="例：1800"><label>交通費</label><input id="transportationFee" type="number" inputmode="numeric" min="0" step="1" value="0"><br><br><button class="primary" id="jobSubmit" onclick="registerJob(${Number(companyId)})">求人を登録する</button><p id="jobMessage" class="form-message"></p></div>`}
async function registerJob(company_id){const m=document.getElementById("jobMessage"),b=document.getElementById("jobSubmit"),work_date=v("workDate"),start_time=v("startTime")||null,end_time=v("endTime")||null,location=v("jobLocation"),destination=v("destination"),vehicle_type=v("vehicleType"),job_description=v("jobDescription"),required_license=v("requiredLicense"),required_experience=v("requiredExperience"),hourly_wage=Number(v("hourlyWage")),transportation_fee=Number(v("transportationFee")||0);if(!work_date||!location||!hourly_wage)return msg(m,"勤務日・勤務地・時給は必須です。",false);b.disabled=true;m.textContent="登録中...";try{const {error}=await db.from("jobs").insert([{company_id,work_date,start_time,end_time,location,destination,vehicle_type,job_description,required_license,required_experience,hourly_wage,transportation_fee}]);if(error)throw error;msg(m,"求人登録が完了しました！",true);setTimeout(loadJobs,900)}catch(e){msg(m,"登録エラー："+(e.message||e),false);b.disabled=false}}
function v(id){return document.getElementById(id).value.trim()}function msg(el,text,ok){el.className=(ok?"success":"error")+" form-message";el.textContent=text}function escapeHtml(x){return String(x).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}loadJobs();
</script></body></html>
