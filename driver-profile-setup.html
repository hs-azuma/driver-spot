<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜プロフィール</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}main{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}h2{margin-top:0}.note{color:#68758b;line-height:1.6}label{display:block;font-weight:bold;margin:16px 0 6px}input,select{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;font-size:16px;background:#fff}.btn{width:100%;margin-top:22px;border:0;border-radius:10px;padding:15px 18px;font-weight:bold;font-size:17px;background:#1769d2;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#1769d2}.msg{margin-top:14px;font-weight:bold}.spodora-brand{display:block;width:300px;max-width:72vw;text-decoration:none;margin:0 0 12px}.spodora-brand img{display:block;width:100%;height:auto}@media(max-width:650px){.spodora-brand{width:240px;max-width:72vw}}</style></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>ドライバープロフィール</p></header><main><div class="card"><h2 id="title">プロフィール情報</h2><p id="note" class="note">登録内容を確認・変更できます。</p><label>氏名</label><input id="nm" autocomplete="name" placeholder="氏名"><label>電話番号</label><input id="ph" type="tel" autocomplete="tel" placeholder="090-1234-5678"><label>希望エリア</label><input id="ar" placeholder="例：大阪府・奈良県"><label>保有免許</label><select id="li"><option value="普通">普通</option><option value="準中型">準中型</option><option value="中型">中型</option><option value="大型">大型</option></select><label>ドライバー経験</label><select id="ex"><option value="0">1年未満</option><option value="2">1〜3年</option><option value="4">4年以上</option></select><button id="saveBtn" class="btn" onclick="save()">変更を保存</button><div id="msg" class="msg"></div><a class="back" href="./driver.html">ドライバー画面へ戻る</a></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=x=>document.getElementById(x);let user=null,existing=false;async function init(){user=(await db.auth.getUser()).data.user;if(!user){location.href='./driver.html?login=1';return}const r=await db.from('drivers').select('*').eq('user_id',user.id).maybeSingle();if(r.data){existing=true;$('nm').value=r.data.name||'';$('ph').value=r.data.phone||'';$('ar').value=r.data.area||'';$('li').value=r.data.license_type||'普通';$('ex').value=String(r.data.experience_years??0);$('title').textContent='プロフィール情報変更';$('note').textContent='現在の登録内容です。変更したい項目を書き換えて保存してください。';$('saveBtn').textContent='変更を保存'}else{$('title').textContent='あと1ステップです';$('note').textContent='求人への応募に必要な基本情報を登録してください。';$('saveBtn').textContent='登録して求人を見る'}}async function save(){const name=$('nm').value.trim(),phone=$('ph').value.trim(),area=$('ar').value.trim();if(!name||!phone||!area){$('msg').style.color='#c62828';$('msg').textContent='氏名・電話番号・希望エリアを入力してください。';return}const b=$('saveBtn');b.disabled=true;b.textContent='保存中…';const r=await db.from('drivers').upsert({user_id:user.id,name,phone,email:user.email,area,license_type:$('li').value,experience_years:Number($('ex').value)},{onConflict:'user_id'});if(r.error){$('msg').style.color='#c62828';$('msg').textContent=r.error.message;b.disabled=false;b.textContent=existing?'変更を保存':'登録して求人を見る';return}if(existing){$('msg').style.color='#16803c';$('msg').textContent='プロフィール情報を変更しました。';b.disabled=false;b.textContent='変更を保存'}else{location.href='./driver.html'}}init();</script></body></html>
