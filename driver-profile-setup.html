<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜プロフィール登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}header a{color:#1769d2;text-decoration:none}main{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}h2{margin-top:0}.note{color:#68758b;line-height:1.6}label{display:block;font-weight:bold;margin:16px 0 6px}input,select{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;font-size:16px;background:#fff}.btn{width:100%;margin-top:22px;border:0;border-radius:10px;padding:15px 18px;font-weight:bold;font-size:17px;background:#1769d2;color:#fff}.msg{margin-top:14px;font-weight:bold;color:#c62828}</style></head><body><header><h1><a href="./driver.html">スポドラ</a></h1><p>ドライバープロフィール登録</p></header><main><div class="card"><h2>あと1ステップです</h2><p class="note">求人への応募に必要な基本情報を登録してください。登録後、そのまま求人画面へ進みます。</p><label>氏名</label><input id="nm" autocomplete="name" placeholder="氏名"><label>電話番号</label><input id="ph" type="tel" autocomplete="tel" placeholder="090-1234-5678"><label>希望エリア</label><input id="ar" placeholder="例：大阪府・奈良県"><label>保有免許</label><select id="li"><option value="普通">普通</option><option value="準中型">準中型</option><option value="中型">中型</option><option value="大型">大型</option></select><label>ドライバー経験</label><select id="ex"><option value="0">1年未満</option><option value="2">1〜3年</option><option value="4">4年以上</option></select><button id="saveBtn" class="btn" onclick="save()">登録して求人を見る</button><div id="msg" class="msg"></div></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=x=>document.getElementById(x);let user=null;async function init(){user=(await db.auth.getUser()).data.user;if(!user){location.href='./driver.html?login=1';return}const r=await db.from('drivers').select('*').eq('user_id',user.id).maybeSingle();if(r.data){$('nm').value=r.data.name||'';$('ph').value=r.data.phone||'';$('ar').value=r.data.area||'';$('li').value=r.data.license_type||'普通';$('ex').value=String(r.data.experience_years??0)}}async function save(){const name=$('nm').value.trim(),phone=$('ph').value.trim(),area=$('ar').value.trim();if(!name||!phone||!area){$('msg').textContent='氏名・電話番号・希望エリアを入力してください。';return}const b=$('saveBtn');b.disabled=true;b.textContent='登録中…';const r=await db.from('drivers').upsert({user_id:user.id,name,phone,email:user.email,area,license_type:$('li').value,experience_years:Number($('ex').value)},{onConflict:'user_id'});if(r.error){$('msg').textContent=r.error.message;b.disabled=false;b.textContent='登録して求人を見る';return}location.href='./driver.html'}init();</script></body></html>
