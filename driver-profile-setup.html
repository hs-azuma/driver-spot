<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜プロフィール変更</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}main{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}.note{color:#68758b;line-height:1.6}label{display:block;font-weight:bold;margin:16px 0 6px}input,select{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;font-size:16px;background:#fff}.btn{width:100%;margin-top:22px;border:0;border-radius:10px;padding:15px;font-weight:bold;font-size:17px;background:#1769d2;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#1769d2}.msg{margin-top:14px;font-weight:bold}.spodora-brand{display:block;width:300px;max-width:72vw}.spodora-brand img{display:block;width:100%;height:auto}@media(max-width:650px){.spodora-brand{width:240px}}</style></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>ドライバープロフィール</p></header><main><div class="card"><h2>プロフィール情報変更</h2><p class="note">現在の登録内容を変更できます。</p><label>氏名</label><input id="nm"><label>電話番号</label><input id="ph" type="tel"><label>希望エリア</label><input id="ar"><label>保有免許</label><select id="li"><option>普通</option><option>準中型</option><option>中型</option><option>大型</option></select><label>ドライバー経験</label><select id="ex"><option>1年未満</option><option>1〜3年</option><option>3〜5年</option><option>5年以上</option></select><button id="saveBtn" class="btn" onclick="save()">変更を保存</button><div id="msg" class="msg"></div><a class="back" href="./driver.html">ドライバー画面へ戻る</a></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=x=>document.getElementById(x);let user=null;async function init(){user=(await db.auth.getUser()).data.user;if(!user){location.href='./driver.html';return}const r=await db.from('drivers').select('*').eq('user_id',user.id).maybeSingle();if(r.error){$('msg').style.color='#c62828';$('msg').textContent=r.error.message;return}if(!r.data){location.href='./driver.html';return}$('nm').value=r.data.name||'';$('ph').value=r.data.phone||'';$('ar').value=r.data.preferred_area||'';$('li').value=r.data.license_type||'普通';$('ex').value=r.data.experience||'1年未満'}async function save(){const name=$('nm').value.trim(),phone=$('ph').value.trim(),preferred_area=$('ar').value.trim();if(!name||!phone||!preferred_area){$('msg').style.color='#c62828';$('msg').textContent='氏名・電話番号・希望エリアを入力してください。';return}const b=$('saveBtn');b.disabled=true;b.textContent='保存中…';const r=await db.from('drivers').update({name,phone,preferred_area,license_type:$('li').value,experience:$('ex').value}).eq('user_id',user.id);if(r.error){$('msg').style.color='#c62828';$('msg').textContent=r.error.message}else{$('msg').style.color='#16803c';$('msg').textContent='プロフィール情報を変更しました。'}b.disabled=false;b.textContent='変更を保存'}init();</script></body></html>
