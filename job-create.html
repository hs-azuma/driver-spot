<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT 求人登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}main{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:22px}label{display:block;font-weight:bold;margin:15px 0 6px}input,select,textarea{display:block;width:100%;max-width:100%;min-width:0;height:48px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:#fff}textarea{min-height:90px;height:auto}.field{min-width:0;width:auto;overflow:hidden}button{padding:12px 18px;border-radius:9px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold;margin-top:18px}.primary{background:#1769d2;color:#fff}.row{display:grid;grid-template-columns:calc(50% - 12px) calc(50% - 12px);gap:24px;width:100%;align-items:end}.note{color:#68758b}@media(max-width:650px){main{padding:14px}.card{padding:18px}.row{grid-template-columns:100%;gap:0}}</style></head><body><main><div class="card"><h1>求人登録</h1><p id="company" class="note">確認中...</p><label>仕事内容</label><input id="desc" placeholder="例：アパレル店舗配送"><div class="row"><div class="field"><label>集荷/配送先（出発）</label><input id="loc"></div><div class="field"><label>集荷/配送先（到着）</label><input id="dest"></div></div><div class="row"><div class="field"><label>勤務日</label><input id="date" type="date"></div><div class="field"><label>必要人数</label><input id="head" type="number" min="1" step="1" value="1"></div></div><div class="row"><div class="field"><label>開始</label><input id="start" type="time"></div><div class="field"><label>終了</label><input id="end" type="time"></div></div><div class="row"><div class="field"><label>給与形態</label><select id="ptype"><option>時給</option><option>日給</option></select></div><div class="field"><label>給与</label><input id="pay" type="number" min="0"></div></div><div class="row"><div class="field"><label>必要免許</label><select id="license"><option>指定なし</option><option>普通</option><option>準中型</option><option>中型</option><option>大型</option></select></div><div class="field"><label>必要経験</label><select id="exp"><option>指定なし</option><option>1年未満</option><option>1年以上</option><option>3年以上</option></select></div></div><label>車種</label><input id="vehicle" placeholder="例：4t"><button class="primary" onclick="save()">求人を掲載</button> <button onclick="location.href='./company.html'">戻る</button><p id="msg"></p></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let company;const $=x=>document.getElementById(x),v=x=>$(x).value.trim();async function init(){let u=(await db.auth.getUser()).data.user;if(!u)return location.href='./company-register.html';let r=await db.from('companies').select('*').eq('user_id',u.id).maybeSingle();company=r.data;if(!company)return location.href='./company-register.html';$('company').textContent=company.company_name+' として登録します'}async function save(){let n=Number(v('head'));if(!v('desc')||!v('date')||!v('start')||!v('end')||!Number.isInteger(n)||n<1)return $('msg').textContent='仕事内容・勤務日・時間・必要人数を正しく入力してください。';let p={company_id:company.id,job_description:v('desc'),location:v('loc'),destination:v('dest'),work_date:v('date'),start_time:v('start'),end_time:v('end'),required_headcount:n,pay_type:v('ptype'),pay_amount:Number(v('pay')||0),hourly_wage:v('ptype')==='時給'?Number(v('pay')||0):0,required_license:v('license'),required_experience:v('exp'),vehicle_type:v('vehicle'),transportation_fee:0,urgent:false,status:'募集中'};let r=await db.from('jobs').insert(p);if(r.error)return $('msg').textContent='登録エラー：'+r.error.message;location.href='./company.html'}init();</script></body></html>
