name: Configure password recovery email
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/configure-password-recovery.py
      - .github/workflows/configure-password-recovery.yml
permissions:
  contents: read
concurrency:
  group: production-auth-settings
  cancel-in-progress: false
jobs:
  configure:
    if: github.repository == 'hs-azuma/driver-spot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure and verify password recovery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/configure-password-recovery.py
