name: V4 isolated native Supabase validation
on:
  push:
    branches: [ci/v4-native-validation-20261029]
    paths:
      - .github/workflows/v4-native-validation.yml
      - scripts/ci-native-restore.py
      - tools/native-runner/**
      - tools/edge-check/**
permissions:
  contents: read
concurrency:
  group: v4-native-validation
  cancel-in-progress: false
jobs:
  cleanroom:
    if: github.repository == 'hs-azuma/driver-spot' && github.event.repository.private == false && contains(github.event.head_commit.message, '[cleanroom-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Populate fixed dependency cache without lifecycle scripts
        run: |
          npm ci --prefix tools/restore-lab --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/browser-lab --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/sdk-lab --ignore-scripts --no-audit --no-fund
      - name: Validate legacy workflow patches without applying them
        run: |
          if ! cmp -s .github/workflows/rebrand-spodora.yml docs/review/workflows/rebrand-spodora.candidate.yml; then
            git apply --check docs/review/workflows/rebrand-spodora.patch
          fi
          if ! cmp -s .github/workflows/update-driver-experience.yml docs/review/workflows/update-driver-experience.candidate.yml; then
            git apply --check docs/review/workflows/update-driver-experience.patch
          fi
      - name: Rebuild fresh source directory and run isolated checks
        run: python3 -B scripts/verify-handover.py
      - name: Print synthetic reproduction evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path('docs/handover-cleanroom-20261029.json')
          if path.is_file():
              print('CLEANROOM_REPORT='+json.dumps(json.loads(path.read_text()),ensure_ascii=False))
          PY
  native:
    if: github.repository == 'hs-azuma/driver-spot' && github.event.repository.private == false && !contains(github.event.head_commit.message, '[cleanroom-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      report_b64: ${{ steps.native.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install fixed local tooling without lifecycle scripts or caches
        run: |
          npm ci --prefix tools/native-runner --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/sdk-lab --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/browser-lab --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/edge-check --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/restore-lab --ignore-scripts --no-audit --no-fund
      - name: Verify synthetic restore and post-backup opt-out replay
        run: node tools/restore-lab/verify.mjs
      - name: Native synthetic Auth Storage RLS and encrypted database restore
        id: native
        env:
          REPO_READ_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci-native-restore.py
  record:
    if: always() && needs.native.outputs.report_b64 != ''
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish-native-result.py
          sparse-checkout-cone-mode: false
      - name: Record sanitized report in dedicated CI results branch only
        env:
          NATIVE_RESULT_B64: ${{ needs.native.outputs.report_b64 }}
          RESULT_TOKEN: ${{ github.token }}
        run: python3 -B scripts/publish-native-result.py
