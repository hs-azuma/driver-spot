name: V4 isolated native Supabase validation
on:
  push:
    branches: [ci/v4-native-validation-20261029]
    paths:
      - .github/workflows/v4-native-validation.yml
      - scripts/ci-native-restore.py
      - tools/native-runner/**
permissions:
  contents: read
concurrency:
  group: v4-native-validation
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'hs-azuma/driver-spot' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install fixed local tooling without lifecycle scripts or caches
        run: |
          npm ci --prefix tools/native-runner --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/sdk-lab --ignore-scripts --no-audit --no-fund
      - name: Native synthetic Auth Storage RLS and encrypted database restore
        run: python3 -B scripts/ci-native-restore.py
