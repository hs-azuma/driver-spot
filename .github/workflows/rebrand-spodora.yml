name: Apply Spodora branding
on:
  push:
    paths:
      - '.github/workflows/rebrand-spodora.yml'
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect driver profile editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('driver.html')
          s=p.read_text(encoding='utf-8')
          old="""$('content').innerHTML=`<div class=\"card\"><h2>プロフィール</h2><p><b>氏名</b> ${e(currentDriver.name)}</p><p><b>電話</b> ${e(currentDriver.phone||'')}</p><p><b>希望エリア</b> ${e(currentDriver.preferred_area||'')}</p><p><b>免許</b> ${e(currentDriver.license_type||'')}</p><p><b>経験</b> ${e(currentDriver.experience||'')}</p></div>`"""
          new="""$('content').innerHTML=`<div class=\"card\"><h2>プロフィール</h2><p><b>氏名</b> ${e(currentDriver.name)}</p><p><b>電話</b> ${e(currentDriver.phone||'')}</p><p><b>希望エリア</b> ${e(currentDriver.preferred_area||'')}</p><p><b>免許</b> ${e(currentDriver.license_type||'')}</p><p><b>経験</b> ${e(currentDriver.experience||'')}</p><p style=\"margin-top:20px\"><button class=\"primary\" onclick=\"location.href='./driver-profile-setup.html'\">プロフィール情報を変更</button></p></div>`"""
          if old not in s:
              raise SystemExit('profile block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add driver.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add driver profile edit button"
          git push
