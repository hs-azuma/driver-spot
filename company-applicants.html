<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>応募者・採用管理 | スポドラ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:1100px;margin:auto;padding:22px}.brand{color:#172033;text-decoration:none;cursor:pointer}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:14px 0}.nav,.row,.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button{padding:11px 15px;border-radius:9px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:#fff}.danger{border-color:#c62828;color:#c62828}.pill{padding:6px 10px;border-radius:20px;background:#edf4ff;color:#1769d2;font-weight:bold}.green{background:#e9f8ef;color:#16803c}.gray{background:#eef1f5;color:#586274}.active{background:#1769d2;color:#fff}.item{border-top:1px solid #e2e7ef;padding:16px 0}.item:first-child{border-top:0}.meta{color:#586274}.spacer{margin-left:auto}@media(max-width:650px){header,main{padding:14px}.nav button,.filters button{flex:1}}</style></head><body><header><h1><a class="brand" href="./">スポドラ</a></h1><p>応募者・採用管理</p></header><main><div class="card nav"><button onclick="location.href='./company.html'">求人管理</button><button class="active">応募者・採用管理</button><button onclick="location.href='./company-workforce.html'">勤怠管理</button><button onclick="location.href='./company-attendance.html'">QR打刻</button><span class="spacer" id="company"></span></div><div class="card"><div class="filters"><button id="f_all" onclick="setFilter('all')">すべて</button><button id="f_apply" onclick="setFilter('apply')">応募中</button><button id="f_wait" onclick="setFilter('wait')">出勤待ち</button><button id="f_work" onclick="setFilter('work')">勤務中</button><button id="f_done" onclick="setFilter('done')">勤務完了</button></div></div><div id="content"></div></main><script>const SUPABASE_URL='https://wyxuekjikvflpcmlliwn.supabase.co',SUPABASE_KEY='sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let company,rows=[],filter='all';const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),tm=x=>x?new Date(x).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'―';function phase(a){if(a.status==='勤務完了'||a.checked_out_at)return'done';if(a.checked_in_at&&!a.checked_out_at)return'work';if(['採用','勤務確定'].includes(a.status))return'wait';return'apply'}function label(a){let p=phase(a);return p==='done'?'勤務完了':p==='work'?'勤務中':p==='wait'?'出勤待ち':'応募中'}async function init(){let u=(await db.auth.getUser()).data.user;if(!u)return location.href='./company-register.html';company=(await db.from('companies').select('*').eq('user_id',u.id).maybeSingle()).data;if(!company)return;$('company').textContent=company.company_name;await load()}async function load(){let r=await db.from('applications').select('id,status,checked_in_at,checked_out_at,hired_at,drivers(name,license_type,experience_years,user_id),jobs!inner(id,company_id,job_description,work_date,start_time,end_time,location,destination,status,pay_type,pay_amount,companies(company_name,user_id))').eq('jobs.company_id',company.id).order('id',{ascending:false});if(r.error){$('content').innerHTML='<div class="card">'+e(r.error.message)+'</div>';return}rows=r.data||[];render()}function setFilter(x){filter=x;render()}function render(){['all','apply','wait','work','done'].forEach(x=>$('f_'+x)?.classList.toggle('active',filter===x));let list=rows.filter(a=>filter==='all'||phase(a)===filter);$('content').innerHTML=`<div class="card"><div class="row"><b>該当 ${list.length}件</b><span class="spacer"></span><span class="pill">応募中 ${rows.filter(x=>phase(x)==='apply').length}</span><span class="pill green">出勤待ち ${rows.filter(x=>phase(x)==='wait').length}</span><span class="pill">勤務中 ${rows.filter(x=>phase(x)==='work').length}</span><span class="pill gray">勤務完了 ${rows.filter(x=>phase(x)==='done').length}</span></div></div>`+(list.length?`<div class="card">${list.map(a=>{let d=a.drivers||{},j=a.jobs||{},p=phase(a);return `<div class="item"><div class="row"><h3 style="margin:0">${e(d.name||'ドライバー')}</h3><span class="pill ${p==='wait'||p==='done'?'green':''}">${label(a)}</span><span class="spacer"></span>${p==='apply'?`<button class="primary" onclick="hire(${a.id})">採用</button><button class="danger" onclick="reject(${a.id})">見送り</button>`:''}</div><p><b>${e(j.job_description||'')}</b></p><p class="meta">${e(j.work_date||'')} ${String(j.start_time||'').slice(0,5)}〜${String(j.end_time||'').slice(0,5)}　${e(j.location||'')}${j.destination?' → '+e(j.destination):''}</p><p class="meta">免許：${e(d.license_type||'未設定')}　経験：${e(d.experience_years??'未設定')}年　実出勤：${tm(a.checked_in_at)}　実退勤：${tm(a.checked_out_at)}</p></div>`}).join('')}</div>`:'<div class="card">該当する応募者はいません。</div>')}async function sendResultEmail(id,status){const {data:{session}}=await db.auth.getSession();if(!session?.access_token)throw new Error('ログインセッションがありません');const a=rows.find(x=>x.id===id);if(!a)throw new Error('応募情報が見つかりません');const j=a.jobs||{},d=a.drivers||{},c=j.companies||{};const payload={application_id:id,status,driver_user_id:d.user_id,driver_name:d.name||'',company_user_id:c.user_id,company_name:c.company_name||company?.company_name||'',job:{job_description:j.job_description||'',work_date:j.work_date||'',start_time:j.start_time||'',end_time:j.end_time||'',location:j.location||'',destination:j.destination||'',pay_type:j.pay_type||'',pay_amount:j.pay_amount||0}};const res=await fetch(SUPABASE_URL+'/functions/v1/application-result-email',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify(payload)});const text=await res.text();if(!res.ok)throw new Error(text||('HTTP '+res.status));try{return JSON.parse(text)}catch{return text}}async function hire(id){if(!confirm('採用して勤務確定にしますか？'))return;let now=new Date().toISOString(),r=await db.from('applications').update({status:'勤務確定',hired_at:now,work_confirmed_at:now}).eq('id',id);if(r.error)return alert(r.error.message);await load();try{await sendResultEmail(id,'採用');alert('採用を確定し、ドライバーへ採用メールを送信しました。')}catch(err){alert('採用は確定しましたが、メール送信に失敗しました：'+(err.message||err))}}async function reject(id){if(!confirm('見送りにしますか？'))return;let r=await db.from('applications').update({status:'見送り'}).eq('id',id);if(r.error)return alert(r.error.message);try{await sendResultEmail(id,'見送り');alert('見送りを確定し、ドライバーへ結果メールを送信しました。')}catch(err){alert('見送りは確定しましたが、メール送信に失敗しました：'+(err.message||err))}await load()}init();</script></body></html>
