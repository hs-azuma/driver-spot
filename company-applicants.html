 $('content').innerHTML='<section class="card"><h2>求人案内の送信前確認</h2><h3>'+e(j.job_description||'ドライバー求人')+'</h3><p>'+e(wd(j.work_date))+' '+e(String(j.start_time).slice(0,5))+'〜'+e(String(j.end_time).slice(0,5))+'</p><p>勤務地：'+e(j.location||'')+'</p><p>給与：'+e(j.pay_type||'')+' '+money(j.pay_amount)+'</p><p>基本報酬目安：'+(c.error||c.amount==null?'要確認':money(c.amount))+' ／ 交通費：'+(fee==null?'要確認':money(fee))+'</p><p>'+e(SpodoraAttendance.policyLabel(j.pay_guarantee))+'</p><h3>案内する相手（'+ids.length+'人）</h3><ul>'+ids.map(id=>'<li>'+e(favoriteDrivers.get(id)?.drivers?.name||'ドライバー')+'</li>').join('')+'</ul><p class="meta">ドライバー画面に求人案内を表示します。メールは希望条件と受信設定に合う場合に送信します。休会中・応募済み・案内済みなどの人は送信対象から除きます。案内だけで採用は確定しません。</p><div class="row"><button id="inviteBackBtn" onclick="inviteReview=null;renderFavoriteDrivers()">戻る</button><button id="inviteSendBtn" class="primary" onclick="sendFavoriteInvitation()">この'+ids.length+'人に案内する</button></div><p id="inviteSendMsg" role="status"></p></section>';

async function sendFavoriteInvitation(){
 if(inviteSending||!inviteReview)return;
 inviteSending=true;$('inviteSendBtn').disabled=true;$('inviteBackBtn').disabled=true;$('inviteSendMsg').textContent='案内を送信中…';
 try{
 const r=await db.functions.invoke('company-job-invite',{body:inviteReview});
 if(r.error||!r.data?.ok)throw new Error('send failed');
 const result=r.data;inviteReview=null;inviteSelected.clear();inviteSending=false;await load();
 const message=result.created+'人に求人案内を登録しました。メール送信 '+result.email_sent+'件'+(result.email_failed?'・メール送信失敗 '+result.email_failed+'件（画面内の案内は登録済み）':'')+(result.skipped?'。応募済み・案内済み・休会中など '+result.skipped+'人を除外しました。':'');
 if($('inviteResult'))$('inviteResult').textContent=message;else alert(message);
 }catch(err){const message='案内を完了できませんでした。求人の募集状態と送信済みの案内を確認し、再度お試しください。';if($('inviteSendMsg'))$('inviteSendMsg').textContent=message;else alert(message);if($('inviteSendBtn'))$('inviteSendBtn').disabled=false;if($('inviteBackBtn'))$('inviteBackBtn').disabled=false}
 finally{inviteSending=false}
}
async function toggleDriverFavorite(id){
 id=Number(id);if(!company||!id||favoriteBusy.has(id))return;
 const owner=company.id,saved=favoriteDrivers.has(id),d=rows.find(a=>Number(a.driver_id)===id)?.drivers;
 if(!saved&&!d)return;
 favoriteBusy.add(id);render();
 try{
 const r=saved?await db.from('company_driver_favorites').delete().eq('company_id',owner).eq('driver_id',id):
 await db.from('company_driver_favorites').insert({company_id:owner,driver_id:id});
 if(r.error&&!( !saved&&r.error.code==='23505'))throw r.error;
 if(company?.id!==owner)return;
 if(saved)favoriteDrivers.delete(id);else favoriteDrivers.set(id,{driver_id:id,drivers:d,created_at:new Date().toISOString()});
 }catch(err){alert('お気に入りを変更できませんでした。もう一度お試しください。')}
 finally{favoriteBusy.delete(id);render()}
}

async function sendResultEmail(id,status){const {data:{session}}=await db.auth.getSession();if(!session?.access_token)throw new Error('ログインセッションがありません');const a=rows.find(x=>x.id===id);if(!a)throw new Error('応募情報が見つかりません');const j=a.jobs||{},d=a.drivers||{},c=j.companies||{};const payload={application_id:id,status,driver_user_id:d.user_id,driver_name:d.name||'',company_user_id:c.user_id,company_name:c.company_name||company?.company_name||'',job:{job_description:j.job_description||'',work_date:j.work_date||'',start_time:j.start_time||'',end_time:j.end_time||'',location:j.location||'',destination:j.destination||'',pay_type:j.pay_type||'',pay_amount:j.pay_amount||0}};const res=await fetch(SUPABASE_URL+'/functions/v1/application-result-email',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify(payload)});const text=await res.text();if(!res.ok)throw new Error(text||('HTTP '+res.status));try{return JSON.parse(text)}catch{return text}}async function hire(id){if(!canHire(rows.find(a=>Number(a.id)===Number(id))))return alert('募集人数・応募状況を確認してください。現在この応募を採用できません。');if(!confirm('採用して勤務確定にしますか？'))return;let now=new Date().toISOString(),r=await db.from('applications').update({status:'勤務確定',hired_at:now,work_confirmed_at:now}).eq('id',id);if(r.error)return alert(r.error.message);await load();try{await sendResultEmail(id,'採用');alert('採用を確定し、ドライバーへ採用メールを送信しました。')}catch(err){alert('採用は確定しましたが、メール送信に失敗しました：'+(err.message||err))}}async function reject(id){if(phase(rows.find(a=>Number(a.id)===Number(id))||{})!=='apply')return alert('この応募は選考中ではありません。更新して確認してください。');if(!confirm('見送りにしますか？'))return;let r=await db.from('applications').update({status:'不採用'}).eq('id',id);if(r.error)return alert(r.error.message);try{await sendResultEmail(id,'見送り');alert('見送りを確定し、ドライバーへ結果メールを送信しました。')}catch(err){alert('見送りは確定しましたが、メール送信に失敗しました：'+(err.message||err))}await load()}init();</script></body></html>
