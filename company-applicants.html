<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>応募者・採用管理 | スポドラ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:1100px;margin:auto;padding:22px}.brand{color:#172033;text-decoration:none;cursor:pointer}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:14px 0}.nav,.row,.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button{padding:11px 15px;border-radius:9px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:#fff}.danger{border-color:#c62828;color:#c62828}.pill{padding:6px 10px;border-radius:20px;background:#edf4ff;color:#1769d2;font-weight:bold}.green{background:#e9f8ef;color:#16803c}.gray{background:#eef1f5;color:#586274}.active{background:#1769d2;color:#fff}.item{border-top:1px solid #e2e7ef;padding:16px 0}.item:first-child{border-top:0}.meta{color:#586274}.spacer{margin-left:auto}@media(max-width:650px){header,main{padding:14px}.nav button,.filters button{flex:1}}</style><style id="spodora-brand-style">
.spodora-brand{display:block;width:300px;max-width:72vw;text-decoration:none;margin:0 0 12px}
.spodora-brand img{display:block;width:100%;height:auto}
@media(max-width:650px){.spodora-brand{width:240px;max-width:72vw}}
</style><script src="./assets/applicant-summary.js?v=20261004a"></script><style>.applicant-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}.applicant-fact{background:#f4f7fb;border-radius:10px;padding:12px;min-width:0;overflow-wrap:anywhere}.applicant-fact span{display:block;font-size:12px;color:#68758b;margin-bottom:6px}.applicant-fact strong{line-height:1.5}.applicant-job h2{font-size:20px;line-height:1.5;overflow-wrap:anywhere}.applicant-job .item{overflow-wrap:anywhere}.job-select{padding:11px;border:1px solid #dbe3ef;border-radius:9px;width:100%;margin:10px 0 0;font-size:16px}.job-head{padding-bottom:16px;border-bottom:1px solid #e2e7ef}.item:first-child{border-top:0}@media(max-width:650px){.applicant-facts{grid-template-columns:1fr 1fr;gap:8px}.applicant-fact:last-child{grid-column:1/-1}.applicant-fact{padding:10px}}</style></head><body><header><h1><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a></h1><p>応募者・採用管理</p></header><main><div class="card nav"><button onclick="location.href='./company.html'">求人管理</button><button class="active">応募者・採用管理</button><button onclick="location.href='./company-workforce.html'">勤怠管理</button><button onclick="location.href='./company-attendance.html'">QR打刻</button><span class="spacer" id="company"></span></div><div class="card"><div class="filters"><button id="f_all" onclick="setFilter('all')">すべて</button><button id="f_apply" onclick="setFilter('apply')">応募中</button><button id="f_wait" onclick="setFilter('wait')">出勤待ち</button><button id="f_work" onclick="setFilter('work')">勤務中</button><button id="f_done" onclick="setFilter('done')">勤務完了</button></div></div><div class="card"><label for="jobFilter"><b>求人で絞り込む</b></label><select class="job-select" id="jobFilter" onchange="setJobFilter(this.value)"><option value="all">すべての求人</option></select></div><div id="content"></div></main><script>const SUPABASE_URL='https://wyxuekjikvflpcmlliwn.supabase.co',SUPABASE_KEY='sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let company,rows=[],filter='all',applicantJobs=[],selectedJob=new URLSearchParams(location.search).get('job')||'all';const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),tm=x=>x?new Date(x).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}):'―',wd=x=>{if(!x)return'';let a=String(x).split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]);return x+'（'+['日','月','火','水','木','金','土'][d.getDay()]+'）'};function phase(a){return SpodoraApplicants.phase(a)}function label(a){return SpodoraApplicants.label(a)}async function init(){let u=(await db.auth.getUser()).data.user;if(!u)return location.href='./company-register.html';company=(await db.from('companies').select('*').eq('user_id',u.id).maybeSingle()).data;if(!company)return;$('company').textContent=company.company_name;await load()}async function load(){
 const [r,jr]=await Promise.all([
  db.from('applications').select('id,driver_id,status,checked_in_at,checked_out_at,hired_at,drivers(id,name,license_type,experience,experience_years,user_id),jobs!inner(id,company_id,job_description,work_date,start_time,end_time,location,destination,status,required_headcount,required_license,required_experience,pay_type,pay_amount,companies(company_name,user_id))').eq('jobs.company_id',company.id).order('id',{ascending:false}),
  db.from('jobs').select('id,company_id,job_description,work_date,start_time,end_time,status,required_headcount,required_license,required_experience').eq('company_id',company.id).order('work_date',{ascending:false})
 ]);
 if(r.error||jr.error){$('content').innerHTML='<div class="card"><p>応募者情報を取得できませんでした。</p><button onclick="load()">再読み込み</button></div>';return}
 rows=r.data||[];applicantJobs=jr.data||[];
 if(selectedJob!=='all'&&!applicantJobs.some(j=>String(j.id)===String(selectedJob)))selectedJob='all';
 $('jobFilter').innerHTML='<option value="all">すべての求人</option>'+applicantJobs.map(j=>'<option value="'+Number(j.id)+'">'+e((j.work_date||'勤務日未設定')+' ／ '+(j.job_description||'ドライバー求人'))+'</option>').join('');
 $('jobFilter').value=selectedJob;render();
}
function setFilter(x){if(!['all','apply','wait','work','done'].includes(x))return;filter=x;render()}
function setJobFilter(value){selectedJob=value==='all'?'all':String(Number(value));if(selectedJob!=='all'&&!applicantJobs.some(j=>String(j.id)===selectedJob))selectedJob='all';render()}
function canHire(a){return !!a&&phase(a)==='apply'&&SpodoraApplicants.accepting(a.jobs,rows)}
function render(){
 ['all','apply','wait','work','done'].forEach(x=>{$('f_'+x)?.classList.toggle('active',filter===x);$('f_'+x)?.setAttribute('aria-pressed',String(filter===x))});
 const scoped=rows.filter(a=>selectedJob==='all'||String(a.jobs?.id)===selectedJob),list=scoped.filter(a=>filter==='all'||phase(a)===filter);
 const jobs=selectedJob==='all'?applicantJobs.filter(j=>list.some(a=>Number(a.jobs?.id)===Number(j.id))):applicantJobs.filter(j=>String(j.id)===selectedJob);
 const summary='<div class="card"><div class="row"><b>該当 '+list.length+'件</b><span class="spacer"></span><span class="pill">応募中 '+scoped.filter(x=>phase(x)==='apply').length+'</span><span class="pill green">出勤待ち '+scoped.filter(x=>phase(x)==='wait').length+'</span><span class="pill">勤務中 '+scoped.filter(x=>phase(x)==='work').length+'</span><span class="pill gray">勤務完了 '+scoped.filter(x=>phase(x)==='done').length+'</span></div></div>';
 $('content').innerHTML=summary+(jobs.length?jobs.map(j=>{
  const n=SpodoraApplicants.stats(j,rows),open=SpodoraApplicants.accepting(j,rows),candidates=list.filter(a=>Number(a.jobs?.id)===Number(j.id));
  const heading='<div class="job-head"><h2>'+e(j.job_description||'ドライバー求人')+'</h2><p class="meta">'+e(wd(j.work_date||''))+' '+String(j.start_time||'').slice(0,5)+'〜'+String(j.end_time||'').slice(0,5)+'</p><div class="row"><span class="pill">募集 '+n.need+'人</span><span class="pill green">採用済み '+n.hired+'人</span><span class="pill '+(n.remaining===0?'gray':'')+'">残り '+n.remaining+'人</span><span class="pill">選考中 '+n.pending+'人</span>'+(!open?'<span class="pill gray">'+(j.status==='キャンセル'?'求人取消':n.remaining===0?'募集充足':'募集終了')+'</span>':'')+'</div><p class="meta">必要免許：'+e(j.required_license||'指定なし')+' ／ 必要経験：'+e(j.required_experience||'指定なし')+'</p></div>';
  return '<section class="card applicant-job">'+heading+(candidates.length?candidates.map(a=>{
   const d=a.drivers||{},p=phase(a),done=d.id!=null?SpodoraApplicants.completed(rows,d.id):null;
   const buttons=p==='apply'?(canHire(a)?'<button class="primary" onclick="hire('+Number(a.id)+')">採用</button>':'')+'<button class="danger" onclick="reject('+Number(a.id)+')">見送り</button>':'';
   return '<div class="item"><div class="row"><h3 style="margin:0">'+e(d.name||'ドライバー')+'</h3><span class="pill '+(p==='wait'||p==='done'?'green':'')+'">'+e(label(a))+'</span><span class="spacer"></span>'+buttons+'</div><div class="applicant-facts"><div class="applicant-fact"><span>保有免許</span><strong>'+e(d.license_type||'未設定')+'</strong></div><div class="applicant-fact"><span>運転経験</span><strong>'+e(SpodoraApplicants.experience(d))+'</strong></div><div class="applicant-fact"><span>当社での勤務実績</span><strong>'+(done==null?'未確認':done===0?'初回（勤務記録なし）':done+'回')+'</strong></div></div><p class="meta">実出勤：'+tm(a.checked_in_at)+' ／ 実退勤：'+tm(a.checked_out_at)+'</p></div>';
  }).join(''):'<p>この条件に該当する応募者はいません。</p>')+'<p class="meta" style="font-size:12px">勤務実績は、この企業への応募のうち退勤記録または勤務完了の記録がある回数です。</p></section>';
 }).join(''):'<div class="card">該当する応募者はいません。</div>');
}
async function sendResultEmail(id,status){const {data:{session}}=await db.auth.getSession();if(!session?.access_token)throw new Error('ログインセッションがありません');const a=rows.find(x=>x.id===id);if(!a)throw new Error('応募情報が見つかりません');const j=a.jobs||{},d=a.drivers||{},c=j.companies||{};const payload={application_id:id,status,driver_user_id:d.user_id,driver_name:d.name||'',company_user_id:c.user_id,company_name:c.company_name||company?.company_name||'',job:{job_description:j.job_description||'',work_date:j.work_date||'',start_time:j.start_time||'',end_time:j.end_time||'',location:j.location||'',destination:j.destination||'',pay_type:j.pay_type||'',pay_amount:j.pay_amount||0}};const res=await fetch(SUPABASE_URL+'/functions/v1/application-result-email',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify(payload)});const text=await res.text();if(!res.ok)throw new Error(text||('HTTP '+res.status));try{return JSON.parse(text)}catch{return text}}async function hire(id){if(!canHire(rows.find(a=>Number(a.id)===Number(id))))return alert('募集人数・応募状況を確認してください。現在この応募を採用できません。');if(!confirm('採用して勤務確定にしますか？'))return;let now=new Date().toISOString(),r=await db.from('applications').update({status:'勤務確定',hired_at:now,work_confirmed_at:now}).eq('id',id);if(r.error)return alert(r.error.message);await load();try{await sendResultEmail(id,'採用');alert('採用を確定し、ドライバーへ採用メールを送信しました。')}catch(err){alert('採用は確定しましたが、メール送信に失敗しました：'+(err.message||err))}}async function reject(id){if(phase(rows.find(a=>Number(a.id)===Number(id))||{})!=='apply')return alert('この応募は選考中ではありません。更新して確認してください。');if(!confirm('見送りにしますか？'))return;let r=await db.from('applications').update({status:'不採用'}).eq('id',id);if(r.error)return alert(r.error.message);try{await sendResultEmail(id,'見送り');alert('見送りを確定し、ドライバーへ結果メールを送信しました。')}catch(err){alert('見送りは確定しましたが、メール送信に失敗しました：'+(err.message||err))}await load()}init();</script></body></html>
