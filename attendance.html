<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 出退勤</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header,main{max-width:760px;margin:auto;padding:22px}.brand{color:#1769d2;text-decoration:none}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:22px;margin:18px 0}button{padding:12px 18px;border-radius:10px;border:1px solid #1769d2;background:#1769d2;color:#fff;font-weight:bold}.ok{background:#e9f8ef;color:#16803c;border:1px solid #bde6ca;padding:14px;border-radius:10px}.err{background:#fff0f0;color:#c62828;border:1px solid #f2bcbc;padding:14px;border-radius:10px}</style><style id="spodora-brand-style">
.spodora-brand{display:block;width:300px;max-width:72vw;text-decoration:none;margin:0 0 12px}
.spodora-brand img{display:block;width:100%;height:auto}
@media(max-width:650px){.spodora-brand{width:240px;max-width:72vw}}
</style></head><body><header><h1><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a></h1><p>QR出退勤</p></header><main><div class="card"><h2 id="title">出退勤打刻</h2><div id="msg">確認中...</div></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const msg=document.getElementById('msg'),title=document.getElementById('title');async function run(){const q=new URLSearchParams(location.search),companyToken=q.get('company'),jobToken=q.get('token'),action=q.get('action');if(!companyToken&&!jobToken){msg.innerHTML='<div class="err">QRコードが正しくありません。</div>';return}if(companyToken&&!['in','out'].includes(action)){msg.innerHTML='<div class="err">出勤用または退勤用QRを読み取ってください。</div>';return}title.textContent=action==='out'?'退勤打刻':'出勤打刻';const u=(await db.auth.getUser()).data.user;if(!u){msg.innerHTML='<div class="err">ドライバー本人のアカウントで先にスポドラへログインしてください。</div><p><a href="./"><button>トップページへ</button></a></p>';return}if(!confirm((action==='out'?'退勤':'出勤')+'を記録しますか？')){msg.textContent='打刻をキャンセルしました。';return}const r=companyToken?await db.rpc('scan_company_attendance',{p_token:companyToken,p_action:action}):await db.rpc('scan_attendance',{p_token:jobToken});if(r.error){msg.innerHTML='<div class="err">'+String(r.error.message).replaceAll('<','&lt;')+'</div>';return}msg.innerHTML='<div class="ok">'+String(r.data).replaceAll('<','&lt;')+'</div><p><a href="./"><button>応募・仕事管理へ</button></a></p>'}run();</script></body></html>
