<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT 会社端末打刻</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}main,header{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:20px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{padding:14px 20px;border-radius:10px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold;font-size:16px}.active{background:#1769d2;color:#fff}.out.active{background:#c4472d;border-color:#c4472d}.ok{padding:14px;border-radius:10px;background:#e9f8ef;color:#16803c;font-weight:bold}.err{padding:14px;border-radius:10px;background:#fff0f0;color:#c62828}.brand{color:#1769d2;text-decoration:none}#reader{margin-top:15px}</style></head><body><header><h1><a class="brand" href="./company.html">DRIVER SPOT</a></h1><p>会社端末・QR打刻</p></header><main><div class="card"><h2>ドライバーQRを読み取る</h2><p>この端末を受付・事務所などに設置して使用します。</p><div class="row"><button id="inBtn" class="active" onclick="setAction('in')">出勤スキャン</button><button id="outBtn" class="out" onclick="setAction('out')">退勤スキャン</button><button onclick="location.href='./company.html'">企業マイページへ戻る</button></div><div id="reader"></div><div id="msg"></div></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let action='in',busy=false,scanner;const msg=document.getElementById('msg');function setAction(a){action=a;document.getElementById('inBtn').classList.toggle('active',a==='in');document.getElementById('outBtn').classList.toggle('active',a==='out');msg.innerHTML=''}function tokenFrom(text){try{let u=new URL(text);return u.searchParams.get('driver')}catch(e){return text.startsWith('DRIVERSPOT:')?text.slice(11):text}}async function scan(text){if(busy)return;busy=true;let token=tokenFrom(text);if(!token){msg.innerHTML='<p class="err">DRIVER SPOTのドライバーQRではありません。</p>';busy=false;return}let r=await db.rpc('scan_driver_attendance',{p_token:token,p_action:action});msg.innerHTML=r.error?'<p class="err">'+String(r.error.message).replaceAll('<','&lt;')+'</p>':'<p class="ok">'+String(r.data).replaceAll('<','&lt;')+'</p>';setTimeout(()=>{busy=false;msg.innerHTML=''},2500)}async function init(){let u=(await db.auth.getUser()).data.user;if(!u){msg.innerHTML='<p class="err">企業アカウントでログインしてください。</p>';return}scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:250,height:250},rememberLastUsedCamera:true},false);scanner.render(scan,()=>{})}init();</script></body></html>
