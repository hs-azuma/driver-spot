<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT 会社端末打刻</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}main,header{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:20px;margin:16px 0}.ok{padding:14px;border-radius:10px;background:#e9f8ef;color:#16803c;font-weight:bold;font-size:18px}.err{padding:14px;border-radius:10px;background:#fff0f0;color:#c62828}.brand{color:#1769d2;text-decoration:none}#reader{margin-top:15px}button{padding:12px 18px;border-radius:10px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold}</style></head><body><header><h1><a class="brand" href="./company.html">DRIVER SPOT</a></h1><p>会社端末・QR打刻</p></header><main><div class="card"><h2>ドライバーQRを読み取る</h2><p>ドライバー本人の携帯で「出勤」または「退勤」を選び、表示されたQRをこの会社端末にかざしてください。</p><p><b>QR全体が枠内に入るよう、携帯を20〜30cmほど離してください。</b></p><button onclick="location.href='./company.html'">企業マイページへ戻る</button><div id="reader"></div><div id="msg"></div></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let busy=false,scanner;const msg=document.getElementById('msg');function parse(text){text=String(text||'').trim();if(text.startsWith('DRIVERSPOT:')){let p=text.split(':');return {token:p[1]||'',action:p[2]||''}}try{let u=new URL(text);return {token:u.searchParams.get('driver')||'',action:u.searchParams.get('action')||''}}catch(e){return {token:'',action:''}}}async function scan(text){if(busy)return;busy=true;let x=parse(text);if(!x.token||!['in','out'].includes(x.action)){msg.innerHTML='<p class="err">DRIVER SPOTの出勤・退勤QRではありません。もう一度読み取ってください。</p>';setTimeout(()=>busy=false,1600);return}try{if(scanner&&scanner.pause)scanner.pause(true)}catch(e){}let r=await db.rpc('scan_driver_attendance',{p_token:x.token,p_action:x.action});msg.innerHTML=r.error?'<p class="err">'+String(r.error.message).replaceAll('<','&lt;')+'</p>':'<p class="ok">✓ '+(x.action==='in'?'出勤':'退勤')+'を記録しました<br>'+String(r.data||'').replaceAll('<','&lt;')+'</p>';setTimeout(()=>{busy=false;msg.innerHTML='';try{if(scanner&&scanner.resume)scanner.resume()}catch(e){}},2200)}async function init(){let u=(await db.auth.getUser()).data.user;if(!u){msg.innerHTML='<p class="err">企業アカウントでログインしてください。</p>';return}scanner=new Html5QrcodeScanner('reader',{fps:20,qrbox:(w,h)=>{let s=Math.floor(Math.min(w,h)*0.78);return {width:s,height:s}},aspectRatio:1.333333,rememberLastUsedCamera:true,supportedScanTypes:[Html5QrcodeScanType.SCAN_TYPE_CAMERA]},false);scanner.render(scan,()=>{})}init();</script></body></html>
