<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜応募確認</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}.brand{display:block;width:280px;max-width:72vw}.brand img{display:block;width:100%;height:auto}main{max-width:720px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}.confirm{margin:20px 0;padding:18px;background:#f8fafc;border:1px solid #dbe3ef;border-radius:12px}.confirm h3{margin-top:0}.checkrow{display:flex;gap:12px;align-items:flex-start;line-height:1.75}.checkrow input{width:24px;height:24px;flex:0 0 auto;margin-top:3px}.primary{width:100%;padding:15px;border:0;border-radius:10px;background:#1769d2;color:#fff;font-size:17px;font-weight:bold}.primary:disabled{background:#aab5c4}.back{display:block;text-align:center;margin-top:16px;color:#1769d2;text-decoration:none}.msg{margin-top:12px;color:#c62828;font-weight:bold}</style></head><body><header><a class="brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>応募確認</p></header><main><div class="card"><h2>応募前の確認</h2><div id="job"></div><div class="confirm"><h3>勤務時間・休息時間の確認</h3><label class="checkrow"><input id="workCheck" type="checkbox" onchange="document.getElementById('applyBtn').disabled=!this.checked"><span>本業・副業を含め、1か月の拘束時間が原則284時間以内、1日の拘束時間が原則13時間以内であり、直前の勤務終了から今回の勤務開始まで、また今回の勤務終了から次の勤務開始まで、原則11時間以上（最低9時間）の休息時間を確保できること、および連続運転時間が原則4時間以内であることを確認しました。</span></label></div><button id="applyBtn" class="primary" disabled onclick="applyJob()">確認して応募する</button><div id="msg" class="msg"></div><a class="back" href="./driver.html">求人一覧へ戻る</a></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),tm=x=>String(x||'').slice(0,5);const jobId=Number(new URLSearchParams(location.search).get('job'));let user,driver,job;async function init(){user=(await db.auth.getUser()).data.user;if(!user){location.href='./driver.html';return}driver=(await db.from('drivers').select('*').eq('user_id',user.id).maybeSingle()).data;if(!driver){location.href='./driver-profile-setup.html';return}let r=await db.from('jobs').select('*').eq('id',jobId).single();if(r.error||!r.data){$('msg').textContent='求人情報を確認できませんでした。';$('applyBtn').disabled=true;return}job=r.data;$('job').innerHTML=`<p><b>${e(job.job_description||'ドライバー求人')}</b></p><p>${e(job.work_date||'')} ${tm(job.start_time)}〜${tm(job.end_time)}</p><p>${e(job.location||'')}${job.destination?' → '+e(job.destination):''}</p>`}async function applyJob(){if(!$('workCheck').checked)return;if(!confirm('この内容を確認のうえ応募しますか？'))return;let jr=await db.from('jobs').select('status,required_headcount,applications(status)').eq('id',jobId).single();if(jr.error)return $('msg').textContent=jr.error.message;if(jr.data.status==='キャンセル')return $('msg').textContent='この求人は取り消されています。';let need=Number(jr.data.required_headcount||1),hired=(jr.data.applications||[]).filter(x=>['採用','勤務確定','勤務完了'].includes(x.status)).length;if(hired>=need)return $('msg').textContent='この求人は募集人数に達しています。';let r=await db.from('applications').insert({job_id:jobId,driver_id:driver.id,status:'応募中'});if(r.error){if(String(r.error.message).includes('duplicate'))return $('msg').textContent='すでに応募済みです。';return $('msg').textContent=r.error.message}alert('応募しました。');location.href='./driver.html'}init();</script></body></html>
