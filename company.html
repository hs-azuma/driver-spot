<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT 企業</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:1000px;margin:auto;padding:22px}.brand{color:#172033;text-decoration:none}.card{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:16px 0}.card.completed{background:#f7faf8;border-color:#b9dfc5}button{padding:11px 16px;border-radius:9px;border:1px solid #1769d2;background:white;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:white}.danger{border-color:#c62828;color:#c62828}.green{background:#16803c;color:white;border-color:#16803c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{background:#edf4ff;color:#1769d2;padding:5px 9px;border-radius:20px}.hired,.completed-badge{background:#e9f8ef;color:#16803c;font-weight:bold;padding:6px 10px;border-radius:20px}.history{display:inline-block;margin:4px 8px 4px 0;padding:7px 11px;border-radius:9px;background:#f4f7fb;font-weight:bold;border:1px solid #dbe3ef;color:#172033}.app{border-top:1px solid #ddd;padding:14px 0}.attendance{background:#f7f9fc;border:1px solid #dbe3ef;border-radius:10px;padding:12px;margin:10px 0}.attendance strong{color:#1769d2}.error{color:#c62828}.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}.modalbox{background:white;border-radius:14px;padding:20px;max-width:680px;width:100%;max-height:80vh;overflow:auto}.historyrow{border-top:1px solid #e2e6ec;padding:12px 0}</style></head><body><header><h1><a class="brand" href="./">DRIVER SPOT</a></h1><p>企業マイページ</p></header><main><div class="card row"><a href="./"><button>求人ページへ戻る</button></a><span id="state">確認中...</span><button class="primary" onclick="location.href='./company-attendance.html'">QR打刻端末を開く</button><button onclick="logout()">ログアウト</button></div><div id="content"></div></main><div id="historyModal" style="display:none"></div><script>
const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let user,company;const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),t=x=>x?new Date(x).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'―';async function init(){user=(await db.auth.getUser()).data.user;if(!user){$('state').textContent='未ログイン';return}company=(await db.from('companies').select('*').eq('user_id',user.id).maybeSingle()).data;if(!company)return;$('state').textContent=company.company_name+' ログイン中';dashboard()}async function dashboard(){let r=await db.from('jobs').select('*,applications(id,status)').eq('company_id',company.id).order('created_at',{ascending:false}),jobs=r.data||[];$('content').innerHTML=`<div class="card row"><h2 style="margin-right:auto">${e(company.company_name)} マイページ</h2><button class="primary" onclick="location.href='./company-register.html'">＋求人登録</button></div>`+jobs.map(j=>{let apps=j.applications||[],completed=apps.filter(a=>a.status==='勤務完了').length;return `<div class="card"><div class="row"><h3 style="margin-right:auto">${e(j.job_description||'ドライバー求人')}</h3>${completed?`<span class="completed-badge">✓ 勤務完了 ${completed}人</span>`:''}</div><p>${e(j.work_date)}　${e(j.location)}${j.destination?' → '+e(j.destination):''}</p><span class="badge">${e(j.pay_type)} ${Number(j.pay_amount||0).toLocaleString()}円</span> <button id="b${j.id}" onclick="toggleApplicants(${j.id})">応募者を見る（${apps.length}人）</button><div id="a${j.id}" style="display:none"></div></div>`}).join('')}async function toggleApplicants(id){let box=$('a'+id);if(box.style.display!=='none'){box.style.display='none';return}box.style.display='block';applicants(id)}function stateLabel(s){return `<span class="${['採用','勤務確定','勤務完了'].includes(s)?'hired':'badge'}">${e(s==='採用'?'採用済み':s||'応募中')}</span>`}async function applicants(id){let box=$('a'+id);box.innerHTML='読み込み中...';let r=await db.from('applications').select('id,status,driver_id,checked_in_at,checked_out_at,rounded_check_in_at,rounded_check_out_at,attendance_rounding_minutes,attendance_review_status,approved_work_minutes,drivers(name,phone,email,area,license_type,experience_years)').eq('job_id',id);if(r.error)return box.innerHTML='<p class="error">'+e(r.error.message)+'</p>';box.innerHTML=(r.data||[]).map(a=>{let d=a.drivers||{},att='';if(a.checked_in_at||a.checked_out_at){let mins=a.approved_work_minutes,hrs=mins==null?'―':Math.floor(mins/60)+'時間'+(mins%60?mins%60+'分':'');att=`<div class="attendance"><div><b>実打刻</b>　出勤 ${t(a.checked_in_at)} ／ 退勤 ${t(a.checked_out_at)}</div><div><strong>計算上（${a.attendance_rounding_minutes||company.attendance_rounding_minutes||15}分単位）</strong>　出勤 ${t(a.rounded_check_in_at)} ／ 退勤 ${t(a.rounded_check_out_at)}</div>${a.checked_out_at?`<div><b>計算勤務時間</b>　${hrs}　／　確認状態：${e(a.attendance_review_status||'未確認')}</div>`:''}</div>`}let buttons='';if(a.status==='採用')buttons=`<button class="green" onclick="workflow(${a.id},${id})">勤務確定</button>`;else if(a.status==='勤務確定')buttons=a.checked_in_at?'<span class="hired">出勤済み</span>':'<span class="badge">勤務確定・出勤待ち</span>';else if(a.status==='勤務完了')buttons='<span class="hired">勤務完了</span>';else buttons=`<button class="primary" onclick="status(${a.id},'採用',${id})">採用</button><button class="danger" onclick="status(${a.id},'見送り',${id})">見送り</button>`;return `<div class="app"><b>${e(d.name)}</b> ${stateLabel(a.status)}<p>免許：${e(d.license_type||'未設定')} ／ 経験：${Number(d.experience_years||0)>=4?'4年以上':Number(d.experience_years||0)>=1?'1〜3年':'1年未満'}</p>${att}<div class="row">${buttons}</div></div>`}).join('')||'<p>まだ応募者はいません。</p>'}async function status(a,s,j){let patch={status:s};if(s==='採用')patch.hired_at=new Date().toISOString();let r=await db.from('applications').update(patch).eq('id',a);if(r.error)return alert(r.error.message);applicants(j)}async function workflow(a,j){if(!confirm('勤務を確定しますか？'))return;let r=await db.from('applications').update({status:'勤務確定',work_confirmed_at:new Date().toISOString()}).eq('id',a);if(r.error)return alert(r.error.message);applicants(j)}async function logout(){await db.auth.signOut();location.href='./'}init();
</script></body></html>
