<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT 企業</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:1000px;margin:auto;padding:22px}.brand{color:#172033;text-decoration:none}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:16px 0}button{padding:11px 16px;border-radius:9px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:#fff}.danger{border-color:#c62828;color:#c62828}.green{background:#16803c;color:#fff;border-color:#16803c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{background:#edf4ff;color:#1769d2;padding:5px 9px;border-radius:20px}.hired{background:#e9f8ef;color:#16803c;font-weight:bold;padding:6px 10px;border-radius:20px}.full{background:#eef1f5;color:#586274;font-weight:bold;padding:6px 10px;border-radius:20px}.app{border-top:1px solid #ddd;padding:14px 0}.attendance{background:#f7f9fc;border:1px solid #dbe3ef;border-radius:10px;padding:12px;margin:10px 0}.attendance strong{color:#1769d2}.manual{background:#fff7df;color:#8a5b00;padding:5px 8px;border-radius:8px}.error{color:#c62828}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}.modalbox{background:#fff;border-radius:14px;padding:20px;max-width:520px;width:100%}.modalbox input,.modalbox textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 14px;border:1px solid #ccd5e2;border-radius:8px;font-size:16px}.modalbox textarea{min-height:90px}</style></head><body><header><h1><a class="brand" href="./">DRIVER SPOT</a></h1><p>企業マイページ</p></header><main><div class="card row"><a href="./"><button>求人ページへ戻る</button></a><span id="state">確認中...</span><button class="primary" onclick="location.href='./company-attendance.html'">QR打刻端末を開く</button><button onclick="logout()">ログアウト</button></div><div id="content"></div></main><div id="modal"></div><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let user,company;const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),t=x=>x?new Date(x).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'―';function localInput(x){if(!x)return'';let d=new Date(x),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}async function init(){user=(await db.auth.getUser()).data.user;if(!user){$('state').textContent='未ログイン';return}company=(await db.from('companies').select('*').eq('user_id',user.id).maybeSingle()).data;if(!company)return;$('state').textContent=company.company_name+' ログイン中';dashboard()}async function dashboard(){let r=await db.from('jobs').select('*,applications(id,status)').eq('company_id',company.id).order('created_at',{ascending:false}),jobs=r.data||[];$('content').innerHTML=`<div class="card row"><h2 style="margin-right:auto">${e(company.company_name)} マイページ</h2><button class="primary" onclick="location.href='./job-create.html'">＋求人登録</button></div>`+jobs.map(j=>{let apps=j.applications||[],done=apps.filter(a=>a.status==='勤務完了').length,hired=apps.filter(a=>['採用','勤務確定','勤務完了'].includes(a.status)).length,need=Number(j.required_headcount||1),remain=Math.max(0,need-hired);return `<div class="card"><div class="row"><h3 style="margin-right:auto">${e(j.job_description||'ドライバー求人')}</h3>${done?`<span class="hired">✓ 勤務完了 ${done}人</span>`:''}</div><p>${e(j.work_date)}　${e(j.location)}${j.destination?' → '+e(j.destination):''}</p><div class="row"><span class="badge">${e(j.pay_type)} ${Number(j.pay_amount||0).toLocaleString()}円</span><span class="badge">必要 ${need}人</span><span class="${remain===0?'full':'hired'}">残り ${remain}人</span>${remain===0?'<span class="full">募集充足</span>':''}</div><p><button onclick="toggle(${j.id})">応募者を見る（${apps.length}人）</button></p><div id="a${j.id}" style="display:none"></div></div>`}).join('')}async function toggle(id){let b=$('a'+id);if(b.style.display!=='none'){b.style.display='none';return}b.style.display='block';applicants(id)}async function applicants(id){let b=$('a'+id);b.innerHTML='読み込み中...';let r=await db.from('applications').select('id,status,checked_in_at,checked_out_at,rounded_check_in_at,rounded_check_out_at,attendance_rounding_minutes,attendance_review_status,approved_work_minutes,attendance_method,attendance_manual_reason,drivers(name,license_type,experience_years)').eq('job_id',id);if(r.error)return b.innerHTML='<p class="error">'+e(r.error.message)+'</p>';b.innerHTML=(r.data||[]).map(a=>{let d=a.drivers||{},mins=a.approved_work_minutes,hrs=mins==null?'―':Math.floor(mins/60)+'時間'+(mins%60?mins%60+'分':'');let att=(a.checked_in_at||a.checked_out_at)?`<div class="attendance"><div><b>実打刻</b>　出勤 ${t(a.checked_in_at)} ／ 退勤 ${t(a.checked_out_at)} ${a.attendance_method==='manual'?'<span class="manual">手入力・修正</span>':''}</div><div><strong>計算上（${a.attendance_rounding_minutes||company.attendance_rounding_minutes||15}分単位）</strong>　出勤 ${t(a.rounded_check_in_at)} ／ 退勤 ${t(a.rounded_check_out_at)}</div>${a.checked_out_at?`<div><b>計算勤務時間</b>　${hrs} ／ ${e(a.attendance_review_status||'未確認')}</div>`:''}${a.attendance_manual_reason?`<div>修正理由：${e(a.attendance_manual_reason)}</div>`:''}</div>`:'';let btn='';if(a.status==='採用')btn=`<button class="green" onclick="workflow(${a.id},${id})">勤務確定</button>`;else if(['勤務確定','勤務完了'].includes(a.status))btn=`<button onclick="manual(${a.id},${id},'${a.checked_in_at||''}','${a.checked_out_at||''}')">打刻を手入力・修正</button> ${a.status==='勤務完了'?'<span class="hired">勤務完了</span>':a.checked_in_at?'<span class="hired">出勤済み</span>':'<span class="badge">出勤待ち</span>'}`;else btn=`<button class="primary" onclick="status(${a.id},'採用',${id})">採用</button><button class="danger" onclick="status(${a.id},'見送り',${id})">見送り</button>`;return `<div class="app"><b>${e(d.name)}</b> <span class="badge">${e(a.status)}</span><p>免許：${e(d.license_type||'未設定')}</p>${att}<div class="row">${btn}</div></div>`}).join('')||'<p>まだ応募者はいません。</p>'}function manual(a,j,cin,cout){$('modal').innerHTML=`<div class="modal"><div class="modalbox"><h2>打刻を手入力・修正</h2><label>出勤時刻</label><input id="mi" type="datetime-local" value="${localInput(cin)}"><label>退勤時刻</label><input id="mo" type="datetime-local" value="${localInput(cout)}"><label>理由（必須）</label><textarea id="mr" placeholder="例：QR打刻忘れ、端末不具合、担当者確認済み"></textarea><div class="row"><button class="primary" onclick="saveManual(${a},${j})">保存</button><button onclick="closeModal()">キャンセル</button></div><p>元の打刻は修正履歴に保存されます。</p></div></div>`}function closeModal(){$('modal').innerHTML=''}async function saveManual(a,j){let i=$('mi').value,o=$('mo').value,r=$('mr').value.trim();if(!i)return alert('出勤時刻を入力してください');if(!r)return alert('修正理由を入力してください');let x=await db.rpc('company_manual_attendance',{p_application_id:a,p_checked_in_at:new Date(i).toISOString(),p_checked_out_at:o?new Date(o).toISOString():null,p_reason:r});if(x.error)return alert(x.error.message);closeModal();applicants(j)}async function status(a,s,j){if(s==='採用'){let jr=await db.from('jobs').select('required_headcount,applications(status)').eq('id',j).single();let need=Number(jr.data?.required_headcount||1),h=(jr.data?.applications||[]).filter(x=>['採用','勤務確定','勤務完了'].includes(x.status)).length;if(h>=need)return alert('必要人数に達しています。追加採用する場合は必要人数を変更してください。')}let x=await db.from('applications').update({status:s,...(s==='採用'?{hired_at:new Date().toISOString()}:{})}).eq('id',a);if(x.error)return alert(x.error.message);await dashboard();let box=$('a'+j);if(box){box.style.display='block';applicants(j)}}async function workflow(a,j){let x=await db.from('applications').update({status:'勤務確定',work_confirmed_at:new Date().toISOString()}).eq('id',a);if(x.error)return alert(x.error.message);applicants(j)}async function logout(){await db.auth.signOut();location.href='./'}init();</script></body></html>
