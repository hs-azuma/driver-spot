<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 企業</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:1000px;margin:auto;padding:22px}.brand{color:#172033;text-decoration:none}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:16px 0}button{padding:11px 16px;border-radius:9px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:#fff}.danger{border-color:#c62828;color:#c62828}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{background:#edf4ff;color:#1769d2;padding:5px 9px;border-radius:20px}.hired{background:#e9f8ef;color:#16803c;font-weight:bold;padding:6px 10px;border-radius:20px}.full{background:#eef1f5;color:#586274;font-weight:bold;padding:6px 10px;border-radius:20px}.cancelled{background:#fdecec;color:#b42318;font-weight:bold;padding:6px 10px;border-radius:20px}</style></head><body><header><h1><a class="brand" href="./">スポドラ</a></h1><p>企業マイページ</p></header><main><div class="card row"><button class="primary">求人管理</button><button onclick="location.href='./company-applicants.html'">応募者・採用管理</button><button onclick="location.href='./company-workforce.html'">勤怠管理</button><button onclick="location.href='./company-attendance.html'">QR打刻</button><span id="state" style="margin-left:auto">確認中...</span><button onclick="logout()">ログアウト</button></div><div id="content"></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let user,company;const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),t=x=>String(x||'').slice(0,5);async function init(){user=(await db.auth.getUser()).data.user;if(!user){$('state').textContent='未ログイン';return}company=(await db.from('companies').select('*').eq('user_id',user.id).maybeSingle()).data;if(!company)return;$('state').textContent=company.company_name+' ログイン中';dashboard()}async function dashboard(){let r=await db.from('jobs').select('*,applications(id,status)').eq('company_id',company.id).order('created_at',{ascending:false}),jobs=r.data||[];$('content').innerHTML=`<div class="card row"><h2 style="margin-right:auto">求人管理</h2><button class="primary" onclick="location.href='./job-create.html'">＋求人登録</button></div>`+jobs.map(j=>{let apps=j.applications||[],done=apps.filter(a=>a.status==='勤務完了').length,hired=apps.filter(a=>['採用','勤務確定','勤務完了'].includes(a.status)).length,need=Number(j.required_headcount||1),remain=Math.max(0,need-hired),cancelled=j.status==='キャンセル';return `<div class="card"><div class="row"><h3 style="margin-right:auto">${e(j.job_description||'ドライバー求人')}</h3>${cancelled?'<span class="cancelled">求人取消済み</span>':''}${done?`<span class="hired">✓ 勤務完了 ${done}人</span>`:''}</div><p>${e(j.work_date)}　${t(j.start_time)}〜${t(j.end_time)}　${e(j.location)}${j.destination?' → '+e(j.destination):''}</p><div class="row"><span class="badge">${e(j.pay_type)} ${Number(j.pay_amount||0).toLocaleString()}円</span><span class="badge">必要 ${need}人</span><span class="${remain===0?'full':'hired'}">残り ${remain}人</span>${remain===0?'<span class="full">募集充足</span>':''}</div><p class="row"><button onclick="location.href='./company-applicants.html'">応募者を見る（${apps.length}人）</button>${!cancelled&&done===0?`<button class="danger" onclick="cancelJob(${j.id},${apps.length})">求人を取り消す</button>`:''}</p></div>`}).join('')}async function cancelJob(id,count){let msg=count?`この求人には応募者が${count}人います。求人を取り消すと新規応募を停止します。応募者の履歴は削除しません。取り消しますか？`:'この求人を取り消しますか？';if(!confirm(msg))return;let x=await db.from('jobs').update({status:'キャンセル'}).eq('id',id).eq('company_id',company.id);if(x.error)return alert('取消エラー：'+x.error.message);alert('求人を取り消しました。');dashboard()}async function logout(){await db.auth.signOut();location.href='./'}init();</script></body></html>
