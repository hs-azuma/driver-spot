<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 企業</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:1000px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:16px 0}button{padding:11px 16px;border-radius:9px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:#fff}.danger{border-color:#c62828;color:#c62828}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{background:#edf4ff;color:#1769d2;padding:5px 9px;border-radius:20px}.hired{background:#e9f8ef;color:#16803c;font-weight:bold;padding:6px 10px;border-radius:20px}.full{background:#eef1f5;color:#586274;font-weight:bold;padding:6px 10px;border-radius:20px}.cancelled{background:#fdecec;color:#b42318;font-weight:bold;padding:6px 10px;border-radius:20px}.spodora-brand{display:block;width:300px;max-width:72vw}.spodora-brand img{display:block;width:100%;height:auto;mix-blend-mode:darken}.section-heading{justify-content:space-between;margin:28px 0 12px;gap:12px}.section-heading h2{margin:0;font-size:24px}@media(max-width:650px){.spodora-brand{width:240px}} .schedule-item{display:grid;grid-template-columns:minmax(100px,1fr) minmax(120px,1fr) auto;gap:10px;align-items:center;border-top:1px solid #e4e9f1;padding:14px 0}.schedule-job{grid-column:1/-1;margin:0;color:#68758b;overflow-wrap:anywhere}.schedule-time{display:flex;flex-direction:column;gap:6px;font-weight:bold}.schedule-time-label{font-size:12px;color:#68758b;font-weight:normal;margin-right:8px}.schedule-actual{font-size:14px;font-weight:normal;color:#172033;overflow-wrap:anywhere}.schedule-wait{background:#fff4dc;color:#8a5b00}.schedule-done{background:#eef1f5;color:#586274}@media(max-width:650px){.schedule-item{grid-template-columns:1fr auto}.schedule-time{grid-column:1}.schedule-item>.badge{grid-column:2;grid-row:1/3}}</style><script src="./assets/attendance-summary.js?v=20261005a"></script></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p id="companyPageHeading">企業マイページ</p></header><main><div class="card row"><button id="jobsMenu" class="primary" aria-pressed="true" onclick="showJobView('jobs',true)">求人管理</button><button class="primary" onclick="location.href='./job-create.html'">＋求人登録</button><button id="draftsMenu" aria-pressed="false" onclick="showJobView('drafts',true)">下書き一覧（読み込み中）</button><button onclick="location.href='./company-applicants.html'">応募者・採用管理</button><button onclick="location.href='./company-applicants.html?view=favorites'">お気に入りドライバー</button><button onclick="location.href='./company-applicants.html?view=blocks'">ブロック一覧</button><button onclick="location.href='./company-workforce.html'">勤怠管理</button><button onclick="location.href='./company-attendance-qr.html'">QRコード表示</button><button onclick="location.href='./company-profile.html'">企業情報変更</button><button onclick="location.href='./line-link.html'" style="background:#16803c;border-color:#16803c;color:#fff">LINE通知を設定する</button><button class="danger" onclick="deleteAccount()">退会</button><span id="state" role="status" hidden></span><button onclick="logout()">ログアウト</button></div><section class="card" id="todaySchedule" hidden><div class="row" style="justify-content:space-between"><h2>本日の出勤予定</h2><button onclick="loadTodaySchedule()">更新</button></div><p id="scheduleSummary">読み込み中...</p><div id="scheduleList"></div><p style="color:#68758b;font-size:13px">出退勤の状態は30秒ごとに自動更新します。</p></section><section class="card" id="jobDrafts" hidden></section><div id="content"></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let user,company;let jobView='jobs';let jobFilter='open',companyJobs=[];const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),t=x=>String(x||'').slice(0,5),wd=x=>{if(!x)return'';let a=String(x).split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]);return x+'（'+['日','月','火','水','木','金','土'][d.getDay()]+'）'};async function init(){user=(await db.auth.getUser()).data.user;if(!user){location.replace('./company-register.html');return}const profile=await db.from('companies').select('*').eq('user_id',user.id).maybeSingle();if(profile.error){$('state').hidden=false;$('state').textContent='企業情報を取得できませんでした。ページを開き直してください。';return}company=profile.data;if(!company){location.replace('./company-register.html');return}$('companyPageHeading').textContent=(company.company_name?company.company_name+' ':'')+'企業マイページ';$('state').hidden=true;$('state').textContent='';dashboard();loadTodaySchedule()}async function dashboard(){await loadJobDrafts();const r=await db.from('jobs').select('*,applications(id,status)').eq('company_id',company.id).order('created_at',{ascending:false});if(r.error){$('content').innerHTML='<div class="card"><p>求人を取得できませんでした。</p><button onclick="dashboard()">再読み込み</button></div>';return}companyJobs=r.data||[];renderCompanyJobs()}
function jobGroup(j,now=new Date()){if(j.status==='キャンセル')return 'cancelled';const hired=(j.applications||[]).filter(a=>['採用','勤務確定','勤務完了'].includes(a.status)).length;if(hired>=Number(j.required_headcount||1))return 'closed';const today=now.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}),clock=now.toLocaleTimeString('en-GB',{timeZone:'Asia/Tokyo',hour12:false});if(j.work_date&&(j.work_date<today||(j.work_date===today&&j.start_time&&(String(j.start_time).length===5?j.start_time+':00':String(j.start_time).slice(0,8))<=clock)))return 'closed';return 'open'}
function setJobFilter(filter){if(!['open','closed','cancelled'].includes(filter))return;jobFilter=filter;renderCompanyJobs()}
function renderCompanyJobs(){const now=new Date(),groups=companyJobs.map(j=>({j,group:jobGroup(j,now)})),labels={open:'募集中',closed:'募集終了',cancelled:'取消済み'},jobs=groups.filter(x=>x.group===jobFilter).map(x=>x.j);$('content').innerHTML=`<div class="section-heading row"><h2>求人一覧</h2></div><div class="row" aria-label="求人の表示切り替え">`+Object.entries(labels).map(([key,label])=>'<button class="'+(jobFilter===key?'primary':'')+'" aria-pressed="'+(jobFilter===key)+'" onclick="setJobFilter(\''+key+'\')">'+label+'（'+groups.filter(x=>x.group===key).length+'件）</button>').join('')+'</div><p style="color:#68758b;font-size:13px">募集人数が埋まった求人、または勤務開始時刻を過ぎた求人は「募集終了」に表示します。</p>'+jobs.map(j=>{let apps=j.applications||[],done=apps.filter(a=>a.status==='勤務完了').length,hired=apps.filter(a=>['採用','勤務確定','勤務完了'].includes(a.status)).length,need=Number(j.required_headcount||1),remain=Math.max(0,need-hired),cancelled=j.status==='キャンセル';return `<div class="card"><div class="row"><h3 style="margin-right:auto">${e(j.job_description||'ドライバー求人')}</h3>${cancelled?'<span class="cancelled">求人取消済み</span>':''}${done?`<span class="hired">✓ 勤務完了 ${done}人</span>`:''}</div><p>${e(wd(j.work_date))}　${t(j.start_time)}〜${t(j.end_time)}　${e(j.location)}${j.destination?' → '+e(j.destination):''}</p><div class="row"><span class="badge">${e(j.pay_type)} ${Number(j.pay_amount||0).toLocaleString()}円</span><span class="badge">必要 ${need}人</span><span class="${remain===0?'full':'hired'}">残り ${remain}人</span>${remain===0?'<span class="full">募集充足</span>':''}</div><p><strong>${e(SpodoraAttendance.policyLabel(j.pay_guarantee))}</strong></p>${!cancelled&&apps.length===0?`<div class="row"><label for="policy-${j.id}">給与条件</label><select id="policy-${j.id}" style="padding:10px;border:1px solid #cbd5e1;border-radius:9px"><option value="">選択してください</option><option value="true" ${j.pay_guarantee===true?'selected':''}>募集時間分を保証する</option><option value="false" ${j.pay_guarantee===false?'selected':''}>実働時間で計算する</option></select><button onclick="savePayPolicy(${j.id},this)">給与条件を保存</button></div>`:'<p style="font-size:12px;color:#68758b">応募後の給与条件は変更できません。</p>'}<p class="row"><button onclick="location.href='./job-create.html?copy=${j.id}'">この求人をコピー</button><button onclick="location.href='./company-applicants.html?job=${j.id}'">応募者を見る（${apps.length}人）</button>${!cancelled&&done===0?`<button class="danger" onclick="cancelJob(${j.id},${apps.length})">求人を取り消す</button>`:''}</p></div>`}).join('')+(!jobs.length?'<div class="card"><p>'+labels[jobFilter]+'の求人はありません。</p></div>':'')}function showJobView(view,scroll=false){jobView=view==='drafts'?'drafts':'jobs';const drafts=jobView==='drafts';$('jobDrafts').hidden=!drafts;$('content').hidden=drafts;$('jobsMenu').classList.toggle('primary',!drafts);$('draftsMenu').classList.toggle('primary',drafts);$('jobsMenu').setAttribute('aria-pressed',String(!drafts));$('draftsMenu').setAttribute('aria-pressed',String(drafts));if(scroll)(drafts?$('jobDrafts'):$('content')).scrollIntoView({behavior:'smooth',block:'start'})}
async function loadJobDrafts(){const r=await db.from('job_drafts').select('id,content,updated_at').eq('company_id',company.id).order('updated_at',{ascending:false});const section=$('jobDrafts');if(r.error){$('draftsMenu').textContent='下書き一覧（取得失敗）';showJobView(jobView);section.innerHTML='<h2>下書き一覧</h2><p>下書きを取得できませんでした。ページを開き直してください。</p>';return}$('draftsMenu').textContent='下書き一覧（'+(r.data||[]).length+'件）';showJobView(jobView);section.innerHTML='<h2>下書き一覧</h2><p style="color:#68758b">下書きはドライバーに表示されず、通知も送られません。</p>'+(r.data||[]).map(d=>'<div style="border-top:1px solid #dbe3ef;padding:14px 0"><h3>'+e(d.content?.desc||'タイトル未入力')+'</h3><p>'+e(d.content?.date||'勤務日未入力')+' ／ 最終保存 '+e(new Date(d.updated_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))+'</p><button onclick="location.href=\'./job-create.html?draft='+encodeURIComponent(d.id)+'\'">続きを編集</button></div>').join('')+(!(r.data||[]).length?'<p>保存した下書きはありません。求人登録画面の「下書き保存」から保存できます。</p>':'')}
async function savePayPolicy(id,btn){const value=$('policy-'+id).value;if(!['true','false'].includes(value))return alert('給与条件を選択してください。');btn.disabled=true;const r=await db.from('jobs').update({pay_guarantee:value==='true'}).eq('id',id).eq('company_id',company.id).select('id');btn.disabled=false;if(r.error)return alert('保存できませんでした：'+r.error.message);if(!r.data?.length)return alert('求人を更新できませんでした。');dashboard()}async function cancelJob(id,count){let msg=count?`この求人には応募者が${count}人います。求人を取り消すと新規応募を停止します。応募者の履歴は削除しません。取り消しますか？`:'この求人を取り消しますか？';if(!confirm(msg))return;let x=await db.from('jobs').update({status:'キャンセル'}).eq('id',id).eq('company_id',company.id);if(x.error)return alert('取消エラー：'+x.error.message);alert('求人を取り消しました。');dashboard()}async function deleteAccount(){if(!user)return;if(!confirm('退会すると企業情報・求人・応募者情報・勤怠・レビュー等の登録情報はすべて削除され、元に戻せません。退会しますか？'))return;if(!confirm('最終確認です。本当に退会してすべての情報を削除しますか？'))return;let r=await db.functions.invoke('delete-account',{body:{}});if(r.error||r.data?.error)return alert('退会処理に失敗しました。'+(r.data?.error||r.error?.message||''));await db.auth.signOut();alert('退会が完了しました。登録情報を削除しました。');location.href='./'}async function logout(){await db.auth.signOut();location.href='./'}
let scheduleBusy=false;
function scheduleDate(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'})}
function actualAttendanceTime(value,workDate){if(!value)return '—';const d=new Date(value);if(Number.isNaN(d.getTime()))return '—';const date=d.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}),time=d.toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false});return (date===workDate?'':date.slice(5).replace('-','/')+' ')+time}
function attendanceStatus(a){return a.checked_out_at?'退勤済':a.checked_in_at?'出勤中':'未出勤'}
async function loadTodaySchedule(){
 if(!company||scheduleBusy)return;
 scheduleBusy=true;$('todaySchedule').hidden=false;
 try{
  const r=await db.from('jobs').select('id,work_date,job_description,start_time,end_time,status,applications(id,status,checked_in_at,checked_out_at,drivers(name))').eq('company_id',company.id).eq('work_date',scheduleDate()).order('start_time',{ascending:true});
  if(r.error)throw r.error;
  const entries=(r.data||[]).filter(j=>j.status!=='キャンセル').flatMap(j=>(j.applications||[]).filter(a=>['採用','勤務確定','勤務完了'].includes(a.status)).map(a=>({j,a})));
  const present=entries.filter(({a})=>a.checked_in_at&&!a.checked_out_at).length,done=entries.filter(({a})=>a.checked_out_at).length;
  $('scheduleSummary').textContent=scheduleDate()+'　予定 '+entries.length+'人・未出勤 '+(entries.length-present-done)+'人・出勤中 '+present+'人・退勤済 '+done+'人';
  $('scheduleList').innerHTML=entries.map(({j,a})=>'<div class="schedule-item"><strong>'+e(a.drivers?.name||'氏名未登録')+'</strong><div class="schedule-time"><span><span class="schedule-time-label">予定</span>'+e(t(j.start_time))+'〜'+e(t(j.end_time))+'</span><span class="schedule-actual">実際の出勤 '+e(actualAttendanceTime(a.checked_in_at,j.work_date))+' ／ 退勤 '+e(actualAttendanceTime(a.checked_out_at,j.work_date))+'</span></div><span class="badge '+(a.checked_out_at?'schedule-done':a.checked_in_at?'hired':'schedule-wait')+'">'+attendanceStatus(a)+'</span><p class="schedule-job">'+e(j.job_description||'ドライバー求人')+'</p></div>').join('')||'<p>本日の出勤予定はありません。</p>';
 }catch(err){$('scheduleSummary').textContent='出勤予定を取得できませんでした。「更新」を押して再度お試しください。'}
 finally{scheduleBusy=false}
}
setInterval(()=>{if(!document.hidden)loadTodaySchedule()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadTodaySchedule()});
window.addEventListener('pageshow',event=>{if(event.persisted){loadTodaySchedule();if(company)loadJobDrafts()}});
init();</script></body></html>
