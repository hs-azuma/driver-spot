<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT 企業</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:1000px;margin:auto;padding:22px}.brand{color:#172033;text-decoration:none}.card{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:16px 0}button{padding:11px 16px;border-radius:9px;border:1px solid #1769d2;background:white;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:white}.danger{border-color:#c62828;color:#c62828}.dark{border-color:#555;color:#333}.green{background:#16803c;color:white;border-color:#16803c}input,select{width:100%;max-width:560px;padding:11px;margin:6px 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{background:#edf4ff;color:#1769d2;padding:5px 9px;border-radius:20px}.hired{background:#e9f8ef;color:#16803c;font-weight:bold;padding:6px 10px;border-radius:20px}.history{display:inline-block;margin:4px 8px 4px 0;padding:7px 11px;border-radius:9px;background:#f4f7fb;font-weight:bold;border:1px solid #dbe3ef;color:#172033}.app{border-top:1px solid #ddd;padding:14px 0}.error{color:#c62828}.note{color:#68758b}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}.modalbox{background:white;border-radius:14px;padding:20px;max-width:680px;width:100%;max-height:75vh;overflow:auto}.historyrow{border-top:1px solid #e2e6ec;padding:12px 0}</style></head><body><header><h1><a class="brand" href="./">DRIVER SPOT</a></h1><p>企業マイページ</p></header><main><div class="card row"><a href="./"><button>求人ページへ戻る</button></a><span id="state">確認中...</span><button onclick="showBlocked()">ブロックリスト</button><button onclick="logout()">ログアウト</button></div><div id="content"></div></main><div id="historyModal" style="display:none"></div><script>
const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let user,company;const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');async function init(){user=(await db.auth.getUser()).data.user;if(!user){$('state').textContent='未ログイン';$('content').innerHTML='<div class="card">企業ログインが必要です</div>';return}company=(await db.from('companies').select('*').eq('user_id',user.id).maybeSingle()).data;if(!company){$('content').innerHTML='<div class="card">企業情報が見つかりません。</div>';return}$('state').textContent=company.company_name+' ログイン中';dashboard()}async function dashboard(){let r=await db.from('jobs').select('*,applications(count)').eq('company_id',company.id).order('created_at',{ascending:false}),jobs=r.data||[];$('content').innerHTML=`<div class="card row"><h2 style="margin-right:auto">${e(company.company_name)} マイページ</h2><button class="primary" onclick="location.href='./company-register.html'">＋求人登録</button></div>`+(jobs.length?jobs.map(j=>`<div class="card"><h3>${e(j.job_description||'ドライバー求人')}</h3><p>${e(j.work_date)}　${e(j.location)}${j.destination?' → '+e(j.destination):''}</p><span class="badge">${e(j.pay_type)} ${Number(j.pay_amount||0).toLocaleString()}円</span> <button id="b${j.id}" onclick="toggleApplicants(${j.id})">応募者を見る（${j.applications?.[0]?.count||0}人）</button><div id="a${j.id}" style="display:none"></div></div>`).join(''):'<div class="card">まだ自社求人はありません。</div>')}async function toggleApplicants(id){let box=$('a'+id),btn=$('b'+id);if(box.style.display!=='none'){box.style.display='none';btn.textContent=btn.textContent.replace('閉じる','見る');return}box.style.display='block';btn.textContent=btn.textContent.replace('見る','閉じる');applicants(id)}async function getHistory(ids){let map=new Map(ids.map(id=>[Number(id),{applied:0,hired:0}]));if(!ids.length)return map;let r=await db.from('applications').select('driver_id,status,jobs!inner(company_id)').in('driver_id',ids).eq('jobs.company_id',company.id);(r.data||[]).forEach(x=>{let h=map.get(Number(x.driver_id))||{applied:0,hired:0};h.applied++;if(['採用','勤務確定','勤務完了'].includes(x.status))h.hired++;map.set(Number(x.driver_id),h)});return map}function stateLabel(s){if(s==='勤務完了')return '<span class="hired">勤務完了</span>';if(s==='勤務確定')return '<span class="hired">勤務確定</span>';if(s==='採用')return '<span class="hired">採用済み</span>';return `<span class="badge">${e(s||'応募中')}</span>`}async function applicants(id){let box=$('a'+id);box.innerHTML='読み込み中...';let r=await db.from('applications').select('id,status,driver_id,hired_at,work_confirmed_at,completed_at,drivers(name,phone,email,area,license_type,experience_years)').eq('job_id',id);if(r.error)return box.innerHTML='<p class="error">'+e(r.error.message)+'</p>';let br=await db.from('company_driver_blocks').select('driver_id').eq('company_id',company.id),blocked=new Set((br.data||[]).map(x=>Number(x.driver_id))),history=await getHistory((r.data||[]).map(x=>x.driver_id));box.innerHTML=r.data.length?r.data.map(a=>{let d=a.drivers||{},h=history.get(Number(a.driver_id))||{applied:0,hired:0},isB=blocked.has(Number(a.driver_id)),buttons='';if(a.status==='採用')buttons=`<button class="green" onclick="workflow(${a.id},'勤務確定',${id})">勤務確定</button><button class="danger" onclick="cancelHire(${a.id},${id})">採用をキャンセル</button>`;else if(a.status==='勤務確定')buttons=`<button class="green" onclick="workflow(${a.id},'勤務完了',${id})">勤務完了</button>`;else if(a.status==='勤務完了')buttons='<span class="hired">この勤務は完了しています</span>';else buttons=`<button onclick="status(${a.id},'採用候補',${id})">採用候補</button><button class="primary" onclick="status(${a.id},'採用',${id})">採用</button><button class="danger" onclick="status(${a.id},'見送り',${id})">見送り</button>`;return `<div class="app"><b>${e(d.name)}</b> ${stateLabel(a.status)}${isB?' <span class="error">ブロック中</span>':''}<p><button class="history" onclick="showHistory(${a.driver_id},'all')">この会社への応募 ${h.applied}回</button><button class="history" onclick="showHistory(${a.driver_id},'hired')">採用 ${h.hired}回</button></p><p>免許：${e(d.license_type||'未設定')} ／ 経験：${Number(d.experience_years||0)>=4?'4年以上':Number(d.experience_years||0)>=1?'1〜3年':'1年未満'} ／ 希望エリア：${e(d.area||'未設定')}</p><p>電話：${e(d.phone||'未設定')} ／ メール：${e(d.email||'未設定')}</p><div class="row">${buttons}${isB?`<button onclick="unblockDriver(${a.driver_id},${id})">ブロック解除</button>`:`<button class="dark" onclick="blockDriver(${a.driver_id},${id})">このドライバーをブロック</button>`}</div></div>`}).join(''):'<p class="note">まだ応募者はいません。</p>'}async function status(a,s,j){if(!confirm('「'+s+'」に変更しますか？'))return;let patch={status:s};if(s==='採用')patch.hired_at=new Date().toISOString();let r=await db.from('applications').update(patch).eq('id',a);if(r.error)return alert(r.error.message);applicants(j)}async function workflow(a,s,j){let text=s==='勤務確定'?'このドライバーの勤務を確定しますか？':'実際に勤務が完了したことを確認しましたか？';if(!confirm(text))return;let patch={status:s};if(s==='勤務確定')patch.work_confirmed_at=new Date().toISOString();if(s==='勤務完了')patch.completed_at=new Date().toISOString();let r=await db.from('applications').update(patch).eq('id',a);if(r.error)return alert(r.error.message);alert(s+'にしました');applicants(j)}async function cancelHire(a,j){if(!confirm('採用をキャンセルしますか？'))return;let r=await db.from('applications').update({status:'応募中',hired_at:null,work_confirmed_at:null,completed_at:null}).eq('id',a);if(r.error)return alert(r.error.message);applicants(j)}async function blockDriver(d,j){if(!confirm('このドライバーをブロックしますか？'))return;let r=await db.from('company_driver_blocks').upsert({company_id:company.id,driver_id:d},{onConflict:'company_id,driver_id'});if(r.error)return alert(r.error.message);applicants(j)}async function unblockDriver(d,j){let r=await db.from('company_driver_blocks').delete().eq('company_id',company.id).eq('driver_id',d);if(r.error)return alert(r.error.message);j?applicants(j):showBlocked()}async function showBlocked(){let r=await db.from('company_driver_blocks').select('driver_id,drivers(name,phone,email)').eq('company_id',company.id);$('content').innerHTML=`<div class="card"><div class="row"><h2 style="margin-right:auto">ブロックリスト</h2><button onclick="dashboard()">戻る</button></div>${(r.data||[]).length?r.data.map(x=>`<div class="app"><b>${e(x.drivers?.name||'ドライバー')}</b><p>${e(x.drivers?.phone||'')}　${e(x.drivers?.email||'')}</p><button onclick="unblockDriver(${x.driver_id},null)">ブロック解除</button></div>`).join(''):'<p>ブロック中のドライバーはいません。</p>'}</div>`}async function showHistory(driverId,type){let m=$('historyModal');m.style.display='block';let r=await db.from('applications').select('status,jobs!inner(company_id,job_description,work_date,location,destination,start_time,end_time,pay_type,pay_amount)').eq('driver_id',driverId).eq('jobs.company_id',company.id);let rows=(r.data||[]).filter(x=>type==='hired'?['採用','勤務確定','勤務完了'].includes(x.status):true).sort((a,b)=>String(b.jobs?.work_date||'').localeCompare(String(a.jobs?.work_date||'')));m.innerHTML=`<div class="modal" onclick="if(event.target===this)closeHistory()"><div class="modalbox"><div class="row"><h2 style="margin-right:auto">${type==='hired'?'採用履歴':'応募履歴'}</h2><button onclick="closeHistory()">閉じる</button></div>${rows.map(x=>`<div class="historyrow"><b>${e(x.jobs?.work_date||'')}　${e(x.jobs?.job_description||'')}</b><p>${e(x.jobs?.location||'')}${x.jobs?.destination?' → '+e(x.jobs.destination):''}</p><p>状態：${e(x.status)}</p></div>`).join('')||'<p>履歴はありません。</p>'}</div></div>`}function closeHistory(){$('historyModal').style.display='none'}async function logout(){await db.auth.signOut();location.href='./'}init();
</script></body></html>
