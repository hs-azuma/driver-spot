<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT 企業</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:1000px;margin:auto;padding:22px}.brand{color:#172033;text-decoration:none}.card{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:16px 0}button{padding:11px 16px;border-radius:9px;border:1px solid #1769d2;background:white;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:white}.danger{border-color:#c62828;color:#c62828}.dark{border-color:#555;color:#333}input,select{width:100%;max-width:560px;padding:11px;margin:6px 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{background:#edf4ff;color:#1769d2;padding:5px 9px;border-radius:20px}.hired{background:#e9f8ef;color:#16803c;font-weight:bold;padding:6px 10px;border-radius:20px}.history{display:inline-block;margin:4px 8px 4px 0;padding:7px 11px;border-radius:9px;background:#f4f7fb;font-weight:bold}.app{border-top:1px solid #ddd;padding:14px 0}.error{color:#c62828}.note{color:#68758b}</style></head><body><header><h1><a class="brand" href="./">DRIVER SPOT</a></h1><p>企業マイページ</p></header><main><div class="card row"><a href="./"><button>求人ページへ戻る</button></a><span id="state">確認中...</span><button onclick="showBlocked()">ブロックリスト</button><button onclick="logout()">ログアウト</button></div><div id="content"></div></main><script>
const key='sb_'+'publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC',db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co',key);let user,company;const $=x=>document.getElementById(x),v=x=>$(x)?.value.trim()||'',e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');async function init(){user=(await db.auth.getUser()).data.user;if(!user){$('state').textContent='未ログイン';$('content').innerHTML='<div class="card">企業ログインが必要です</div>';return}company=(await db.from('companies').select('*').eq('user_id',user.id).maybeSingle()).data;if(!company)return profile();$('state').textContent=company.company_name+' ログイン中';dashboard()}function profile(){let m=user.user_metadata||{};$('content').innerHTML=`<div class="card"><h2>企業情報登録</h2><label>会社名</label><input id="cn" value="${e(m.company_name||'')}"><label>担当者名</label><input id="ct"><label>電話番号</label><input id="ph"><label>会社住所</label><input id="ad"><br><button class="primary" onclick="saveProfile()">企業情報を登録</button></div>`}async function saveProfile(){let p={user_id:user.id,company_name:v('cn'),contact_name:v('ct'),phone:v('ph'),address:v('ad'),email:user.email},r=await db.from('companies').upsert(p,{onConflict:'user_id'}).select().single();if(r.error)return alert(r.error.message);company=r.data;dashboard()}async function dashboard(){let r=await db.from('jobs').select('*,applications(count)').eq('company_id',company.id).order('created_at',{ascending:false}),jobs=r.data||[];$('content').innerHTML=`<div class="card row"><h2 style="margin-right:auto">${e(company.company_name)} マイページ</h2><button class="primary" onclick="jobForm()">＋求人登録</button></div>`+(jobs.length?jobs.map(j=>{let n=j.applications?.[0]?.count||0;return `<div class="card"><h3>${e(j.job_description||'ドライバー求人')}</h3><p>${e(j.work_date)}　${e(j.location)}${j.destination?' → '+e(j.destination):''}</p><span class="badge">${e(j.pay_type)} ${Number(j.pay_amount||0).toLocaleString()}円</span> <button id="b${j.id}" onclick="toggleApplicants(${j.id})">応募者を見る（${n}人）</button><div id="a${j.id}" style="display:none"></div></div>`}).join(''):'<div class="card">まだ自社求人はありません。</div>')}function jobForm(){$('content').innerHTML=`<div class="card"><h2>求人登録</h2><label>仕事内容</label><input id="jd"><label>集荷/配送先（出発）</label><input id="lo"><label>集荷/配送先（到着）</label><input id="de"><label>勤務日</label><input id="dt" type="date"><label>開始</label><input id="st" type="time"><label>終了</label><input id="en" type="time"><label>給与</label><select id="pt"><option>時給</option><option>日給</option></select><input id="pa" type="number"><label>必要免許</label><select id="li"><option value="">指定なし</option><option>普通</option><option>準中型</option><option>中型</option><option>大型</option></select><label>必要経験</label><select id="ex"><option value="">指定なし</option><option>1年未満</option><option>1〜3年</option><option>4年以上</option></select><br><button class="primary" onclick="saveJob()">求人を掲載</button> <button onclick="dashboard()">戻る</button></div>`}async function saveJob(){let r=await db.from('jobs').insert({company_id:company.id,job_description:v('jd'),location:v('lo'),destination:v('de'),work_date:v('dt'),start_time:v('st')||null,end_time:v('en')||null,pay_type:v('pt'),pay_amount:Number(v('pa')||0),required_license:v('li'),required_experience:v('ex'),status:'募集中'});if(r.error)return alert(r.error.message);alert('求人を掲載しました');dashboard()}async function toggleApplicants(id){let box=$('a'+id),btn=$('b'+id);if(box.style.display!=='none'){box.style.display='none';btn.textContent=btn.textContent.replace('閉じる','見る');return}box.style.display='block';btn.textContent=btn.textContent.replace('見る','閉じる');applicants(id)}async function getHistory(ids){let map=new Map(ids.map(id=>[Number(id),{applied:0,hired:0}]));if(!ids.length)return map;let r=await db.from('applications').select('driver_id,status,jobs!inner(company_id)').in('driver_id',ids).eq('jobs.company_id',company.id);(r.data||[]).forEach(x=>{let h=map.get(Number(x.driver_id))||{applied:0,hired:0};h.applied++;if(x.status==='採用')h.hired++;map.set(Number(x.driver_id),h)});return map}async function applicants(id){let box=$('a'+id);box.innerHTML='読み込み中...';let r=await db.from('applications').select('id,status,driver_id,drivers(name,phone,email,area,license_type,experience_years)').eq('job_id',id);if(r.error)return box.innerHTML='<p class="error">'+e(r.error.message)+'</p>';let br=await db.from('company_driver_blocks').select('driver_id').eq('company_id',company.id),blocked=new Set((br.data||[]).map(x=>Number(x.driver_id))),history=await getHistory((r.data||[]).map(x=>x.driver_id));box.innerHTML=r.data.length?r.data.map(a=>{let d=a.drivers||{},x=Number(d.experience_years||0),exp=x>=4?'4年以上':x>=1?'1〜3年':'1年未満',isB=blocked.has(Number(a.driver_id)),h=history.get(Number(a.driver_id))||{applied:0,hired:0},isH=a.status==='採用';return `<div class="app"><b>${e(d.name)}</b> ${isH?'<span class="hired">採用済み</span>':`<span class="badge">${e(a.status||'応募中')}</span>`}${isB?' <span class="error">ブロック中</span>':''}<p><span class="history">この会社への応募 ${h.applied}回</span><span class="history">採用 ${h.hired}回</span></p><p>免許：${e(d.license_type||'未設定')} ／ 経験：${exp} ／ 希望エリア：${e(d.area||'未設定')}</p><p>電話：${e(d.phone||'未設定')} ／ メール：${e(d.email||'未設定')}</p><div class="row">${isH?'<span class="hired">この求人で採用済み</span>':`<button onclick="status(${a.id},'採用候補',${id})">採用候補</button><button class="primary" onclick="status(${a.id},'採用',${id})">採用</button><button class="danger" onclick="status(${a.id},'見送り',${id})">見送り</button>`}${isB?`<button onclick="unblockDriver(${a.driver_id},${id})">ブロック解除</button>`:`<button class="dark" onclick="blockDriver(${a.driver_id},${id})">このドライバーをブロック</button>`}</div></div>`}).join(''):'<p class="note">まだ応募者はいません。</p>'}async function blockDriver(d,j){if(!confirm('このドライバーをブロックしますか？'))return;let r=await db.from('company_driver_blocks').upsert({company_id:company.id,driver_id:d},{onConflict:'company_id,driver_id'});if(r.error)return alert(r.error.message);applicants(j)}async function unblockDriver(d,j){let r=await db.from('company_driver_blocks').delete().eq('company_id',company.id).eq('driver_id',d);if(r.error)return alert(r.error.message);j?applicants(j):showBlocked()}async function showBlocked(){let r=await db.from('company_driver_blocks').select('driver_id,created_at,drivers(name,phone,email)').eq('company_id',company.id).order('created_at',{ascending:false});$('content').innerHTML=`<div class="card"><div class="row"><h2 style="margin-right:auto">ブロックリスト</h2><button onclick="dashboard()">マイページへ戻る</button></div>${(r.data||[]).length?r.data.map(x=>`<div class="app"><b>${e(x.drivers?.name||'ドライバー')}</b><p>${e(x.drivers?.phone||'')}　${e(x.drivers?.email||'')}</p><button onclick="unblockDriver(${x.driver_id},null)">ブロック解除</button></div>`).join(''):'<p class="note">ブロック中のドライバーはいません。</p>'}</div>`}async function status(a,s,j){if(!confirm('「'+s+'」に変更しますか？'))return;let r=await db.from('applications').update({status:s}).eq('id',a);if(r.error)return alert(r.error.message);applicants(j)}async function logout(){await db.auth.signOut();location.href='./'}init();
</script></body></html>
