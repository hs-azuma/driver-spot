<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>スポドラ｜LINE連携</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}main{max-width:600px;margin:32px auto;padding:20px}.card{background:white;border:1px solid #dbe3ef;border-radius:16px;padding:24px}.brand{display:block;width:260px;max-width:70vw;margin-bottom:24px}.brand img{width:100%;height:auto}label{display:block;margin:16px 0 6px}input,button{font-size:16px;padding:14px;border-radius:10px;width:100%}input{border:1px solid #cbd7e8}button{background:#16803c;color:white;border:0;margin:16px 0;cursor:pointer}button:disabled{opacity:.55;cursor:default}.note{color:#68758b;line-height:1.7}.error{color:#b42318}a{color:#1769d2}.danger{background:#fff;color:#b42318;border:1px solid #b42318}[hidden]{display:none!important}</style></head>
<body><main><a class="brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><div class="card"><h1>LINE連携</h1><p class="note">スポドラのドライバー・企業アカウントとLINEを結び付けます。連携はこの画面でいつでも解除できます。連携すると、求人・応募結果・勤務前日・新規応募の通知をLINEで受け取れます。</p><p id="message" role="status" aria-live="polite">確認中…</p>
<form id="loginForm" hidden><h2>スポドラにログイン</h2><label for="email">登録メールアドレス</label><input id="email" type="email" autocomplete="username" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">ログイン</button></form>
<section id="account" hidden><p id="accountName"></p><button id="linkButton" hidden>このアカウントとLINEを連携する</button><div id="guide" hidden><p>スポドラ公式LINEを友だち追加し、トークで<strong>「連携」</strong>と送ってください。届いたリンクから設定できます。</p><a href="https://line.me/R/ti/p/%40085albth" rel="noreferrer">スポドラ公式LINEを開く</a></div><section id="notificationSettings" hidden><h2>LINE通知の設定</h2><p>休会中は新しい求人の通知を停止します。確定した仕事の前日通知は届きます。</p><label><input type="checkbox" id="notify_job_match" style="width:auto"> 希望条件に合う新しい求人</label><label><input type="checkbox" id="notify_application_result" style="width:auto"> 応募の選考結果</label><label><input type="checkbox" id="notify_work_reminder" style="width:auto"> 勤務前日の案内（18時以降）</label><label><input type="checkbox" id="notify_new_application" style="width:auto"> 企業向け：新しい応募</label><button id="saveNotifications" type="button">通知設定を保存</button><p id="notificationMessage" role="status"></p></section><button id="unlinkButton" class="danger" hidden>LINE連携を解除する</button><button id="switchButton" class="danger">別のスポドラアカウントでログイン</button></section><p><a href="./driver.html">ドライバー画面</a> ／ <a href="./company.html">企業画面</a></p></div></main>
<script>
const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');
const $=id=>document.getElementById(id);let user, configured=false, busy=false;
const parameter=new URLSearchParams(location.search).get('ticket');
if(parameter&&/^[0-9a-f]{64}$/.test(parameter))sessionStorage.setItem('spodora_line_ticket',parameter);
if(location.search)history.replaceState(null,'',location.pathname);
const message=(text,error=false)=>{$('message').textContent=text;$('message').className=error?'error':'';};
async function call(body){const {data,error}=await db.functions.invoke('line-account',{body});if(error){let detail;try{detail=await error.context?.json();}catch{}if(error.context?.status===410){sessionStorage.removeItem('spodora_line_ticket');$('linkButton').hidden=true;$('guide').hidden=false;}throw new Error(detail?.error||'通信できませんでした。ページを開き直して再度お試しください。');}if(data?.error)throw new Error(data.error);return data;}
async function refresh(){if(busy)return;busy=true;$('linkButton').disabled=true;try{user=(await db.auth.getUser()).data.user;$('loginForm').hidden=!!user;$('account').hidden=!user;if(!user){message('スポドラに登録したメールアドレスとパスワードでログインしてください。');return;}$('accountName').textContent='ログイン中：'+(user.email||'登録アカウント');const state=await call({action:'status'});configured=state.configured;await loadNotificationSettings(state.linked&&state.active);$('unlinkButton').hidden=!state.linked;$('linkButton').hidden=(state.linked&&state.active)||!sessionStorage.getItem('spodora_line_ticket')||!configured;$('guide').hidden=(state.linked&&state.active)||!configured||!$('linkButton').hidden;if(state.linked&&state.active){sessionStorage.removeItem('spodora_line_ticket');message(state.active?'LINE連携済みです。':'LINE連携済みですが、友だち追加が解除されています。公式LINEを友だち追加してから連携し直してください。');}else message(state.linked?'公式LINEを友だち追加し、トークで「連携」と送って連携し直してください。':configured?'LINEはまだ連携されていません。':'LINE連携は準備中です。設定完了後にご利用いただけます。');}catch(e){message(e.message,true);$('linkButton').hidden=true;}finally{busy=false;$('linkButton').disabled=false;}}
const notificationKinds=['job_match','application_result','work_reminder','new_application'];
async function loadNotificationSettings(active){
 $('notificationSettings').hidden=!active;if(!active)return;
 const {data,error}=await db.from('line_notification_preferences').select('job_match,application_result,work_reminder,new_application').eq('user_id',user.id).maybeSingle();
 if(error){$('notificationMessage').textContent='通知設定を読み込めませんでした。';return;}
 notificationKinds.forEach(k=>$('notify_'+k).checked=data?.[k]!==false);
}
$('saveNotifications').onclick=async()=>{
 const button=$('saveNotifications');button.disabled=true;
 try{if(!user)throw new Error();const payload={user_id:user.id};notificationKinds.forEach(k=>payload[k]=$('notify_'+k).checked);
 const {error}=await db.from('line_notification_preferences').upsert(payload);
 if(error)throw error;$('notificationMessage').textContent='通知設定を保存しました。';
 }catch{$('notificationMessage').textContent='保存できませんでした。もう一度お試しください。';}finally{button.disabled=false;}
};
$('loginForm').addEventListener('submit',async event=>{event.preventDefault();$('loginButton').disabled=true;try{const result=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(result.error)throw new Error('ログインできませんでした。登録情報を確認してください。');await refresh();}catch(e){message(e.message,true);}finally{$('loginButton').disabled=false;}});
$('linkButton').onclick=async()=>{if(busy||!configured)return;busy=true;$('linkButton').disabled=true;try{const result=await call({action:'begin',ticket:sessionStorage.getItem('spodora_line_ticket')});const url=new URL(result.url);if(url.origin!=='https://access.line.me'||url.pathname!=='/dialog/bot/accountLink')throw new Error('連携先を確認できませんでした。');sessionStorage.removeItem('spodora_line_ticket');location.assign(url.href);}catch(e){message(e.message,true);busy=false;$('linkButton').disabled=false;}};
$('unlinkButton').onclick=async()=>{if(busy||!confirm('LINEとの連携を解除しますか？スポドラの登録情報は残ります。'))return;busy=true;try{await call({action:'unlink'});sessionStorage.removeItem('spodora_line_ticket');busy=false;await refresh();}catch(e){message(e.message,true);}finally{busy=false;}};
$('switchButton').onclick=async()=>{await db.auth.signOut();await refresh();};window.addEventListener('pageshow',event=>{if(event.persisted)refresh();});refresh();
</script></body></html>
