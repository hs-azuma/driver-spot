<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜企業情報変更</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}main{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}.note{color:#68758b;line-height:1.6}label{display:block;font-weight:bold;margin:16px 0 6px}input{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;font-size:16px}.btn{width:100%;margin-top:22px;border:0;border-radius:10px;padding:15px;font-weight:bold;font-size:17px;background:#1769d2;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#1769d2}.msg{margin-top:14px;font-weight:bold}.spodora-brand{display:block;width:300px;max-width:72vw}.spodora-brand img{display:block;width:100%;height:auto}@media(max-width:650px){.spodora-brand{width:240px}}.location-choice{border:1px solid #dbe3ef;border-radius:10px;padding:12px 16px;margin:18px 0;min-width:0}.location-choice legend{font-weight:bold}.pref-actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pref-actions button{border:1px solid #1769d2;border-radius:8px;background:#fff;color:#1769d2;padding:8px 12px;font-size:14px;cursor:pointer}.pref-actions button:focus-visible{outline:3px solid #8abaff;outline-offset:2px}</style></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>企業アカウント情報</p></header><main><div class="card"><h2>企業情報変更</h2><p class="note">現在の登録内容を変更できます。</p><label>会社名</label><input id="name"><label>担当者名</label><input id="contact"><label>電話番号</label><input id="phone" type="tel"><fieldset class="location-choice"><legend>メールアドレス</legend><label for="currentEmail">現在の登録メールアドレス</label><input id="currentEmail" type="email" readonly autocomplete="off"><p class="note">ログインとメール通知に使うアドレスです。変更は下のボタンから行ってください。</p><label for="newEmail">新しいメールアドレス</label><input id="newEmail" type="email" autocomplete="email" placeholder="新しいメールアドレスを入力"><div class="pref-actions"><button id="emailChangeBtn" type="button" disabled onclick="changeEmail()">確認メールを送信</button></div><p class="note">届いた確認メールのリンクを開くと変更が完了します。現在のアドレスにも確認メールが届いた場合は、両方のリンクを開いてください。</p><p id="emailMsg" class="msg" role="status" aria-live="polite"></p></fieldset><label>会社住所</label><input id="address"><button id="save" class="btn" onclick="saveProfile()">変更を保存</button><div id="msg" class="msg"></div><a class="back" href="./company.html">企業マイページへ戻る</a></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=x=>document.getElementById(x);let user,company;async function syncCompanyEmail(){if(!user?.email||company.email===user.email)return;const r=await db.from('companies').update({email:user.email}).eq('user_id',user.id);if(r.error)throw r.error;company.email=user.email;}function fillEmailSettings(account){$('currentEmail').value=account.email||'';if(account.new_email&&account.new_email!==account.email){$('newEmail').value=account.new_email;$('emailMsg').style.color='#68758b';$('emailMsg').textContent='メールアドレスの変更は確認待ちです。届いた確認メールのリンクを開いてください。'}$('emailChangeBtn').disabled=false}
async function changeEmail(){if(!user||$('emailChangeBtn').disabled)return;const input=$('newEmail'),next=input.value.trim(),b=$('emailChangeBtn'),m=$('emailMsg');input.value=next;m.style.color='#c62828';if(!next||!input.checkValidity()){m.textContent='正しいメールアドレスを入力してください。';return}b.disabled=true;b.textContent='送信中…';try{const fresh=await db.auth.getUser();if(fresh.error||!fresh.data.user){m.textContent='ログインし直してから、もう一度お試しください。';return}user=fresh.data.user;$('currentEmail').value=user.email||'';if(next.toLowerCase()===(user.email||'').toLowerCase()){m.textContent='現在とは異なるメールアドレスを入力してください。';return}const r=await db.auth.updateUser({email:next},{emailRedirectTo:new URL('./company.html',location.href).href});if(r.error)throw r.error;if(r.data.user)user=r.data.user;if((user.email||'').toLowerCase()===next.toLowerCase()){$('currentEmail').value=user.email;$('newEmail').value='';await syncCompanyEmail();m.style.color='#16803c';m.textContent='メールアドレスを変更しました。次回から新しいアドレスでログインしてください。'}else{m.style.color='#16803c';m.textContent='変更の確認メールを送信しました。届いたメールのリンクを開いてください。現在のアドレスにも届いた場合は両方で確認してください。確認が終わるまでは現在のアドレスを使います。'}}catch(err){m.textContent=err?.status===429||['over_email_send_rate_limit','over_request_rate_limit'].includes(err?.code)?'短時間に送信が続いています。少し待ってからもう一度お試しください。':['email_exists','email_address_not_authorized'].includes(err?.code)?'このメールアドレスへの変更はできません。別のアドレスをお試しください。':'確認メールを送信できませんでした。入力内容を確認して、もう一度お試しください。';}finally{b.disabled=false;b.textContent='確認メールを送信'}}
async function init(){user=(await db.auth.getUser()).data.user;if(!user){location.href='./company-register.html';return}let r=await db.from('companies').select('*').eq('user_id',user.id).maybeSingle();company=r.data;if(!company){location.href='./company-register.html';return}$('name').value=company.company_name||'';$('contact').value=company.contact_name||'';$('phone').value=company.phone||'';fillEmailSettings(user);try{await syncCompanyEmail()}catch{$('emailMsg').style.color='#c62828';$('emailMsg').textContent='登録メールアドレスの同期に失敗しました。ページを開き直してください。'}$('address').value=company.address||''}async function saveProfile(){let name=$('name').value.trim();if(!name){$('msg').style.color='#c62828';$('msg').textContent='会社名を入力してください。';return}let b=$('save');b.disabled=true;b.textContent='保存中…';let r=await db.from('companies').update({company_name:name,contact_name:$('contact').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim()}).eq('user_id',user.id);if(r.error){$('msg').style.color='#c62828';$('msg').textContent=r.error.message}else{$('msg').style.color='#16803c';$('msg').textContent='企業情報を変更しました。'}b.disabled=false;b.textContent='変更を保存'}init();</script></body></html>
