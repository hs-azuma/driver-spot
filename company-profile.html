<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜企業情報変更</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}main{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}.note{color:#68758b;line-height:1.6}label{display:block;font-weight:bold;margin:16px 0 6px}input{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;font-size:16px}.btn{width:100%;margin-top:22px;border:0;border-radius:10px;padding:15px;font-weight:bold;font-size:17px;background:#1769d2;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#1769d2}.msg{margin-top:14px;font-weight:bold}.spodora-brand{display:block;width:300px;max-width:72vw}.spodora-brand img{display:block;width:100%;height:auto}@media(max-width:650px){.spodora-brand{width:240px}}</style></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>企業アカウント情報</p></header><main><div class="card"><h2>企業情報変更</h2><p class="note">現在の登録内容を変更できます。</p><label>会社名</label><input id="name"><label>担当者名</label><input id="contact"><label>電話番号</label><input id="phone" type="tel"><label>メールアドレス</label><input id="email" disabled><label>会社住所</label><input id="address"><button id="save" class="btn" onclick="saveProfile()">変更を保存</button><div id="msg" class="msg"></div><a class="back" href="./company.html">企業マイページへ戻る</a></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=x=>document.getElementById(x);let user,company;async function init(){user=(await db.auth.getUser()).data.user;if(!user){location.href='./company-register.html';return}let r=await db.from('companies').select('*').eq('user_id',user.id).maybeSingle();company=r.data;if(!company){location.href='./company-register.html';return}$('name').value=company.company_name||'';$('contact').value=company.contact_name||'';$('phone').value=company.phone||'';$('email').value=company.email||user.email||'';$('address').value=company.address||''}async function saveProfile(){let name=$('name').value.trim();if(!name){$('msg').style.color='#c62828';$('msg').textContent='会社名を入力してください。';return}let b=$('save');b.disabled=true;b.textContent='保存中…';let r=await db.from('companies').update({company_name:name,contact_name:$('contact').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim()}).eq('user_id',user.id);if(r.error){$('msg').style.color='#c62828';$('msg').textContent=r.error.message}else{$('msg').style.color='#16803c';$('msg').textContent='企業情報を変更しました。'}b.disabled=false;b.textContent='変更を保存'}init();</script></body></html>
