<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜新規登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}header a{color:#1769d2;text-decoration:none}main{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}h2{margin-top:0}label{display:block;font-weight:bold;margin:16px 0 6px}input{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;font-size:16px}.password-row{display:flex;gap:8px}.password-row input{flex:1}.btn{border:1px solid #1769d2;border-radius:10px;padding:13px 18px;font-weight:bold;font-size:16px;cursor:pointer}.primary{width:100%;margin-top:22px;background:#1769d2;color:#fff}.secondary{background:#fff;color:#1769d2;white-space:nowrap}.note{color:#68758b;line-height:1.6}.login{text-align:center;margin-top:20px}.login a{color:#1769d2;font-weight:bold}.msg{margin-top:14px;font-weight:bold}.error{color:#c62828}.ok{color:#16803c}</style></head><body><header><h1><a href="./driver.html">スポドラ</a></h1><p>ドライバー新規登録</p></header><main><div class="card"><h2>アカウントを新規作成</h2><p class="note">まずメールアドレスとパスワードを登録します。登録後、プロフィールで免許・経験・希望エリアなどを入力できます。</p><label>メールアドレス</label><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="example@example.com"><label>パスワード</label><div class="password-row"><input id="password" type="password" autocomplete="new-password" placeholder="6文字以上"><button class="btn secondary" type="button" onclick="togglePw()">表示</button></div><label>パスワード（確認）</label><input id="password2" type="password" autocomplete="new-password" placeholder="もう一度入力"><button id="signupBtn" class="btn primary" type="button" onclick="signup()">新規登録する</button><div id="msg" class="msg"></div><div class="login">すでに登録済みの方は <a href="./driver.html?login=1">ログイン</a></div></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=id=>document.getElementById(id);function togglePw(){let p=$('password');p.type=p.type==='password'?'text':'password'}async function signup(){const email=$('email').value.trim(),pw=$('password').value,pw2=$('password2').value,msg=$('msg'),btn=$('signupBtn');msg.className='msg';msg.textContent='';if(!email||!$('email').checkValidity()){msg.classList.add('error');msg.textContent='正しいメールアドレスを入力してください。';return}if(pw.length<6){msg.classList.add('error');msg.textContent='パスワードは6文字以上で入力してください。';return}if(pw!==pw2){msg.classList.add('error');msg.textContent='確認用パスワードが一致しません。';return}btn.disabled=true;btn.textContent='登録中…';const r=await db.auth.signUp({email,password:pw,options:{emailRedirectTo:new URL('./driver.html',location.href).href}});if(r.error){msg.classList.add('error');msg.textContent=r.error.message;btn.disabled=false;btn.textContent='新規登録する';return}if(r.data.session){location.href='./driver.html?profile=1'}else{msg.classList.add('ok');msg.textContent='確認メールを送信しました。メール内のリンクを開いて登録を完了してください。';btn.disabled=false;btn.textContent='新規登録する'}}</script></body></html>
