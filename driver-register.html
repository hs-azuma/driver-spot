<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜新規登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./areas.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}main{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}label{display:block;font-weight:bold;margin:16px 0 6px}input,select{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;font-size:16px;background:#fff}.password-row{display:flex;gap:8px}.password-row input{flex:1}.btn{border:1px solid #1769d2;border-radius:10px;padding:13px 18px;font-weight:bold;font-size:16px}.primary{width:100%;margin-top:22px;background:#1769d2;color:#fff}.secondary{background:#fff;color:#1769d2}.note{color:#68758b;line-height:1.6}.msg{margin-top:14px;font-weight:bold}.error{color:#c62828}.ok{color:#16803c}.spodora-brand{display:block;width:300px;max-width:72vw}.spodora-brand img{width:100%;height:auto}</style></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>ドライバー新規登録</p></header><main><div class="card"><h2>新規登録</h2><p class="note">アカウントとドライバープロフィールをまとめて登録します。</p><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><div class="password-row"><input id="password" type="password" autocomplete="new-password" placeholder="6文字以上"><button class="btn secondary" type="button" onclick="togglePw()">表示</button></div><label>パスワード（確認）</label><input id="password2" type="password"><label>氏名</label><input id="name"><label>電話番号</label><input id="phone" type="tel"><label>希望都道府県</label><select id="pref" onchange="fillMunicipalitySelect(document.getElementById('municipality'),this.value)"></select><label>希望市区町村</label><select id="municipality"></select><p class="note">都道府県全体を希望する場合は「○○府全域」などを選択してください。</p><label>マッチした求人のメール通知</label><select id="notify"><option value="true">受け取る</option><option value="false">受け取らない</option></select><label>保有免許</label><select id="license"><option>普通</option><option>準中型</option><option>中型</option><option>大型</option></select><label>ドライバー経験</label><select id="experience"><option>1年未満</option><option>1年以上3年未満</option><option>3年以上5年未満</option><option>5年以上10年未満</option><option>10年以上</option></select><button id="signupBtn" class="btn primary" onclick="signup()">新規登録する</button><div id="msg" class="msg"></div></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=id=>document.getElementById(id);fillPrefectureSelect($('pref'));fillMunicipalitySelect($('municipality'),'');function togglePw(){let p=$('password');p.type=p.type==='password'?'text':'password'}function fail(t){$('msg').className='msg error';$('msg').textContent=t}async function saveProfile(user){let pref=$('pref').value,mun=$('municipality').value;return db.from('drivers').upsert({user_id:user.id,name:$('name').value.trim(),phone:$('phone').value.trim(),preferred_area:mun||pref,preferred_prefecture:pref,preferred_municipality:mun,match_email_enabled:$('notify').value==='true',license_type:$('license').value,experience:$('experience').value},{onConflict:'user_id'})}async function signup(){let email=$('email').value.trim(),pw=$('password').value,pw2=$('password2').value,btn=$('signupBtn');if(!email||!$('email').checkValidity())return fail('正しいメールアドレスを入力してください。');if(pw.length<6)return fail('パスワードは6文字以上で入力してください。');if(pw!==pw2)return fail('確認用パスワードが一致しません。');if(!$('name').value.trim()||!$('phone').value.trim())return fail('氏名・電話番号を入力してください。');if(!$('pref').value||!$('municipality').value)return fail('希望エリアを選択してください。');btn.disabled=true;btn.textContent='登録中…';let r=await db.auth.signUp({email,password:pw,options:{emailRedirectTo:new URL('./driver.html',location.href).href,data:{driver_name:$('name').value.trim(),driver_phone:$('phone').value.trim(),driver_area:$('municipality').value,driver_prefecture:$('pref').value,driver_municipality:$('municipality').value,match_email_enabled:$('notify').value==='true',driver_license:$('license').value,driver_experience:$('experience').value}}});if(r.error){btn.disabled=false;btn.textContent='新規登録する';return fail(r.error.message)}if(r.data.session&&r.data.user){let p=await saveProfile(r.data.user);if(p.error){btn.disabled=false;btn.textContent='新規登録する';return fail('プロフィール保存に失敗しました：'+p.error.message)}location.href='./driver.html';return}$('msg').className='msg ok';$('msg').textContent='確認メールを送信しました。メール内のリンクを開くと登録が完了します。';btn.disabled=false;btn.textContent='新規登録する'}</script></body></html>
