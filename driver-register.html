<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜新規登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}header a{color:#1769d2;text-decoration:none}main{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:24px}h2{margin-top:0}label{display:block;font-weight:bold;margin:16px 0 6px}input,select{width:100%;padding:14px;border:1px solid #cbd7e8;border-radius:10px;font-size:16px;background:#fff}.password-row{display:flex;gap:8px}.password-row input{flex:1}.btn{border:1px solid #1769d2;border-radius:10px;padding:13px 18px;font-weight:bold;font-size:16px;cursor:pointer}.primary{width:100%;margin-top:22px;background:#1769d2;color:#fff}.secondary{background:#fff;color:#1769d2;white-space:nowrap}.note{color:#68758b;line-height:1.6}.login{text-align:center;margin-top:20px}.login a{color:#1769d2;font-weight:bold}.msg{margin-top:14px;font-weight:bold}.error{color:#c62828}.ok{color:#16803c}</style><style id="spodora-brand-style">
.spodora-brand{display:block;width:300px;max-width:72vw;text-decoration:none;margin:0 0 12px}
.spodora-brand img{display:block;width:100%;height:auto}
@media(max-width:650px){.spodora-brand{width:240px;max-width:72vw}}
</style></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><h1><a href="./driver.html">スポドラ</a></h1><p>ドライバー新規登録</p></header><main><div class="card"><h2>新規登録</h2><p class="note">アカウントとドライバープロフィールをまとめて登録します。</p><label>メールアドレス</label><input id="email" type="email" inputmode="email" autocomplete="username" placeholder="example@example.com"><label>パスワード</label><div class="password-row"><input id="password" type="password" autocomplete="new-password" placeholder="6文字以上"><button class="btn secondary" type="button" onclick="togglePw()">表示</button></div><label>パスワード（確認）</label><input id="password2" type="password" autocomplete="new-password" placeholder="もう一度入力"><label>氏名</label><input id="name" autocomplete="name" placeholder="氏名"><label>電話番号</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="090-1234-5678"><label>希望エリア</label><input id="area" autocomplete="address-level1" placeholder="例：大阪府・奈良県"><label>保有免許</label><select id="license"><option value="普通">普通</option><option value="準中型">準中型</option><option value="中型">中型</option><option value="大型">大型</option></select><label>ドライバー経験</label><select id="experience"><option value="1年未満">1年未満</option><option value="1年以上3年未満">1年以上3年未満</option><option value="3年以上5年未満">3年以上5年未満</option><option value="5年以上10年未満">5年以上10年未満</option><option value="10年以上">10年以上</option></select><button id="signupBtn" class="btn primary" type="button" onclick="signup()">新規登録する</button><div id="msg" class="msg"></div><div class="login">すでに登録済みの方は <a href="./driver.html?login=1">ログイン</a></div></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const $=id=>document.getElementById(id);function togglePw(){let p=$('password');p.type=p.type==='password'?'text':'password'}async function saveProfile(user){const data={user_id:user.id,name:$('name').value.trim(),phone:$('phone').value.trim(),preferred_area:$('area').value.trim(),license_type:$('license').value,experience:$('experience').value};return await db.from('drivers').upsert(data,{onConflict:'user_id'})}async function signup(){const email=$('email').value.trim(),pw=$('password').value,pw2=$('password2').value,msg=$('msg'),btn=$('signupBtn');msg.className='msg';msg.textContent='';if(!email||!$('email').checkValidity())return fail('正しいメールアドレスを入力してください。');if(pw.length<6)return fail('パスワードは6文字以上で入力してください。');if(pw!==pw2)return fail('確認用パスワードが一致しません。');if(!$('name').value.trim())return fail('氏名を入力してください。');if(!$('phone').value.trim())return fail('電話番号を入力してください。');if(!$('area').value.trim())return fail('希望エリアを入力してください。');btn.disabled=true;btn.textContent='登録中…';const r=await db.auth.signUp({email,password:pw,options:{emailRedirectTo:new URL('./driver.html',location.href).href,data:{driver_name:$('name').value.trim(),driver_phone:$('phone').value.trim(),driver_area:$('area').value.trim(),driver_license:$('license').value,driver_experience:$('experience').value}}});if(r.error){btn.disabled=false;btn.textContent='新規登録する';return fail(r.error.message)}if(r.data.session&&r.data.user){const p=await saveProfile(r.data.user);if(p.error){btn.disabled=false;btn.textContent='新規登録する';return fail('アカウントは作成されましたが、プロフィール保存に失敗しました：'+p.error.message)}location.href='./driver.html';return}msg.classList.add('ok');msg.textContent='確認メールを送信しました。メール内のリンクを開くと登録が完了します。プロフィール情報も登録内容として保持されます。';btn.disabled=false;btn.textContent='新規登録する'}function fail(t){let m=$('msg');m.className='msg error';m.textContent=t}</script></body></html>
