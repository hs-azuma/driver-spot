<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 企業の出退勤QR</title><link rel="stylesheet" href="./assets/attendance-qr.css?v=20261005b"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="./assets/attendance-qr.js?v=20261005b"></script><style id="logo-surface-match">body{background:#fff}</style></head><body><header><a href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a></header><main><div class="card qr"><h1>出退勤QRコード</h1><h2 id="company"></h2><div id="code"></div><p>ドライバーの携帯でこのQRを読み取り、<br>勤務を確認して「出勤」または「退勤」を押してください。</p><div class="no-print"><div class="actions"><button id="copy" disabled onclick="copyQR()">QR画像をコピー</button><button id="save" disabled onclick="saveQR()">画像を保存</button><button id="print" disabled onclick="window.print()">印刷する</button></div><p class="note">保存・コピーしたQRは繰り返し使えます。iPhone・iPadでは、保存した画像を「ファイル」から開けます。</p><div id="msg" role="status" aria-live="polite">読み込み中…</div><div class="actions"><button id="rotate" class="danger" disabled onclick="regenerate()">QRコードを変更する</button><a class="button" href="./company.html">企業マイページへ戻る</a></div><p class="note">変更すると、以前に保存・印刷したQRは使えなくなります。変更後は掲示するQRも差し替えてください。</p></div></div></main><script>
const {db,esc}=SpodoraQR,$=id=>document.getElementById(id);let imageBlob=null;
async function showQR(regenerate=false){
 for(const id of ['copy','save','print','rotate'])$(id).disabled=true;
 try{
 const r=await db.rpc('attendance_company_qr',{p_regenerate:regenerate});if(r.error)throw r.error;
 $('company').textContent=r.data.company_name;$('code').innerHTML='';
 new QRCode($('code'),{text:new URL(SpodoraQR.attendanceURL(r.data.token),location.href).href,width:320,height:320,correctLevel:QRCode.CorrectLevel.M});
 const source=$('code').querySelector('canvas'),canvas=document.createElement('canvas');canvas.width=canvas.height=400;
 const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,400,400);ctx.drawImage(source,40,40,320,320);
 imageBlob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!imageBlob)throw new Error('QR画像を作成できませんでした');
 $('code').innerHTML='';const img=document.createElement('img');img.width=img.height=320;img.alt='企業の出退勤QRコード';img.src=canvas.toDataURL('image/png');$('code').append(img);
 for(const id of ['copy','save','print','rotate'])$(id).disabled=false;
 $('msg').className='info';$('msg').textContent=regenerate?'QRを変更しました。以前のQRは無効になりました。':'このQRは変更するまで使えます。';
 }catch(err){$('msg').className='error';$('msg').textContent=err.message||'QRを表示できませんでした。';$('rotate').disabled=false}
}
function saveQR(){if(!imageBlob)return;const url=URL.createObjectURL(imageBlob),a=document.createElement('a');a.href=url;a.download='spodora-attendance-qr.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function copyQR(){if(!imageBlob)return;try{await navigator.clipboard.write([new ClipboardItem({'image/png':imageBlob})]);$('msg').textContent='QR画像をコピーしました。'}catch{$('msg').textContent='この端末では画像をコピーできません。「画像を保存」または「印刷する」を使ってください。'}}
async function regenerate(){if(!confirm('QRコードを変更しますか？以前に保存・印刷したQRは使えなくなります。'))return;await showQR(true)}
showQR();
</script></body></html>
