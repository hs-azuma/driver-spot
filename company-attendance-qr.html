<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 企業出退勤QR</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}header,main{max-width:760px;margin:auto;padding:22px}.brand{color:#1769d2;text-decoration:none}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:24px;margin:18px 0;text-align:center}button{padding:12px 18px;border-radius:10px;border:1px solid #1769d2;background:#fff;color:#1769d2;font-weight:bold}#qr{display:flex;justify-content:center;margin:22px auto}.note{line-height:1.8;color:#526070}.err{color:#c62828}</style><style id="spodora-brand-style">
.spodora-brand{display:block;width:300px;max-width:72vw;text-decoration:none;margin:0 0 12px}
.spodora-brand img{display:block;width:100%;height:auto}
@media(max-width:650px){.spodora-brand{width:240px;max-width:72vw}}
</style></head><body><header><h1><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a></h1><p>企業共通 出退勤QR</p></header><main><div class="card"><h2 id="title">確認中...</h2><div id="qr"></div><div id="msg" class="note"></div><p><button onclick="location.href='./company.html'">企業マイページへ戻る</button></p></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');const e=x=>String(x??'').replaceAll('<','&lt;');async function run(){let u=(await db.auth.getUser()).data.user;if(!u){title.textContent='企業ログインが必要です';return}let r=await db.from('companies').select('company_name,attendance_token').eq('user_id',u.id).maybeSingle();if(r.error||!r.data){title.textContent='企業情報を確認できません';msg.innerHTML='<span class="err">'+e(r.error?.message||'企業登録がありません')+'</span>';return}title.textContent=r.data.company_name+' 出退勤QR';let url=new URL('./attendance.html',location.href);url.searchParams.set('company',r.data.attendance_token);new QRCode(document.getElementById('qr'),{text:url.toString(),width:300,height:300,correctLevel:QRCode.CorrectLevel.M});msg.innerHTML='このQRは企業共通です。事務所・受付・車庫などに表示して使えます。<br>勤務確定したドライバー本人がログインしたスマホで読み取ります。<br><b>1回目＝出勤、2回目＝退勤・勤務完了</b>です。'}run();</script></body></html>
