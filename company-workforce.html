<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 勤怠管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}main{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{padding:11px 15px;border:1px solid #1769d2;border-radius:9px;background:#fff;color:#1769d2;font-weight:bold}.badge{padding:5px 9px;border-radius:18px;background:#edf4ff}.ok{background:#e9f8ef;color:#16803c}.warn{background:#fff4dc;color:#8a5b00}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #e4e9f1;white-space:normal;overflow-wrap:anywhere;vertical-align:top}th:nth-child(1){width:12%}th:nth-child(2){width:9%}th:nth-child(3){width:10%}th:nth-child(4),th:nth-child(5){width:8%}th:nth-child(6){width:16%}th:nth-child(7){width:10%}th:nth-child(8){width:20%}th:nth-child(9){width:7%}td .badge{display:inline-block;white-space:normal}@media(max-width:800px){main{padding:12px}.scroll{overflow:hidden}table,tbody,tr,td{display:block;width:100%}thead{display:none}tbody tr{padding:10px 0;border-bottom:1px solid #dbe3ef}tbody tr:last-child{border-bottom:0}td{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:7px 0;border:0}td::before{content:attr(data-label);font-weight:bold;color:#68758b}td.attendance-total{display:block;padding-top:12px;padding-bottom:12px}td.attendance-total::before{display:block;margin-bottom:8px}.attendance-value{min-width:0;width:100%}td[colspan]{display:block}td[colspan]::before{content:none}}</style><style id="spodora-brand-style">
.spodora-brand{display:block;width:300px;max-width:72vw;text-decoration:none;margin:0 0 12px}
.spodora-brand img{display:block;width:100%;height:auto}
@media(max-width:650px){.spodora-brand{width:240px;max-width:72vw}}
</style><script src="./assets/attendance-summary.js?v=20261004e"></script><script src="./assets/attendance-review.js?v=20261004a"></script><script src="./assets/attendance-export.js?v=20261004a"></script></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a></header><main><div class="card row"><h1 style="margin-right:auto">勤怠管理</h1><button onclick="location.href='./company.html'">企業マイページへ戻る</button><button onclick="location.href='./company-attendance.html'">QR打刻端末</button></div><div class="card"><div class="row"><button onclick="setFilter('today')">今日</button><button onclick="setFilter('all')">すべて</button><span id="summary"></span><button id="exportAttendance" onclick="exportAttendance()" disabled>勤怠CSVを出力</button></div><p style="font-size:13px;color:#68758b">「今日」「すべて」で表示している勤怠を出力します。承認済みの実休憩・実働・基本報酬を含みます。</p></div><section class="card" id="attendanceRequests"></section><div class="card scroll"><table><thead><tr><th>勤務日</th><th>ドライバー</th><th>状態</th><th>実出勤</th><th>実退勤</th><th>仕事</th><th>予定</th><th>実働・報酬目安</th><th>方式</th></tr></thead><tbody id="body"><tr><td colspan="9">読み込み中...</td></tr></tbody></table></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let company,rows=[],filter='today';const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;'),tm=x=>x?new Date(x).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'}):'―',wd=x=>{if(!x)return'';let a=String(x).split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]);return x+'（'+['日','月','火','水','木','金','土'][d.getDay()]+'）'};function visibleAttendance(){const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});return filter==='today'?rows.filter(a=>a.jobs?.work_date===today):rows}function exportAttendance(){SpodoraAttendanceExport.download(visibleAttendance(),filter)}function setFilter(x){filter=x;render()}function render(){$('exportAttendance').disabled=visibleAttendance().length===0;$('attendanceRequests').innerHTML=SpodoraReview.companyHtml();let today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}),r=filter==='today'?rows.filter(x=>x.jobs?.work_date===today):rows;let present=r.filter(x=>x.checked_in_at&&!x.checked_out_at).length,done=r.filter(x=>x.checked_out_at).length;$('summary').innerHTML=`<span class="badge">${r.length}件</span> <span class="badge ok">出勤中 ${present}</span> <span class="badge ok">退勤済 ${done}</span>`;$('body').innerHTML=r.map(a=>{let j=a.jobs||{},d=a.drivers||{},calc=(a.rounded_check_in_at||a.rounded_check_out_at)?tm(a.rounded_check_in_at)+'〜'+tm(a.rounded_check_out_at):'―',state=a.checked_out_at?'退勤済':a.checked_in_at?'出勤中':'未出勤';return `<tr><td data-label="勤務日">${e(wd(j.work_date))}</td><td data-label="ドライバー">${e(d.name)}</td><td data-label="状態"><span class="badge ${a.checked_in_at?'ok':''}">${e(state)}</span></td><td data-label="実出勤">${tm(a.checked_in_at)}</td><td data-label="実退勤">${tm(a.checked_out_at)}</td><td data-label="仕事">${e(j.job_description)}</td><td data-label="予定">${e((j.start_time||'').slice(0,5))}〜${e((j.end_time||'').slice(0,5))}</td><td class="attendance-total" data-label="実働・報酬目安"><div class="attendance-value"><div style="font-size:12px;color:#68758b">丸め後（参考） ${calc}${a.checked_out_at&&a.approved_work_minutes!=null?' ／ '+SpodoraAttendance.duration(Number(a.approved_work_minutes)*60):''}</div>${SpodoraAttendance.html(a,j,true)}</div></td><td data-label="方式">${a.attendance_method==='manual'?'<span class="badge warn">手入力</span>':a.checked_in_at?'<span class="badge">QR</span>':'―'}</td></tr>`}).join('')||'<tr><td colspan="9">対象の勤務はありません。</td></tr>'}async function init(){let u=(await db.auth.getUser()).data.user;if(!u)return location.href='./company-register.html';company=(await db.from('companies').select('id').eq('user_id',u.id).single()).data;if(!company)return;let jobs=(await db.from('jobs').select('id').eq('company_id',company.id)).data||[],ids=jobs.map(x=>x.id);if(!ids.length){rows=[];await SpodoraReview.load(db,rows,init);return render()}let r=await db.from('applications').select('id,status,pay_guarantee_snapshot,checked_in_at,checked_out_at,rounded_check_in_at,rounded_check_out_at,attendance_method,drivers(name),jobs(job_description,work_date,start_time,end_time,break_minutes,pay_type,pay_amount,pay_guarantee,transportation_fee,transportation_fee_type)').in('job_id',ids).in('status',['採用','勤務確定','勤務完了']).order('checked_in_at',{ascending:false});if(r.error){$('summary').textContent='勤怠を取得できませんでした。ページを開き直してください。';return}try{await SpodoraReview.load(db,r.data||[],init)}catch(err){$('summary').textContent='勤怠申請を取得できませんでした。ページを開き直してください。';return}rows=(r.data||[]).sort((a,b)=>String(a.jobs?.work_date||'').localeCompare(String(b.jobs?.work_date||''))||String(a.jobs?.start_time||'').localeCompare(String(b.jobs?.start_time||'')));render()}setInterval(()=>{if(!document.hidden&&company)init()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&company)init()});init();</script></body></html>
