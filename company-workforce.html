<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 勤怠管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}main{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{padding:11px 15px;border:1px solid #1769d2;border-radius:9px;background:#fff;color:#1769d2;font-weight:bold}.badge{padding:5px 9px;border-radius:18px;background:#edf4ff}.ok{background:#e9f8ef;color:#16803c}.warn{background:#fff4dc;color:#8a5b00}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e4e9f1;white-space:nowrap}@media(max-width:800px){.scroll{overflow:auto}}</style><style id="spodora-brand-style">
.spodora-brand{display:block;width:300px;max-width:72vw;text-decoration:none;margin:0 0 12px}
.spodora-brand img{display:block;width:100%;height:auto}
@media(max-width:650px){.spodora-brand{width:240px;max-width:72vw}}
</style></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a></header><main><div class="card row"><h1 style="margin-right:auto">勤怠管理</h1><button onclick="location.href='./company.html'">企業マイページへ戻る</button><button onclick="location.href='./company-attendance.html'">QR打刻端末</button></div><div class="card"><div class="row"><button onclick="setFilter('today')">今日</button><button onclick="setFilter('all')">すべて</button><span id="summary"></span></div></div><div class="card scroll"><table><thead><tr><th>勤務日</th><th>ドライバー</th><th>仕事</th><th>予定</th><th>実出勤</th><th>実退勤</th><th>計算上</th><th>状態</th><th>方式</th></tr></thead><tbody id="body"><tr><td colspan="9">読み込み中...</td></tr></tbody></table></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let company,rows=[],filter='today';const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;'),tm=x=>x?new Date(x).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'―';function setFilter(x){filter=x;render()}function render(){let today=new Date().toLocaleDateString('sv-SE'),r=filter==='today'?rows.filter(x=>x.jobs?.work_date===today):rows;let present=r.filter(x=>x.checked_in_at&&!x.checked_out_at).length,done=r.filter(x=>x.checked_out_at).length;$('summary').innerHTML=`<span class="badge">${r.length}件</span> <span class="badge ok">出勤中 ${present}</span> <span class="badge ok">退勤済 ${done}</span>`;$('body').innerHTML=r.map(a=>{let j=a.jobs||{},d=a.drivers||{},calc=(a.rounded_check_in_at||a.rounded_check_out_at)?tm(a.rounded_check_in_at)+'〜'+tm(a.rounded_check_out_at):'―',state=a.checked_out_at?'勤務完了':a.checked_in_at?'出勤中':a.status;return `<tr><td>${e(j.work_date)}</td><td>${e(d.name)}</td><td>${e(j.job_description)}</td><td>${e((j.start_time||'').slice(0,5))}〜${e((j.end_time||'').slice(0,5))}</td><td>${tm(a.checked_in_at)}</td><td>${tm(a.checked_out_at)}</td><td>${calc}</td><td><span class="badge ${a.checked_in_at?'ok':''}">${e(state)}</span></td><td>${a.attendance_method==='manual'?'<span class="badge warn">手入力</span>':a.checked_in_at?'<span class="badge">QR</span>':'―'}</td></tr>`}).join('')||'<tr><td colspan="9">対象の勤務はありません。</td></tr>'}async function init(){let u=(await db.auth.getUser()).data.user;if(!u)return location.href='./company-register.html';company=(await db.from('companies').select('id').eq('user_id',u.id).single()).data;if(!company)return;let jobs=(await db.from('jobs').select('id').eq('company_id',company.id)).data||[],ids=jobs.map(x=>x.id);if(!ids.length){rows=[];return render()}let r=await db.from('applications').select('id,status,checked_in_at,checked_out_at,rounded_check_in_at,rounded_check_out_at,attendance_method,drivers(name),jobs(job_description,work_date,start_time,end_time)').in('job_id',ids).in('status',['採用','勤務確定','勤務完了']).order('checked_in_at',{ascending:false});rows=r.data||[];render()}init();</script></body></html>
