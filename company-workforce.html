<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 勤怠管理</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}main{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{padding:11px 15px;border:1px solid #1769d2;border-radius:9px;background:#fff;color:#1769d2;font-weight:bold}.badge{padding:5px 9px;border-radius:18px;background:#edf4ff}.ok{background:#e9f8ef;color:#16803c}.warn{background:#fff4dc;color:#8a5b00}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #e4e9f1;white-space:normal;overflow-wrap:anywhere;vertical-align:top}th:nth-child(1){width:12%}th:nth-child(2){width:9%}th:nth-child(3){width:10%}th:nth-child(4),th:nth-child(5){width:8%}th:nth-child(6){width:16%}th:nth-child(7){width:10%}th:nth-child(8){width:20%}th:nth-child(9){width:7%}td .badge{display:inline-block;white-space:normal}@media(max-width:800px){main{padding:12px}.scroll{overflow:hidden}table,tbody,tr,td{display:block;width:100%}thead{display:none}tbody tr{padding:10px 0;border-bottom:1px solid #dbe3ef}tbody tr:last-child{border-bottom:0}td{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:7px 0;border:0}td::before{content:attr(data-label);font-weight:bold;color:#68758b}td.attendance-total{display:block;padding-top:12px;padding-bottom:12px}td.attendance-total::before{display:block;margin-bottom:8px}.attendance-value{min-width:0;width:100%}td[colspan]{display:block}td[colspan]::before{content:none}}</style><style id="spodora-brand-style">
.spodora-brand{display:block;width:300px;max-width:72vw;text-decoration:none;margin:0 0 12px}
.spodora-brand img{display:block;width:100%;height:auto}
@media(max-width:650px){.spodora-brand{width:240px;max-width:72vw}}
</style><script src="./assets/attendance-summary.js?v=20261005a"></script><script src="./assets/attendance-review.js?v=20261005a"></script><script src="./assets/attendance-export.js?v=20261005a"></script></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a></header><main><div class="card row"><h1 style="margin-right:auto">勤怠管理</h1><button onclick="location.href='./company.html'">企業マイページへ戻る</button><button onclick="location.href='./company-attendance-qr.html'">QRコード表示</button></div><div class="card"><div class="row"><button id="filterToday" onclick="setFilter('today')" aria-pressed="true">今日</button><button id="filterAll" onclick="setFilter('all')" aria-pressed="false">すべて</button><label for="attendanceMonth">月別</label><input id="attendanceMonth" type="month" aria-label="勤怠の対象月" onchange="setMonth(this.value)" style="padding:10px;max-width:100%;border:1px solid #cbd5e1;border-radius:8px;font:inherit"><button id="filterMonth" onclick="setFilter('month')" aria-pressed="false">選択した月</button><span id="summary"></span><button id="exportAttendance" onclick="exportAttendance()" disabled>勤務・報酬CSVを出力</button></div><p style="font-size:13px;color:#68758b">勤務日で月別に絞り込めます。表示中の勤怠・実休憩・実働・基本報酬・交通費・確認合計をCSVへ出力します。</p></div><section class="card" id="payTotals" aria-live="polite"></section><section class="card" id="attendanceRequests"></section><div class="card scroll"><table><thead><tr><th>勤務日</th><th>ドライバー</th><th>状態</th><th>実出勤</th><th>実退勤</th><th>仕事</th><th>予定</th><th>実働・報酬確認</th><th>方式</th></tr></thead><tbody id="body"><tr><td colspan="9">読み込み中...</td></tr></tbody></table></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let company,rows=[],filter='today',month=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,7);const $=x=>document.getElementById(x),e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;'),tm=x=>x?new Date(x).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'}):'―',wd=x=>{if(!x)return'';let a=String(x).split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]);return x+'（'+['日','月','火','水','木','金','土'][d.getDay()]+'）'};function visibleAttendance(){return SpodoraAttendanceExport.visible(rows,filter,month)}function exportAttendance(){SpodoraAttendanceExport.download(visibleAttendance(),filter==='month'?month:filter)}function setFilter(x){filter=x;render()}function setMonth(x){month=x;filter='month';render()}function render(){['today','all','month'].forEach(x=>{const b=$('filter'+x[0].toUpperCase()+x.slice(1));b.setAttribute('aria-pressed',String(filter===x));b.style.background=filter===x?'#edf4ff':'#fff'});$('attendanceMonth').value=month;const totals=SpodoraAttendanceExport.totals(visibleAttendance()),yen=x=>x.toLocaleString('ja-JP')+'円';$('payTotals').innerHTML='<h2>勤務・報酬の集計</h2><p>金額確認済み '+totals.confirmed+'件 ／ 未確認・確認待ち '+totals.unconfirmed+'件</p><div class="row"><span>基本報酬 <strong>'+yen(totals.basic)+'</strong></span><span>交通費 <strong>'+yen(totals.fee)+'</strong></span><span>確認合計 <strong>'+yen(totals.total)+'</strong></span></div><p>確認済み実働 '+SpodoraAttendance.duration(totals.worked)+'</p><p style="font-size:13px;color:#68758b">金額確認済みの勤務だけを合計しています。再申請の確認待ちや交通費未確認の勤務は含みません。割増・税等は別途確認してください。振込済みを示すものではありません。</p>';$('exportAttendance').disabled=visibleAttendance().length===0;$('attendanceRequests').innerHTML=SpodoraReview.companyHtml();let r=visibleAttendance();let present=r.filter(x=>x.checked_in_at&&!x.checked_out_at).length,done=r.filter(x=>x.checked_out_at).length;$('summary').innerHTML=`<span class="badge">${r.length}件</span> <span class="badge ok">出勤中 ${present}</span> <span class="badge ok">退勤済 ${done}</span>`;$('body').innerHTML=r.map(a=>{let j=a.jobs||{},d=a.drivers||{},calc=Date.parse(a.rounded_check_out_at)>=Date.parse(a.rounded_check_in_at)?tm(a.rounded_check_in_at)+'〜'+tm(a.rounded_check_out_at):'対象時間なし',state=a.checked_out_at?'退勤済':a.checked_in_at?'出勤中':'未出勤';return `<tr><td data-label="勤務日">${e(wd(j.work_date))}</td><td data-label="ドライバー">${e(d.name)}</td><td data-label="状態"><span class="badge ${a.checked_in_at?'ok':''}">${e(state)}</span><div style="font-size:12px;margin-top:8px">${e(SpodoraAttendance.payment(a,j).label)}</div></td><td data-label="実出勤">${tm(a.checked_in_at)}</td><td data-label="実退勤">${tm(a.checked_out_at)}</td><td data-label="仕事">${e(j.job_description)}</td><td data-label="予定">${e((j.start_time||'').slice(0,5))}〜${e((j.end_time||'').slice(0,5))}</td><td class="attendance-total" data-label="実働・報酬確認"><div class="attendance-value"><div style="font-size:12px;color:#68758b">丸め後（参考） ${calc}${a.checked_out_at&&a.approved_work_minutes!=null?' ／ '+SpodoraAttendance.duration(Number(a.approved_work_minutes)*60):''}</div>${SpodoraAttendance.html(a,j,true)}</div></td><td data-label="方式">${a.attendance_method==='manual'?'<span class="badge warn">手入力</span>':a.checked_in_at?'<span class="badge">QR</span>':'―'}</td></tr>`}).join('')||'<tr><td colspan="9">対象の勤務はありません。</td></tr>'}async function loadPages(build){const all=[];for(let offset=0;;offset+=500){const result=await build().range(offset,offset+499);if(result.error)throw result.error;all.push(...(result.data||[]));if((result.data||[]).length<500)return all}}
async function init(){
 try{
  const auth=await db.auth.getUser();if(auth.error)throw auth.error;const u=auth.data.user;if(!u)return location.href='./company-register.html';
  const account=await db.from('companies').select('id').eq('user_id',u.id).single();if(account.error)throw account.error;company=account.data;if(!company)return;
  const jobs=await loadPages(()=>db.from('jobs').select('id').eq('company_id',company.id).order('id',{ascending:true}));
  const ids=jobs.map(x=>x.id),loaded=[];
  for(let from=0;from<ids.length;from+=200){const batch=ids.slice(from,from+200);loaded.push(...await loadPages(()=>db.from('applications').select('id,status,pay_guarantee_snapshot,checked_in_at,checked_out_at,rounded_check_in_at,rounded_check_out_at,attendance_method,approved_work_minutes,drivers(name),jobs(job_description,work_date,start_time,end_time,break_minutes,pay_type,pay_amount,pay_guarantee,transportation_fee,transportation_fee_type)').in('job_id',batch).in('status',['採用','勤務確定','勤務完了']).order('id',{ascending:true})))}
  await SpodoraReview.load(db,loaded,init);
  rows=loaded.sort((a,b)=>String(a.jobs?.work_date||'').localeCompare(String(b.jobs?.work_date||''))||String(a.jobs?.start_time||'').localeCompare(String(b.jobs?.start_time||'')));render();
 }catch(err){rows=[];$('exportAttendance').disabled=true;$('summary').textContent='勤怠・給与情報を取得できませんでした。ページを開き直してください。';$('payTotals').innerHTML='<p>集計を表示できませんでした。</p>';$('body').innerHTML='<tr><td colspan="9">読み込みに失敗しました。</td></tr>';$('attendanceRequests').innerHTML='';}
}
setInterval(()=>{if(!document.hidden&&company)init()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&company)init()});init();</script></body></html>
