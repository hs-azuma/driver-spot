<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜アカウント復旧</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="./assets/auth-session.js?v=20261006b"></script><script src="./assets/account-auth.js?v=20261006b"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}main{max-width:680px;margin:32px auto;padding:24px;background:#fff;border-radius:16px}label{display:block;margin-top:18px;font-weight:bold}input{width:100%;padding:14px;margin:8px 0;border:1px solid #cbd7e8;border-radius:10px;font-size:16px}button{padding:14px;border:1px solid #1769d2;border-radius:10px;background:#fff;color:#1769d2;font-weight:bold}.primary{background:#1769d2;color:#fff}button:disabled{opacity:.5}#msg{color:#c62828;overflow-wrap:anywhere}a{color:#1769d2}</style></head><body><main id="panel"><h1>アカウント復旧</h1><p>ログインIDで登録した方は、保存した復旧コードでパスワードを再設定できます。</p><p>以前のメール登録アカウントは、従来のメールアドレスでログインしてください。</p><form onsubmit="event.preventDefault();recover()"><label for="loginId">ログインID</label><input id="loginId" autocomplete="username" required maxlength="32"><label for="code">復旧コード</label><input id="code" autocomplete="off" required><label for="password">新しいパスワード（8〜128文字）</label><input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><label for="password2">パスワード（確認）</label><input id="password2" type="password" autocomplete="new-password" required><button id="recoverBtn" type="submit" class="primary">パスワードを再設定</button><p id="msg" role="status"></p></form><p><a id="back" href="./driver.html">ログイン画面へ戻る</a></p></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC',SpodoraAuthSession.options),$=id=>document.getElementById(id);const destination=new URLSearchParams(location.search).get('portal')==='company'?'./company-register.html':'./driver.html';$('back').href=destination;let busy=false;async function recover(){if(busy)return;if($('password').value!==$('password2').value){$('msg').textContent='確認用パスワードが一致しません。';return}busy=true;$('recoverBtn').disabled=true;try{const r=await SpodoraAccount.recover(db,$('loginId').value,$('code').value,$('password').value);SpodoraAccount.recoveryPanel($('panel'),r.recoveryCode,()=>location.href=destination)}catch(e){$('msg').textContent=e.message;if(e.recoveryCode)$('msg').textContent+=' 新しい復旧コード：'+e.recoveryCode}finally{busy=false;if($('recoverBtn'))$('recoverBtn').disabled=false}}</script></body></html>
