<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ｜アカウント復旧</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="./assets/auth-session.js?v=20261006b"></script><script src="./assets/account-auth.js?v=20261007a"></script><script src="./assets/password-recovery.js?v=20261006a"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}main{max-width:680px;margin:24px auto;padding:24px;background:#fff;border-radius:16px}label{display:block;margin-top:18px;font-weight:bold}input{width:100%;min-width:0;padding:14px;margin:8px 0;border:1px solid #cbd7e8;border-radius:10px;font-size:16px}button{padding:14px;border:1px solid #1769d2;border-radius:10px;background:#fff;color:#1769d2;font-weight:bold;font-size:16px}.primary{background:#1769d2;color:#fff}button:disabled{opacity:.5}p{line-height:1.7}.error{color:#c62828;overflow-wrap:anywhere}.success{color:#16803c}a{color:#1769d2}.methods{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.methods button{flex:1;min-width:180px}#panel>.btn{display:block;width:100%;margin-top:16px}[hidden]{display:none!important}</style></head><body><main id="panel"><h1 id="title">アカウント復旧</h1><p id="intro">メールを登録している方はメールで、メール未登録の方は復旧コードでパスワードを再設定できます。</p><p id="callbackMsg" class="error" role="alert" hidden></p><div id="methods" class="methods"><button id="emailMethod" class="primary" type="button" onclick="choose('email')">メールで再設定</button><button id="codeMethod" type="button" onclick="choose('code')">復旧コードで再設定</button></div><section id="emailSection"><form onsubmit="event.preventDefault();sendEmail()"><label for="email">登録メールアドレス</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button id="emailBtn" type="submit" class="primary">再設定メールを送信</button><p id="emailMsg" role="status" aria-live="polite"></p></form><p>登録されている場合、再設定用のリンクが届きます。届かない場合は迷惑メールフォルダも確認してください。</p></section><section id="codeSection" hidden><p>ログインIDで登録した方は、保存した復旧コードを入力してください。</p><form onsubmit="event.preventDefault();recover()"><label for="loginId">ログインID</label><input id="loginId" autocomplete="username" required maxlength="32"><label for="code">復旧コード</label><input id="code" autocomplete="off" required><label for="password">新しいパスワード（8〜128文字）</label><input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><label for="password2">パスワード（確認）</label><input id="password2" type="password" autocomplete="new-password" required><button id="recoverBtn" type="submit" class="primary">パスワードを再設定</button><p id="msg" class="error" role="status"></p></form></section><section id="resetSection" hidden><p>メールの確認が完了しました。新しいパスワードを入力してください。</p><form onsubmit="event.preventDefault();resetFromEmail()"><label for="resetPassword">新しいパスワード（8〜128文字）</label><input id="resetPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><label for="resetPassword2">パスワード（確認）</label><input id="resetPassword2" type="password" autocomplete="new-password" required><button id="resetBtn" class="primary" type="submit">新しいパスワードを保存</button><p id="resetMsg" class="error" role="status"></p></form></section><p><a id="back" href="./driver.html">ログイン画面へ戻る</a></p></main><script>
const callbackHash=location.hash,hashParams=new URLSearchParams(callbackHash.replace(/^#/,'')),callbackInfo=SpodoraAuthSession.callbackInfo(callbackHash);
const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC',SpodoraAuthSession.options),$=id=>document.getElementById(id);
const portal=new URLSearchParams(location.search).get('portal')==='company'?'company':'driver',destination=portal==='company'?'./company-register.html':'./driver.html';$('back').href=destination;let busy=false,emailBusy=false,resetBusy=false,canReset=false,cooldown=0;
function choose(method){$('emailSection').hidden=method!=='email';$('codeSection').hidden=method!=='code';$('emailMethod').className=method==='email'?'primary':'';$('codeMethod').className=method==='code'?'primary':'';}
async function sendEmail(){if(emailBusy||Date.now()<cooldown)return;emailBusy=true;$('emailBtn').disabled=true;$('emailMsg').className='error';$('emailMsg').textContent='';try{await SpodoraPasswordRecovery.send(db,$('email').value,portal);$('emailMsg').className='success';$('emailMsg').textContent='登録されている場合、再設定メールを送信しました。メール内のリンクを開いてください。';cooldown=Date.now()+60000;const timer=setInterval(()=>{const left=Math.ceil((cooldown-Date.now())/1000);$('emailBtn').textContent=left>0?'再送まで '+left+'秒':'再設定メールを送信';if(left<=0){clearInterval(timer);$('emailBtn').disabled=false}},1000);}catch(e){$('emailMsg').textContent=e.message;$('emailBtn').disabled=false}finally{emailBusy=false}}
async function recover(){if(busy)return;try{SpodoraPasswordRecovery.validate($('password').value,$('password2').value)}catch(e){$('msg').textContent=e.message;return}busy=true;$('recoverBtn').disabled=true;try{const r=await SpodoraAccount.recover(db,$('loginId').value,$('code').value,$('password').value);SpodoraAccount.recoveryPanel($('panel'),r.recoveryCode,()=>location.href=destination)}catch(e){$('msg').textContent=e.message;if(e.recoveryCode)$('msg').textContent+=' 新しい復旧コード：'+e.recoveryCode}finally{busy=false;if($('recoverBtn'))$('recoverBtn').disabled=false}}
async function resetFromEmail(){if(resetBusy)return;resetBusy=true;$('resetBtn').disabled=true;try{await SpodoraPasswordRecovery.finish(db,$('resetPassword').value,$('resetPassword2').value,canReset);canReset=false;$('resetPassword').value='';$('resetPassword2').value='';$('resetSection').replaceChildren();$('title').textContent='パスワードを変更しました';$('intro').textContent='新しいパスワードで利用できます。';const link=document.createElement('a');link.href=destination;link.textContent='利用画面へ進む';$('resetSection').append(link)}catch(e){$('resetMsg').textContent=e.message}finally{resetBusy=false;if($('resetBtn'))$('resetBtn').disabled=false}}
async function initRecovery(){if(!callbackInfo.present)return;try{const session=await SpodoraAuthSession.ready(db,callbackInfo);if(hashParams.get('type')!=='recovery'||!session)throw new Error();const checked=await db.auth.getUser();if(checked.error||!checked.data.user)throw new Error();canReset=true;$('methods').hidden=true;$('emailSection').hidden=true;$('codeSection').hidden=true;$('resetSection').hidden=false;$('title').textContent='パスワード再設定';$('intro').hidden=true;}catch{$('callbackMsg').hidden=false;$('callbackMsg').textContent='再設定リンクが無効か、有効期限が切れています。下のメール送信から新しいリンクを取得してください。';choose('email');}}
initRecovery();
</script></body></html>
