<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIVER SPOT 企業登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #dbe3ef;padding:22px}main{max-width:1000px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:22px;margin-bottom:20px}h1{margin:0;color:#1769d2}button{border:1px solid #1769d2;background:#fff;color:#1769d2;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold;margin-right:8px}.primary{background:#1769d2;color:#fff}input{width:100%;max-width:560px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}label{display:block;margin:16px 0 6px;font-weight:bold}.note{color:#68758b}.error{color:#c62828;font-weight:bold}.success{color:#16803c;font-weight:bold}.password-row{display:flex;gap:8px;max-width:560px}.password-row input{flex:1}.password-row button{white-space:nowrap}</style></head><body><header><h1>DRIVER SPOT</h1><p>企業アカウント</p></header><main><div id="content" class="card">確認中...</div></main><script>
const SB_URL='https://wyxuekjikvflpcmlliwn.supabase.co',SB_KEY='sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC';let db,user=null,company=null;const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const v=id=>document.getElementById(id)?.value.trim()||'';function toggle(id,b){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';b.textContent=e.type==='password'?'表示':'隠す'}function setmsg(id,t,ok=false){const e=document.getElementById(id);if(!e)return;e.className=ok?'success':'error';e.textContent=t}
function showError(t){document.getElementById('content').innerHTML=`<h2>読み込みエラー</h2><p class="error">${esc(t)}</p><button onclick="location.reload()">再読み込み</button><button onclick="location.href='./'">トップへ戻る</button>`}
async function init(){try{if(!window.supabase)throw new Error('Supabaseライブラリを読み込めませんでした。');if(!db)db=window.supabase.createClient(SB_URL,SB_KEY);const result=await Promise.race([db.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('認証確認がタイムアウトしました。再読み込みしてください。')),8000))]);user=result?.data?.session?.user||null;if(user){const r=await db.from('companies').select('*').eq('user_id',user.id).maybeSingle();if(r.error)console.warn(r.error);company=r.data||null;if(company)return showReady();return showProfile()}showChoice()}catch(e){console.error(e);showError(e.message||String(e))}}
function showChoice(){document.getElementById('content').innerHTML=`<h2>企業の方</h2><p class="note">初めて利用する企業はアカウントを作成してください。登録済みの企業はログインしてください。</p><button class="primary" onclick="showSignup()">企業アカウントを作成</button><button onclick="showLogin()">企業ログイン</button><p><a href="./">求人ページへ戻る</a></p>`}
function showSignup(){document.getElementById('content').innerHTML=`<h2>企業アカウント作成</h2><label>会社名</label><input id="name"><label>担当者名</label><input id="contact"><label>電話番号</label><input id="phone" type="tel"><label>会社住所</label><input id="address"><label>メールアドレス</label><input id="email" type="email"><label>パスワード</label><div class="password-row"><input id="password" type="password" minlength="6"><button type="button" onclick="toggle('password',this)">表示</button></div><p class="note">6文字以上で設定してください。</p><button class="primary" onclick="signup()">企業アカウントを作成</button><button onclick="showChoice()">戻る</button><p id="msg"></p>`}
async function signup(){const name=v('name'),email=v('email'),password=v('password');if(!name||!email||password.length<6)return setmsg('msg','会社名・メールアドレス・6文字以上のパスワードは必須です。');const meta={account_type:'company',company_name:name,contact_name:v('contact'),company_phone:v('phone'),company_address:v('address')};const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:'https://hs-azuma.github.io/driver-spot/company-register.html',data:meta}});if(error)return setmsg('msg','登録エラー：'+error.message);if(!data.session)return setmsg('msg','確認メールを送りました。メール内のリンクを押して登録を完了してください。',true);user=data.user;showProfile()}
function showLogin(){document.getElementById('content').innerHTML=`<h2>企業ログイン</h2><label>メールアドレス</label><input id="email" type="email"><label>パスワード</label><div class="password-row"><input id="password" type="password"><button type="button" onclick="toggle('password',this)">表示</button></div><br><button class="primary" onclick="login()">ログイン</button><button onclick="showChoice()">戻る</button><p id="msg"></p>`}
async function login(){const {error}=await db.auth.signInWithPassword({email:v('email'),password:v('password')});if(error)return setmsg('msg','ログインエラー：'+error.message);init()}
function showProfile(){const m=user?.user_metadata||{};document.getElementById('content').innerHTML=`<h2>企業情報登録</h2><p class="note">アカウント認証は完了しています。会社情報を登録してください。</p><label>会社名</label><input id="name" value="${esc(m.company_name||'')}"><label>担当者名</label><input id="contact" value="${esc(m.contact_name||'')}"><label>電話番号</label><input id="phone" type="tel" value="${esc(m.company_phone||'')}"><label>メールアドレス</label><input value="${esc(user?.email||'')}" disabled><label>会社住所</label><input id="address" value="${esc(m.company_address||'')}"><br><br><button class="primary" onclick="saveProfile()">企業情報を登録する</button><p id="msg"></p>`}
async function saveProfile(){if(!v('name'))return setmsg('msg','会社名を入力してください。');const payload={user_id:user.id,company_name:v('name'),contact_name:v('contact'),phone:v('phone'),email:user.email,address:v('address')};const {error}=await db.from('companies').upsert([payload],{onConflict:'user_id'});if(error)return setmsg('msg','企業情報登録エラー：'+error.message);init()}
function showReady(){document.getElementById('content').innerHTML=`<h2>${esc(company.company_name)} 企業アカウント</h2><p class="success">企業登録は完了しています。</p><p>担当者：${esc(company.contact_name||'未設定')}</p><p>メール：${esc(company.email||user.email||'')}</p><button class="primary" onclick="location.href='./company.html'">企業マイページへ</button><button onclick="logout()">ログアウト</button>`}
async function logout(){await db.auth.signOut();user=null;company=null;showChoice()}
window.addEventListener('load',()=>init());
</script></body></html>
