<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 企業登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #dbe3ef;padding:22px}main{max-width:1000px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:22px;margin-bottom:20px}button{border:1px solid #1769d2;background:#fff;color:#1769d2;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold;margin:4px 8px 4px 0}.primary{background:#1769d2;color:#fff}input{width:100%;max-width:560px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}label{display:block;margin:16px 0 6px;font-weight:bold}.note{color:#68758b}.error{color:#c62828;font-weight:bold}.success{color:#16803c;font-weight:bold}.password-row{display:flex;gap:8px;max-width:560px}.password-row input{flex:1}.spodora-brand{display:block;width:300px;max-width:72vw}.spodora-brand img{display:block;width:100%;height:auto}</style><script src="./assets/auth-session.js?v=20261006"></script></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>企業アカウント</p></header><main><div id="content" class="card">確認中...</div></main><script>const SB_URL='https://wyxuekjikvflpcmlliwn.supabase.co',SB_KEY='sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC';let db,user=null,company=null;const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),v=id=>document.getElementById(id)?.value.trim()||'';function acq(){try{let a=JSON.parse(localStorage.getItem('spodora_acquisition')||'{}');return{acquisition_source:a.utm_source||null,acquisition_medium:a.utm_medium||null,acquisition_campaign:a.utm_campaign||null,acquisition_content:a.utm_content||null,acquisition_ref:a.ref||null}}catch(e){return{}}}function toggle(id,b){let e=document.getElementById(id);e.type=e.type==='password'?'text':'password';b.textContent=e.type==='password'?'表示':'隠す'}function setmsg(id,t,ok=false){let e=document.getElementById(id);if(e){e.className=ok?'success':'error';e.textContent=t}}async function init(){const info=SpodoraAuthSession.callbackInfo(location.hash);db=window.supabase.createClient(SB_URL,SB_KEY,SpodoraAuthSession.options);let s;try{s=await SpodoraAuthSession.ready(db,info)}catch(e){SpodoraAuthSession.showError(content);return}user=s?.user||null;if(user){let r=await db.from('companies').select('*').eq('user_id',user.id).maybeSingle();company=r.data||null;if(company)return showReady();return showExistingUser()}showChoice()}function showChoice(){content.innerHTML=`<h2>企業の方</h2><p class="note">既にスポドラのアカウントをお持ちなら、同じメールアドレスでログインできます。</p><button class="primary" onclick="showLogin()">既存アカウントでログイン</button><button onclick="showSignup()">初めての方：アカウント作成</button>`}function showExistingUser(){content.innerHTML=`<h2>企業利用を追加</h2><p class="success">${esc(user.email)} でログイン済みです。</p><button class="primary" onclick="showProfile()">このアカウントに企業情報を追加</button><button onclick="logout()">別のアカウントでログイン</button>`}function showSignup(){content.innerHTML=`<h2>企業アカウント作成</h2><label>会社名</label><input id="name"><label>担当者名</label><input id="contact"><label>電話番号</label><input id="phone" type="tel"><label>会社住所</label><input id="address"><label>メールアドレス</label><input id="email" name="signup-email" type="email" autocomplete="username"><label>パスワード</label><div class="password-row"><input id="password" name="new-password" type="password" autocomplete="new-password" minlength="6"><button type="button" onclick="toggle('password',this)">表示</button></div><button class="primary" onclick="signup()">企業アカウントを作成</button><button onclick="showChoice()">戻る</button><p id="msg"></p>`}async function signup(){let name=v('name'),email=v('email'),password=v('password');if(!name||!email||password.length<6)return setmsg('msg','会社名・メールアドレス・6文字以上のパスワードは必須です。');let meta={company_name:name,contact_name:v('contact'),company_phone:v('phone'),company_address:v('address'),...acq()};let {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:new URL('./company-register.html',location.href).href,data:meta}});if(error)return setmsg('msg','登録エラー：'+error.message);if(!data.session)return setmsg('msg','確認メールを送りました。メール内のリンクを押して登録を完了してください。 届かない場合は迷惑メールをご確認ください。',true);user=data.user;showProfile()}function showLogin(){content.innerHTML=`<h2>既存アカウントでログイン</h2><form id="companyLoginForm" onsubmit="event.preventDefault();login()"><label for="loginEmail">メールアドレス</label><input id="loginEmail" name="username" type="email" autocomplete="username" required><label for="loginPassword">パスワード</label><div class="password-row"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button type="button" onclick="toggle('loginPassword',this)">表示</button></div><br><button type="submit" class="primary">ログイン</button><button type="button" onclick="showChoice()">戻る</button><p id="msg"></p></form>`}async function login(){let {data,error}=await db.auth.signInWithPassword({email:v('loginEmail'),password:v('loginPassword')});if(error)return setmsg('msg','ログインエラー：'+error.message);user=data.user;let r=await db.from('companies').select('*').eq('user_id',user.id).maybeSingle();company=r.data||null;company?showReady():showExistingUser()}function showProfile(){let m=user?.user_metadata||{};content.innerHTML=`<h2>企業情報登録</h2><label>会社名</label><input id="name" value="${esc(m.company_name||'')}"><label>担当者名</label><input id="contact" value="${esc(m.contact_name||'')}"><label>電話番号</label><input id="phone" value="${esc(m.company_phone||'')}"><label>会社住所</label><input id="address" value="${esc(m.company_address||'')}"><button class="primary" onclick="saveProfile()">企業情報を登録する</button><p id="msg"></p>`}async function saveProfile(){if(!v('name'))return setmsg('msg','会社名を入力してください。');let m=user?.user_metadata||{},a=acq(),payload={user_id:user.id,company_name:v('name'),contact_name:v('contact'),phone:v('phone'),email:user.email,address:v('address'),acquisition_source:a.acquisition_source||m.acquisition_source||null,acquisition_medium:a.acquisition_medium||m.acquisition_medium||null,acquisition_campaign:a.acquisition_campaign||m.acquisition_campaign||null,acquisition_content:a.acquisition_content||m.acquisition_content||null,acquisition_ref:a.acquisition_ref||m.acquisition_ref||null};let {error}=await db.from('companies').upsert([payload],{onConflict:'user_id'});if(error)return setmsg('msg','企業情報登録エラー：'+error.message);company=payload;showReady()}function showReady(){location.replace('./company.html')}async function logout(){await db.auth.signOut();user=null;company=null;showChoice()}window.addEventListener('load',init);</script></body></html>
