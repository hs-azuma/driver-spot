<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 企業登録</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:#f4f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #dbe3ef;padding:22px}main{max-width:1000px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:22px;margin-bottom:20px}button{border:1px solid #1769d2;background:#fff;color:#1769d2;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold;margin:4px 8px 4px 0}.primary{background:#1769d2;color:#fff}input{width:100%;max-width:560px;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}label{display:block;margin:16px 0 6px;font-weight:bold}.note{color:#68758b}.error{color:#c62828;font-weight:bold}.success{color:#16803c;font-weight:bold}.password-row{display:flex;gap:8px;max-width:560px}.password-row input{flex:1}.spodora-brand{display:block;width:300px;max-width:72vw}.spodora-brand img{display:block;width:100%;height:auto}.required-mark{color:#c62828;font-size:13px;margin-left:6px}.optional-mark{color:#68758b;font-size:13px;margin-left:6px}[hidden]{display:none!important}</style><script src="./assets/auth-session.js?v=20261006b"></script><script src="./assets/account-auth.js?v=20261007a"></script></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>企業アカウント</p></header><main><div id="content" class="card">確認中...</div></main><script>const SB_URL='https://wyxuekjikvflpcmlliwn.supabase.co',SB_KEY='sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC';let db,user=null,company=null;const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),v=id=>document.getElementById(id)?.value.trim()||'';function acq(){try{let a=JSON.parse(localStorage.getItem('spodora_acquisition')||'{}');return{acquisition_source:a.utm_source||null,acquisition_medium:a.utm_medium||null,acquisition_campaign:a.utm_campaign||null,acquisition_content:a.utm_content||null,acquisition_ref:a.ref||null}}catch(e){return{}}}function toggle(id,b){let e=document.getElementById(id);e.type=e.type==='password'?'text':'password';b.textContent=e.type==='password'?'表示':'隠す'}function setmsg(id,t,ok=false){let e=document.getElementById(id);if(e){e.className=ok?'success':'error';e.textContent=t}}async function init(){const info=SpodoraAuthSession.callbackInfo(location.hash);db=window.supabase.createClient(SB_URL,SB_KEY,SpodoraAuthSession.options);let s;try{s=await SpodoraAuthSession.ready(db,info)}catch(e){SpodoraAuthSession.showError(content);return}user=s?.user||null;if(user){let r=await db.from('companies').select('*').eq('user_id',user.id).maybeSingle();company=r.data||null;if(company)return showReady();return showExistingUser()}showChoice()}function showChoice(){content.innerHTML=`<h2>企業の方</h2><p class="note">既にスポドラのアカウントをお持ちなら、ログインIDまたは従来のメールアドレスでログインできます。</p><button class="primary" onclick="showLogin()">既存アカウントでログイン</button><button onclick="showSignup()">初めての方：アカウント作成</button>`}function showExistingUser(){content.innerHTML=`<h2>企業利用を追加</h2><p class="success">${esc(SpodoraAccount.contactEmail(user)||"ログインIDのアカウント")} でログイン済みです。</p><button class="primary" onclick="showProfile()">このアカウントに企業情報を追加</button><button onclick="logout()">別のアカウントでログイン</button>`}function showSignup(){content.innerHTML=`<h2>企業アカウント作成</h2><p class="note">確認メール・SMS認証は不要です。メール未登録の場合、メール通知は届きません。</p><label>会社名 <span class="required-mark">必須</span></label><input id="name" required><label>担当者名 <span class="optional-mark">任意</span></label><input id="contact"><label>電話番号 <span class="optional-mark">任意</span></label><input id="phone" type="tel"><label>会社住所 <span class="optional-mark">任意</span></label><input id="address"><label for="loginId">ログインID <span class="required-mark">必須</span></label><input id="loginId" autocomplete="username" maxlength="32" placeholder="半角英数字など4〜32文字" required><label>メールアドレス <span class="optional-mark">任意</span></label><input id="email" name="signup-email" type="email" autocomplete="email"><label>パスワード <span class="required-mark">必須</span></label><div class="password-row"><input id="password" name="new-password" type="password" autocomplete="new-password" minlength="8" required><button type="button" onclick="toggle('password',this)">表示</button></div><button id="companySignupBtn" class="primary" onclick="signup()">企業アカウントを作成</button><button onclick="showChoice()">戻る</button><p id="msg"></p>`}let signupBusy=false;async function signup(){if(signupBusy)return;const name=v('name'),email=v('email'),password=document.getElementById('password').value,loginId=v('loginId');if(!name)return setmsg('msg','会社名を入力してください。');if(!/^[a-z0-9][a-z0-9_-]{3,31}$/i.test(loginId))return setmsg('msg',SpodoraAccount.message('invalid_login_id'));if(email&&!document.getElementById('email').checkValidity())return setmsg('msg','正しいメールアドレスを入力してください。');if(password.length<8||password.length>128)return setmsg('msg',SpodoraAccount.message('invalid_password'));signupBusy=true;const button=document.getElementById('companySignupBtn');button.disabled=true;try{const result=await SpodoraAccount.signup(db,loginId,email,password,{company_name:name,contact_name:v('contact'),company_phone:v('phone'),company_address:v('address'),...acq()});user=result.user;SpodoraAccount.recoveryPanel(content,result.recoveryCode,showProfile);const pk=document.createElement('button');pk.type='button';pk.hidden=true;pk.textContent='Face ID・指紋認証を設定する';pk.onclick=async()=>{pk.disabled=true;try{await SpodoraAccount.passkey(db,true);pk.textContent='パスキーを設定しました'}catch(e){pk.textContent=e.message;pk.disabled=false}};content.append(pk);SpodoraAccount.showPasskey(pk)}catch(e){setmsg('msg',e.message);if(e.recoveryCode)setmsg('msg',e.message+' 復旧コード：'+e.recoveryCode)}finally{signupBusy=false;button.disabled=false}}
function showLogin(){content.innerHTML=`<h2>既存アカウントでログイン</h2><form id="companyLoginForm" onsubmit="event.preventDefault();login()"><label for="loginEmail">ログインID または メールアドレス</label><input id="loginEmail" name="username" type="text" autocomplete="username" required><label for="loginPassword">パスワード</label><div class="password-row"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button type="button" onclick="toggle('loginPassword',this)">表示</button></div><br><button type="submit" class="primary">ログイン</button><button type="button" onclick="showChoice()">戻る</button><button id="companyPasskeyLogin" type="button" hidden onclick="loginPasskey()">Face ID・指紋認証でログイン</button><p><a href="./account-recovery.html?portal=company">パスワードを忘れた方</a></p><p id="msg"></p></form>`;SpodoraAccount.showPasskey(document.getElementById("companyPasskeyLogin"))}let loginBusy=false;async function finishLogin(){let r=await db.from('companies').select('*').eq('user_id',user.id).maybeSingle();company=r.data||null;company?showReady():showExistingUser()}async function login(){if(loginBusy)return;loginBusy=true;try{const data=await SpodoraAccount.login(db,v('loginEmail'),document.getElementById('loginPassword').value);user=data.user;await finishLogin()}catch(e){setmsg('msg',e.message)}finally{loginBusy=false}}async function loginPasskey(){if(loginBusy)return;loginBusy=true;setmsg('msg','');try{const data=await SpodoraAccount.passkey(db,false);user=data.user;await finishLogin()}catch(e){setmsg('msg',e.message)}finally{loginBusy=false}}
function showProfile(){let m=user?.user_metadata||{};content.innerHTML=`<h2>企業情報登録</h2><label>会社名 <span class="required-mark">必須</span></label><input id="name" value="${esc(m.company_name||'')}" required><label>担当者名 <span class="optional-mark">任意</span></label><input id="contact" value="${esc(m.contact_name||'')}"><label>電話番号 <span class="optional-mark">任意</span></label><input id="phone" value="${esc(m.company_phone||'')}"><label>会社住所 <span class="optional-mark">任意</span></label><input id="address" value="${esc(m.company_address||'')}"><button class="primary" onclick="saveProfile()">企業情報を登録する</button><p id="msg"></p>`}async function saveProfile(){if(!v('name'))return setmsg('msg','会社名を入力してください。');let m=user?.user_metadata||{},a=acq(),payload={user_id:user.id,company_name:v('name'),contact_name:v('contact'),phone:v('phone'),email:SpodoraAccount.contactEmail(user)||null,address:v('address'),acquisition_source:a.acquisition_source||m.acquisition_source||null,acquisition_medium:a.acquisition_medium||m.acquisition_medium||null,acquisition_campaign:a.acquisition_campaign||m.acquisition_campaign||null,acquisition_content:a.acquisition_content||m.acquisition_content||null,acquisition_ref:a.acquisition_ref||m.acquisition_ref||null};let {error}=await db.from('companies').upsert([payload],{onConflict:'user_id'});if(error)return setmsg('msg','企業情報登録エラー：'+error.message);company=payload;showReady()}function showReady(){location.replace('./company.html')}async function logout(){await db.auth.signOut();user=null;company=null;showChoice()}window.addEventListener('load',init);</script></body></html>
