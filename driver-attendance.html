<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スポドラ 出退勤スキャン</title><link rel="stylesheet" href="./assets/attendance-qr.css?v=20261005b"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="./assets/attendance-qr.js?v=20261005b"></script><style>body{background:#fff}header img{display:block}</style></head><body><header><a href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a></header><main><div class="card"><h1>出退勤スキャン</h1><p>企業が掲示している出退勤QRを読み取ってください。読み取った後に、対象の勤務を確認して出勤・退勤を記録します。</p><div class="actions"><button id="start" class="primary" onclick="startScan()" disabled>カメラで読み取る</button><button id="stop" onclick="stopScan()" hidden>カメラを止める</button></div><div id="reader"></div><div id="msg" class="info" role="status" aria-live="polite">ログインを確認中…</div><p id="camera-note" class="note">携帯の標準カメラでQRを読み取っても打刻画面を開けます。</p><a class="button" href="./driver.html">ドライバーページへ戻る</a></div></main><script>
const {db}=SpodoraQR,$=id=>document.getElementById(id);let scanner=null,running=false,starting=false,accepted=false,leaving=false,scanAllowed=false;
function availableWork(rows,now=new Date()){
 const today=now.toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
 return (rows||[]).filter(a=>a.status==='勤務確定'&&!a.checked_out_at&&a.jobs&&a.jobs.status!=='キャンセル'&&(a.jobs.work_date===today||!!a.checked_in_at));
}
async function init(){
 try{
  const r=await db.auth.getUser();if(!r.data.user){$('msg').innerHTML='ドライバーとしてログインしてください。<div class="actions"><a class="button" href="./driver.html?scan=1">ログインする</a></div>';return}
  const d=await db.from('drivers').select('id').eq('user_id',r.data.user.id).maybeSingle();if(d.error||!d.data)throw new Error('ドライバーのプロフィールを確認してください。');
  const work=await db.from('applications').select('id,status,checked_in_at,checked_out_at,jobs(work_date,status)').eq('driver_id',d.data.id);
  scanAllowed=true;$('start').disabled=false;
  if(work.error){$('msg').textContent='勤務の件数を確認できませんでした。「カメラで読み取る」からQRを読み取れます。';return}
  const available=availableWork(work.data);
  if(!available.length){
   scanAllowed=false;$('start').disabled=true;$('start').hidden=true;$('camera-note').hidden=true;
   const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
   const completed=(work.data||[]).some(a=>['勤務確定','勤務完了'].includes(a.status)&&a.checked_out_at&&a.jobs&&a.jobs.status!=='キャンセル'&&a.jobs.work_date===today);
   $('msg').innerHTML='<strong>'+(completed?'本日の出退勤はすべて記録済みです。':'本日の出勤予定はありません。')+'</strong><p>勤務予定は「応募・仕事管理」で確認できます。</p>';return;
  }
  if(available.length===1&&!document.hidden&&!leaving){await startScan();return}
  $('msg').textContent='「カメラで読み取る」を押してください。';
 }catch(err){$('msg').className='error';$('msg').textContent=err.message}
}
async function startScan(){
 if(!scanAllowed||running||starting)return;starting=true;accepted=false;$('start').disabled=true;$('msg').textContent='カメラを準備しています…';
 try{scanner=scanner||new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:15,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*.75);return{width:s,height:s}}},accept,()=>{});running=true;if(leaving||document.hidden||accepted){await stopScan();return}$('stop').hidden=false;$('msg').className='info';$('msg').textContent='企業のQRを枠内にかざしてください。'}
 catch(err){$('msg').className='error';$('msg').textContent='カメラを開始できませんでした。カメラの利用を許可して再度お試しください。標準カメラでも読み取れます。'}
 finally{starting=false;if(!running)$('start').disabled=!scanAllowed}
}
async function accept(text){if(accepted)return;const t=SpodoraQR.token(text);if(!t){$('msg').textContent='スポドラの企業用出退勤QRを読み取ってください。';return}accepted=true;$('msg').textContent='QRを読み取りました。勤務を確認します…';await stopScan();location.href=SpodoraQR.attendanceURL(t)}
async function stopScan(){if(scanner&&running){running=false;try{await scanner.stop()}catch{}}$('stop').hidden=true;$('start').disabled=!scanAllowed}
window.addEventListener('pagehide',()=>{leaving=true;stopScan()});window.addEventListener('pageshow',event=>{if(event.persisted)location.reload()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScan()});init();
</script></body></html>
