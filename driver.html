function jobDetail(j){return `<div class="detail">${SpodoraAttendance.plannedHtml(j)}<div class="detail-grid"><p><span class="label">車種</span>${e(j.vehicle_type||'指定なし')}</p><p><span class="label">必要免許</span>${e(j.required_license||'指定なし')}</p><p><span class="label">必要経験</span>${e(j.required_experience||'指定なし')}</p><p><span class="label">休憩時間</span>${br(j.break_minutes)}</p>${j.job_detail?`<p class="full"><span class="label">仕事内容</span>${e(j.job_detail)}</p>`:''}${j.access_note?`<p class="full"><span class="label">アクセス・集合場所</span>${e(j.access_note)}</p>`:''}${j.notes?`<p class="full"><span class="label">持ち物・服装・注意事項</span>${e(j.notes)}</p>`:''}${j.contact_name||j.contact_phone||j.contact_note?`<p class="full"><span class="label">当日連絡先</span>${e([j.contact_name,j.contact_phone,j.contact_note].filter(Boolean).join(' / '))}</p>`:''}</div>${jobMapLinks(j)}</div>`}async function loadJobs(){await auth();const owner=currentDriver?.id||null;if(driverJobViewOwner!==owner){driverJobViewOwner=owner;driverJobPeriod='all';driverJobView=SpodoraJobPreferences.hasAreas(currentDriver)?'matches':'all'}let r=await db.from('jobs').select('*,applications(id,status)').order('created_at',{ascending:false});if(r.error){$('content').innerHTML='<div class="card"><p>求人を読み込めませんでした。</p><button onclick="loadJobs()">再読み込み</button></div>';return}const hiring=await db.rpc('get_job_hiring_counts');if(hiring.error){$('content').innerHTML='<div class="card"><p>募集人数を確認できませんでした。</p><button onclick="loadJobs()">再読み込み</button></div>';return}const counts=new Map((hiring.data||[]).map(x=>[Number(x.job_id),Number(x.hired_count)]));let jobs=(r.data||[]).map(j=>({...j,hired_count:counts.get(Number(j.id))||0})),apps=new Map(),blocked=new Set(),favorites=new Map();if(currentDriver){let a=await db.from('applications').select('id,job_id,status').eq('driver_id',currentDriver.id);if(a.error){$('content').innerHTML='<div class="card">応募状況を取得できませんでした。ページを開き直してください。</div>';return}(a.data||[]).forEach(x=>apps.set(Number( function setDriverJobView(view){if(!['matches','all','favorites'].includes(view)||(!currentDriver&&view!=='all'))return;driverJobView=view;renderDriverJobs()}

async function toggleJobFavorite(id){
 if(!currentDriver)return showLogin();
 id=Number(id);if(!Number.isSafeInteger(id)||driverFavoriteBusy.has(id))return;
 const driverId=currentDriver.id,remove=driverJobFavorites.has(id);
 driverFavoriteBusy.add(id);const button=$('favorite-'+id);if(button){button.disabled=true;button.textContent='保存中…'}
 try{
  const q=db.from('driver_job_favorites');

}
function renderDriverJobs(){
 driverJobDetailId=null;

 }).join('');
 $('content').innerHTML=controls+(cards||'<div class="card">'+(savedView?'お気に入りはまだありません。求人の「☆ お気に入りに保存」を押すと、ここから見返せます。':driverJobView==='matches'?'選んだ日付・希望条件に合う求人は現在ありません。「すべての求人」や別の日付も確認できます。':'選んだ日付で応募できる求人は現在ありません。')+'</div>');

async function showMyPage(){
 await auth();if(!currentUser)return showLogin();if(!currentDriver)return showDriver();
 const r=await db.from('applications').select('id,status,hired_at,work_confirmed_at,completed_at,checked_in_at,checked_out_at,pay_guarantee_snapshot,jobs(*,companies(company_name))').eq('driver_id',currentDriver.id);
 if(r.error){$('content').innerHTML='<div class="card"><p>応募・仕事を取得できませんでした。</p><button onclick="showMyPage()">再読み込み</button></div>';return}
 try{await SpodoraReview.load(db,r.data||[],showMyPage)}catch(err){$('content').innerHTML='<div class="card"><p>勤怠申請を取得できませんでした。</p><button onclick="showMyPage()">再読み込み</button></div>';return}
 await SpodoraWorkRating.load(db,r.data||[],'driver',showMyPage);
 driverWorkRows=r.data||[];
 if(driverWorkOwner!==currentDriver.id){driverWorkOwner=currentDriver.id;driverWorkView=SpodoraDriverWork.rows(driverWorkRows,'upcoming').length?'upcoming':SpodoraDriverWork.rows(driverWorkRows,'pending').length?'pending':SpodoraDriverWork.rows(driverWorkRows,'history').length?'history':'upcoming'}

function setDriverWorkView(view){if(!['upcoming','pending','history'].includes(view))return;driverWorkView=view;renderDriverWork()}
function openDriverWork(id){const a=driverWorkRows.find(x=>Number(x.id)===Number(id));if(!a)return;driverWorkView=SpodoraDriverWork.group(a);renderDriverWork();$('work-'+Number(id))?.scrollIntoView?.({behavior:'smooth',block:'start'})}
function driverWorkState(a){
 if(a.jobs?.status==='キャンセル')return '<span class="decision red">企業都合で求人取消</span>';
 if(a.checked_out_at)return '<span class="decision green">退勤済み</span>';
 if(a.status==='勤務完了')return state(a.status);
 if(a.checked_in_at)return '<span class="decision green">出勤中</span>';
 return state(a.status);
}
function renderDriverWork(){
 const now=new Date(),today=SpodoraDriverWork.today(now),todays=SpodoraDriverWork.todays(driverWorkRows,now),rows=SpodoraDriverWork.rows(driverWorkRows,driverWorkView,now);
 const labels={upcoming:'これからの勤務',pending:'選考中',history:'勤務・応募履歴'},empty={upcoming:'これからの勤務予定はありません。',pending:'選考中の応募はありません。',history:'勤務・応募の履歴はまだありません。'};
 const todayHtml='<div class="card"><h2>本日の仕事</h2><p style="color:#68758b">'+e(wd(today))+'</p>'+(todays.length?todays.map(a=>{
  const j=a.jobs||{},canQR=a.status==='勤務確定'&&!a.checked_out_at;
  return '<div class="today-work"><div class="row"><b>'+e(j.job_description||'ドライバーの仕事')+'</b>'+driverWorkState(a)+'</div><p>'+e(j.companies?.company_name||'')+'</p><p><b>'+(j.work_date===today?'':e(wd(j.work_date||''))+'　')+tm(j.start_time)+'〜'+tm(j.end_time)+'</b></p>'+(a.checked_in_at||a.checked_out_at?'<p>実出勤 '+e(SpodoraAttendance.clock(a.checked_in_at,j.work_date))+' ／ 実退勤 '+e(SpodoraAttendance.clock(a.checked_out_at,j.work_date))+'</p>':'')+'<div class="row">'+(canQR?'<button class="primary" onclick="showMyQR()">出退勤スキャンを開く</button>':'')+'<button onclick="openDriverWork('+Number(a.id)+')">'+(a.checked_out_at||a.status==='勤務完了'?'勤怠・報酬を見る':'仕事の詳細を見る')+'</button></div></div>';
 }).join(''):'<p>本日の勤務予定はありません。</p>')+'</div>';
 const tabs='<div class="card"><div class="row" aria-label="応募・仕事の切り替え">'+Object.entries(labels).map(([key,label])=>'<button class="'+(driverWorkView===key?'primary':'')+'" aria-pressed="'+(driverWorkView===key)+'" onclick="setDriverWorkView(\''+key+'\')">'+label+'（'+SpodoraDriverWork.rows(driverWorkRows,key,now).length+'件）</button>').join('')+'</div><p style="font-size:13px;color:#68758b">'+(driverWorkView==='history'?'勤務が終わった仕事や、見送り・求人取消などの応募履歴を新しい順に表示します。':'勤務日・開始時刻が近い順に表示します。')+'</p></div>';
 $('content').innerHTML='<div class="card row"><h2 style="margin:0">'+e(currentDriver.name)+'さんの応募・仕事管理</h2><button onclick="showMyPage()">更新</button></div>'+todayHtml+tabs+(rows.map(a=>{
  const j=a.jobs||{},cancelled=j.status==='キャンセル',past=SpodoraDriverWork.ended(j,now),hasAttendance=!cancelled&&(['勤務確定','勤務完了'].includes(a.status)||a.checked_in_at||a.checked_out_at);
  const notice=cancelled?'企業都合により、この求人は取り消されました。':a.checked_out_at?'退勤打刻が記録されています。勤怠・報酬を確認できます。':a.status==='勤務完了'?'勤務完了として記録されています。':a.checked_in_at?'出勤中です。退勤時もQRで打刻してください。':past&&['採用','勤務確定'].includes(a.status)?'予定の勤務時間が終了しています。出退勤の記録を確認してください。':past&&['応募中','採用候補'].includes(a.status)?'予定の勤務時間が終了しています。選考状況は企業にご確認ください。':a.status==='勤務確定'?'勤務が確定しました。日時・集合場所をご確認ください。':a.status==='採用'?'採用されました。勤務の案内をご確認ください。':'';
  return '<article class="card driver-work-card" id="work-'+Number(a.id)+'">'+(notice?'<div class="'+(cancelled?'cancelnotice':'notice')+'">'+notice+'</div>':'')+'<div class="row"><h3>'+e(j.job_description||'求人情報を確認できません')+'</h3>'+driverWorkState(a)+'</div><p><b>'+e(j.companies?.company_name||'')+'</b></p><p>'+e(wd(j.work_date||''))+'　'+tm(j.start_time)+'〜'+tm(j.end_time)+'</p><p>'+e(j.location||'')+(j.destination?' → '+e(j.destination):'')+'</p><p>'+e(j.pay_type||'')+' '+Number(j.pay_amount||0).toLocaleString()+'円</p>'+(hasAttendance?SpodoraAttendance.html(a,j,false)+SpodoraReview.driverHtml(a):'')+SpodoraWorkRating.html(a)+'<details class="work-details"><summary>仕事内容・集合場所を確認</summary>'+jobDetail(j)+'</details>'+(!cancelled&&(a.status==='応募中'||a.status==='採用候補')?'<button class="danger" style="margin-top:14px" onclick="cancelApp('+Number(a.id)+',true)">応募をキャンセル</button>':'')+'</article>';
 }).join('')||'<div class="card">'+empty[driverWorkView]+'</div>');
}

async function apply(id){if(!currentUser)return showLogin();if(!currentDriver)return showDriver();let jr=await db.from('jobs').select('status,required_headcount,applications(status)').eq('id',id).single();if(jr.error)return alert(jr.error.message);if(jr.data.status==='キャンセル')return alert('この求人は取り消されています。');let need=Number(jr.data.required_headcount||1),hired=(jr.data.applications||[]).filter(x=>['採用','勤務確定','勤務完了'].includes(x.status)).length;if(hired>=need)return alert('この求人は募集人数に達しています。');if(!confirm('応募しますか？'))return;let r=await db.from('applications').insert({job_id:id,driver_id:currentDriver.id,status:'応募中'});if(r.error){if(String(r.error.message).includes('duplicate'))return alert('すでに応募済みです。');return alert(r.error.message)}alert('応募しました。');loadJobs()}async function cancelApp(id,back=false){if(!confirm('この応募をキャンセルしますか？'))return;let r=await db.from('applications').delete().eq('id',id);if(r.error)return alert(r.error.message);alert('応募をキャンセルしました。');back?showMyPage():loadJobs()}async function showDriver(){await auth();if(!currentUser)return showLogin();if(!currentDriver){$('content').innerHTML=`<div class="card"><h2>ドライバープロフィール登録</h2><input id="dn" placeholder="氏名"><input id="dp" placeholder="電話番号"><input id="da" placeholder="希望エリア"><select id="dl"><option>普通</option><option>準中型</option><option>中型</option><option>大型</option></select><select id="dx"><option>1年未満</option><option>1〜3年</option><option>3〜5年</option><option>5年以上</option></select><button class="primary" onclick="saveDriver()">登録する</button></div>`;return}$('content').innerHTML=`<div class="card"><h2>プロフィール</h2><p><b>氏名</b> ${e(currentDriver.name)}</p><p><b>電話</b> ${e(currentDriver.phone||'')}</p><p><b>希望エリア</b> ${e([currentDriver.preferred_municipality||currentDriver.preferred_area,currentDriver.preferred_municipality_2,currentDriver.preferred_municipality_3].filter(Boolean).join(' ／ ')||'未設定')}</p><p><b>免許</b> ${e(currentDriver.license_type||'')}</p><p><b>経験</b> ${e(currentDriver.experience||'')}</p><p style="margin-top:20px"><button class="primary" onclick="location.href='./driver-profile-setup.html'">プロフィール情報を変更</button></p><hr style="margin:28px 0;border:0;border-top:1px solid #e5eaf1"><h3>休会・利用再開</h3><p><span class="decision ${currentDriver.is_paused?'yellow':'green'}">${currentDriver.is_paused?'休会中':'利用中'}</span></p><p>休会中は、希望エリアに合う新しい求人のメール・LINE通知を停止します。プロフィール・応募履歴・勤怠等の登録情報は残り、いつでも利用再開できます。</p><button id="pauseBtn" class="${currentDriver.is_paused?'primary':''}" onclick="setMembershipPaused(${!currentDriver.is_paused})">${currentDriver.is_paused?'利用を再開する':'休会する'}</button><p id="pauseMsg" role="status" aria-live="polite"></p><hr style="margin:28px 0;border:0;border-top:1px solid #e5eaf1"><h3>退会</h3><p>退会すると、プロフィール・応募履歴・勤怠・レビュー等の登録情報は削除され、元に戻せません。</p><button class="danger" onclick="deleteAccount()">退会して情報を削除する</button></div>`}async function setMembershipPaused(paused){
if(!currentUser||!currentDriver)return;
if(!confirm(paused?'休会して、新しい求人のメール・LINE通知を停止しますか？登録情報は残ります。':'利用を再開しますか？求人通知はプロフィールのメール通知設定に従って再開します。'))return;
const button=$('pauseBtn'),message=$('pauseMsg');
button.disabled=true;button.textContent='保存中…';
try{
const r=await db.from('drivers').update({is_paused:paused}).eq('user_id',currentUser.id).select('is_paused').single();
if(r.error)throw r.error;
if(!r.data||r.data.is_paused!==paused)throw new Error('休会状態を保存できませんでした。');
await showDriver();
$('pauseMsg').style.color='#16803c';$('pauseMsg').textContent=paused?'休会しました。新しい求人のメール・LINE通知を停止しています。':'利用を再開しました。';
}catch(err){
message.style.color='#c62828';message.textContent='保存に失敗しました：'+(err.message||err);
button.disabled=false;button.textContent=paused?'休会する':'利用を再開する';
}
}async function deleteAccount(){if(!currentUser)return;if(!confirm('退会すると登録情報はすべて削除され、元に戻せません。退会しますか？'))return;if(!confirm('最終確認です。本当に退会してすべての情報を削除しますか？'))return;let r=await db.functions.invoke('delete-account',{body:{}});if(r.error||r.data?.error)return alert('退会処理に失敗しました。'+(r.data?.error||r.error?.message||''));await db.auth.signOut();alert('退会が完了しました。登録情報を削除しました。');location.href='./'}async function saveDriver(){let r=await db.from('drivers').insert({user_id:currentUser.id,name:v('dn'),phone:v('dp'),preferred_area:v('da'),license_type:v('dl'),experience:v('dx')});if(r.error)return alert(r.error.message);loadJobs()}async function enterDriver(){const p=new URLSearchParams(location.search);if(p.has('attendance')||p.get('scan')==='1'){await auth();if(!currentUser)return showLogin();if(resumeAttendance())return}if(p.get('invites')==='1')showJobInvitations();else loadJobs()}enterDriver();</script></body></html>
