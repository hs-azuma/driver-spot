</style><script src="./assets/attendance-summary.js?v=20261004c"></script></head><body><header><a class="spodora-brand" href="./"><img src="./assets/supodora-logo-final.png?v=20261001b" alt="スポドラ"></a><p>ドライバー専用</p></header><main><div class="status row"><span id="authStatus">確認中...</span><span style="margin-left:auto"></span><a id="signupBtn" class="signup" href="./driver-register.html" style="display:none">新規登録</a><button id="authBtn" onclick="showLogin()">ログイン</button></div><div class="tabs"><button onclick="loadJobs()">求人を見る</button><button onclick="showMyPage()">応募・仕事管理</button><button onclick="showMyQR()">出退勤QR</button><button onclick="showDriver()">プロフィール</button><button onclick="location.href='./line-link.html'" style="background:#16803c;border-color:#16803c;color:#fff">LINE通知を設定する</button></div><div id="content"></div></main><script>const db=supabase.createClient('https://wyxuekjikvflpcmlliwn.supabase.co','sb_publishable_YCin6s4LUf-5Xk44OmU6zQ_gDk9ThSC');let currentUser,currentDriver;const $=x=>document.getElementById(x),v=x=>$(x)?.value.trim()||'',e=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'),tm=x=>x?String(x).slice(0,5):'',wd=x=>{if(!x)return'';let a=String(x).split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]);return x+'（'+['日','月','火','水','木','金','土'][d.getDay()]+'）'},br=x=>Number(x||0)?Number(x)+'分':'なし';async function auth(){currentUser=(await db.auth.getUser()).data.user||null;currentDriver=null;if(currentUser){let r=await db.from('drivers').select('*').eq('user_id',currentUser.id).maybeSingle();currentDriver=r.data}$('authStatus').textContent=currentUser?(currentDriver?currentDriver.name+'さん ログイン中':currentUser.email+' ログイン中'):'未ログイン';$('authBtn').textContent=currentUser?'ログアウト':'ログイン';$('authBtn').onclick=currentUser?logout:showLogin;$('signupBtn').style.display=currentUser?'none':'inline-block'}async function logout(){await db.auth.signOut();loadJobs()}function state(s){if(s==='勤務完了')return '<span class="decision green">勤務完了</span>';if(s==='勤務確定')return '<span class="decision green">勤務確定</span>';if(s==='採用')return '<span class="decision green">採用済み</span>';if(s==='採用候補')return '<span class="decision yellow">採用候補</span>';if(s==='見送り'||s==='不採用')return '<span class="decision red">見送り</span>';return '<span class="decision">応募中</span>'}function showLogin(){$('content').innerHTML=`<div class="card"><h2>ログイン</h2><input id="em" type="email" autocomplete="username" placeholder="メールアドレス"><div class="password-row"><input id="pw" type="password" autocomplete="current-password" placeholder="パスワード"><button onclick="let x=$('pw');x.type=x.type==='password'?'text':'password'">表示</button></div><div class="row"><button class="primary" onclick="login()">ログイン</button><a class="signup" href="./driver-register.html">初めての方：新規登録</a></div></div>`}async function login(){let r=await db.auth.signInWithPassword({email:v('em'),password:v('pw')});if(r.error)return alert(r.error.message);loadJobs()}function jobMapQuery(j){const loc=String(j.location||'').trim(),pref=String(j.work_prefecture||'').trim(),mun=String(j.work_municipality||'').trim();let query=loc;if(mun&&!mun.endsWith('全域')&&!query.includes(mun))query=mun+' '+query;if(pref&&!query.includes(pref))query=pref+' '+query;return query.trim()||mun;}
function jobMapLinks(j){const query=jobMapQuery(j);if(!query)return '';const encoded=encodeURIComponent(query),label=String(query).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');return '<div class="job-map"><p><b>勤務地・集合場所の地図</b></p><p>'+label+'</p><iframe class="job-map-frame" title="勤務地・集合場所の地図" src="https://www.google.com/maps?q='+encoded+'&amp;output=embed&amp;hl=ja" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><div class="job-map-actions"><a href="https://www.google.com/maps/dir/?api=1&destination='+encoded+'" target="_blank" rel="noopener noreferrer">経路を調べる</a></div><p class="job-map-note">登録された住所・施設名の地図を表示しています。市区町村のみの場合は周辺表示です。集合場所は求人の案内をご確認ください。</p></div>';}
function jobDetail(j){return `<div class="detail">${SpodoraAttendance.plannedHtml(j)}<div class="detail-grid"><p><span class="label">車種</span>${e(j.vehicle_type||'指定なし')}</p><p><span class="label">必要免許</span>${e(j.required_license||'指定なし')}</p><p><span class="label">必要経験</span>${e(j.required_experience||'指定なし')}</p><p><span class="label">休憩時間</span>${br(j.break_minutes)}</p>${j.job_detail?`<p class="full"><span class="label">仕事内容の補足</span>${e(j.job_detail)}</p>`:''}${j.access_note?`<p class="full"><span class="label">アクセス・集合場所</span>${e(j.access_note)}</p>`:''}${j.notes?`<p class="full"><span class="label">持ち物・服装・注意事項</span>${e(j.notes)}</p>`:''}${j.contact_name||j.contact_phone||j.contact_note?`<p class="full"><span class="label">当日連絡先</span>${e([j.contact_name,j.contact_phone,j.contact_note].filter(Boolean).join(' / '))}</p>`:''}</div>${jobMapLinks(j)}</div>`}async function loadJobs(){await auth();let r=await db.from('jobs').select('*,applications(id,status)').neq('status','キャンセル').order('created_at',{ascending:false}),jobs=r.data||[],apps=new Map(),blocked=new Set();if(currentDriver){let a=await db.from('applications').select('id,job_id,status').eq('driver_id',currentDriver.id);(a.data||[]).forEach(x=>apps.set(Number(x.job_id),x));let b=await db.from('company_driver_blocks').select('company_id').eq('driver_id',currentDriver.id);(b.data||[]).forEach(x=>blocked.add(Number(x.company_id)));jobs=jobs.filter(j=>!blocked.has(Number(j.company_id)))}$('content').innerHTML=jobs.map(j=>{let a=apps.get(Number(j.id)),all=j.applications||[],need=Number(j.required_headcount||1),hired=all.filter(x=>['採用','勤務確定','勤務完了'].includes(x.status)).length,remain=Math.max(0,need-hired),full=remain===0;let action=a?state(a.status)+(a.status==='応募中'||a.status==='採用候補'?` <button class="danger" onclick="cancelApp(${a.id})">応募をキャンセル</button>`:''):full?'<span class="decision">募集充足</span>':`<button class="primary" onclick="location.href='./apply-confirm.html?job=${j.id}'">この求人に応募する</button>`;return `<div class="card">${j.urgent?'<span class="badge urgent">緊急募集</span>':''}<h2>${e(j.job_description||'ドライバー求人')}</h2><p>${e(j.location||'')}${j.destination?' → '+e(j.destination):''}</p><div class="salary">${e(j.pay_type||'')} ${Number(j.pay_amount||0).toLocaleString()}円</div><p>${e(wd(j.work_date||''))} ${tm(j.start_time)}〜${tm(j.end_time)}</p><div class="row"><span class="badge">必要 ${need}人</span><span class="badge">残り ${remain}人</span></div>${jobDetail(j)}<div style="margin-top:16px">${action}</div></div>`}).join('')||'<div class="card">現在、表示できる求人はありません。</div>'}async function showMyPage(){await auth();if(!currentUser)return showLogin();if(!currentDriver)return showDriver();let r=await db.from('applications').select('id,status,hired_at,work_confirmed_at,completed_at,checked_in_at,checked_out_at,jobs(*,companies(company_name))').eq('driver_id',currentDriver.id);if(r.error)return $('content').innerHTML='<div class="card">'+e(r.error.message)+'</div>';let rows=(r.data||[]).sort((a,b)=>String(b.jobs?.work_date||'').localeCompare(String(a.jobs?.work_date||''))),active=rows.filter(x=>x.jobs?.status!=='キャンセル'),cancelled=rows.filter(x=>x.jobs?.status==='キャンセル'),count=s=>active.filter(x=>x.status===s).length;$('content').innerHTML=`<div class="card"><h2>${e(currentDriver.name)}さんの応募・仕事管理</h2><div class="row"><span class="summary">応募 ${active.length}件</span><span class="summary">採用 ${active.filter(x=>['採用','勤務確定','勤務完了'].includes(x.status)).length}件</span><span class="summary">勤務確定 ${count('勤務確定')}件</span><span class="summary">勤務完了 ${count('勤務完了')}件</span>${cancelled.length?`<span class="summary">企業取消 ${cancelled.length}件</span>`:''}</div></div>`+rows.map(a=>{let j=a.jobs||{},isCancelled=j.status==='キャンセル',notice=isCancelled?'企業都合により、この求人は取り消されました。':a.status==='勤務完了'?'勤務お疲れさまでした。勤務完了として記録されています。':a.status==='勤務確定'?'勤務が確定しました。日時・場所をご確認ください。':a.status==='採用'?'🎉 採用されました':'';return `<div class="card">${notice?`<div class="${isCancelled?'cancelnotice':'notice'}">${notice}</div>`:''}<div class="row"><h3>${e(j.job_description||'')}</h3>${isCancelled?'<span class="decision red">企業都合で求人取消</span>':state(a.status)}</div><p><b>${e(j.companies?.company_name||'')}</b></p><p>${e(wd(j.work_date||''))}　${tm(j.start_time)}〜${tm(j.end_time)}</p><p>${e(j.location||'')}${j.destination?' → '+e(j.destination):''}</p><p>${e(j.pay_type||'')} ${Number(j.pay_amount||0).toLocaleString()}円</p>${!isCancelled&&['勤務確定','勤務完了'].includes(a.status)?SpodoraAttendance.html(a,j,false):''}${jobDetail(j)}${!isCancelled&&(a.status==='応募中'||a.status==='採用候補')?`<button class="danger" onclick="cancelApp(${a.id},true)">応募をキャンセル</button>`:''}</div>`}).join('')}async function showMyQR(){stopAttendanceWatch();await auth();if(!currentDriver)return showDriver();$('content').innerHTML=`<div class="card qr"><h2>出退勤</h2><p><b>${e(currentDriver.name)}さん</b></p><p>会社端末にかざす前に、どちらかを選んでください。</p><div class="clockbuttons"><button class="clockin" onclick="makeAttendanceQR('in')">出勤</button><button class="clockout" onclick="makeAttendanceQR('out')">退勤</button></div><div class="qrnote">選択するまでQRコードは表示されません。</div></div>`}let attendanceWatch=null;
function stopAttendanceWatch(){if(attendanceWatch?.timer)clearInterval(attendanceWatch.timer);attendanceWatch=null}
async function attendanceSnapshot(){return db.from('applications').select('id,status,checked_in_at,checked_out_at,jobs(job_description,work_date)').eq('driver_id',currentDriver.id)}
async function checkAttendanceFeedback(watch){
 if(attendanceWatch!==watch)return;
 if(!$('activeQr')){stopAttendanceWatch();return}
 if(document.hidden||watch.busy)return;
 watch.busy=true;
 try{
  const r=await attendanceSnapshot();
  if(attendanceWatch!==watch||!$('activeQr'))return;
  if(r.error)throw r.error;
  const field=watch.action==='in'?'checked_in_at':'checked_out_at';
  const recorded=(r.data||[]).filter(a=>a[field]&&a[field]!==watch.baseline.get(a.id)).sort((a,b)=>String(b[field]).localeCompare(String(a[field])))[0];
  if(!recorded){$('attendanceFeedback').textContent='読み取り待ち…';return}
  const label=watch.action==='in'?'出勤':'退勤',stamp=new Date(recorded[field]).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
  stopAttendanceWatch();
  $('content').innerHTML='<div class="card qr"><div class="attendance-success" role="status" aria-live="polite"><div aria-hidden="true" style="font-size:64px">✓</div><h2>'+label+'打刻が完了しました</h2><p style="font-size:28px;font-weight:bold">'+e(stamp)+'</p></div><p>'+e(currentDriver.name)+'さん</p><p>'+e(recorded.jobs?.job_description||'')+'</p><button class="primary" onclick="showMyPage()">応募・仕事管理へ</button><button onclick="showMyQR()">出勤・退勤の選択に戻る</button></div>';
 }catch(err){if(attendanceWatch===watch&&$('attendanceFeedback'))$('attendanceFeedback').textContent='通信を確認中です。完了状況を自動で再確認します。'}
 finally{watch.busy=false}
}
async function makeAttendanceQR(action){
 stopAttendanceWatch();
 const baseline=await attendanceSnapshot();
 if(baseline.error)return alert('打刻状況を確認できませんでした。もう一度お試しください。');
 if(action==='out'){
  const rows=baseline.data||[],today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
  const open=rows.some(a=>a.status==='勤務確定'&&a.checked_in_at&&!a.checked_out_at);
  const done=rows.filter(a=>a.checked_out_at&&(a.jobs?.work_date===today||new Date(a.checked_out_at).toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'})===today)).sort((a,b)=>String(b.checked_out_at).localeCompare(String(a.checked_out_at)))[0];
  if(!open&&done){
   const stamp=new Date(done.checked_out_at).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
   $('content').innerHTML='<div class="card qr"><div class="attendance-success" role="status" aria-live="polite"><div aria-hidden="true" style="font-size:64px">✓</div><h2>退勤済みです</h2><p style="font-size:28px;font-weight:bold">退勤 '+e(stamp)+'</p></div><p>'+e(currentDriver.name)+'さん</p><p>'+e(done.jobs?.job_description||'')+'</p><p>この勤務の退勤打刻は完了しています。</p><button class="primary" onclick="showMyPage()">応募・仕事管理へ</button><button onclick="showMyQR()">出勤・退勤の選択に戻る</button></div>';
   return;
  }
 }
 const r=await db.rpc('prepare_driver_attendance',{p_action:action});
 if(r.error)return alert(r.error.message);
 const token=r.data,label=action==='in'?'出勤':'退勤';
 $('content').innerHTML=`<div class="card qr"><div class="qrtitle">${label}用QR</div><p>${e(currentDriver.name)}さん</p><div id="activeQr" class="qrimg"></div><p class="qrnote">このQRを会社の読み取り端末にかざしてください。</p><p id="attendanceFeedback" role="status" aria-live="polite">読み取り待ち…</p><p class="qrnote">打刻が記録されると、この画面に完了を表示します。</p><button onclick="showMyQR()">出勤・退勤の選択に戻る</button></div>`;
 new QRCode($('activeQr'),{text:'DRIVERSPOT:'+token+':'+action,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});
 const field=action==='in'?'checked_in_at':'checked_out_at';
 const watch={action,baseline:new Map((baseline.data||[]).map(a=>[a.id,a[field]])),busy:false,timer:null};
 attendanceWatch=watch;watch.timer=setInterval(()=>checkAttendanceFeedback(watch),2000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&attendanceWatch)checkAttendanceFeedback(attendanceWatch)});
window.addEventListener('pagehide',()=>{if(attendanceWatch?.timer){clearInterval(attendanceWatch.timer);attendanceWatch.timer=null}});
window.addEventListener('pageshow',()=>{if(attendanceWatch&&$('activeQr')&&!attendanceWatch.timer){const watch=attendanceWatch;watch.timer=setInterval(()=>checkAttendanceFeedback(watch),2000);checkAttendanceFeedback(watch)}});
async function apply(id){if(!currentUser)return showLogin();if(!currentDriver)return showDriver();let jr=await db.from('jobs').select('status,required_headcount,applications(status)').eq('id',id).single();if(jr.error)return alert(jr.error.message);if(jr.data.status==='キャンセル')return alert('この求人は取り消されています。');let need=Number(jr.data.required_headcount||1),hired=(jr.data.applications||[]).filter(x=>['採用','勤務確定','勤務完了'].includes(x.status)).length;if(hired>=need)return alert('この求人は募集人数に達しています。');if(!confirm('応募しますか？'))return;let r=await db.from('applications').insert({job_id:id,driver_id:currentDriver.id,status:'応募中'});if(r.error){if(String(r.error.message).includes('duplicate'))return alert('すでに応募済みです。');return alert(r.error.message)}alert('応募しました。');loadJobs()}async function cancelApp(id,back=false){if(!confirm('この応募をキャンセルしますか？'))return;let r=await db.from('applications').delete().eq('id',id);if(r.error)return alert(r.error.message);alert('応募をキャンセルしました。');back?showMyPage():loadJobs()}async function showDriver(){await auth();if(!currentUser)return showLogin();if(!currentDriver){$('content').innerHTML=`<div class="card"><h2>ドライバープロフィール登録</h2><input id="dn" placeholder="氏名"><input id="dp" placeholder="電話番号"><input id="da" placeholder="希望エリア"><select id="dl"><option>普通</option><option>準中型</option><option>中型</option><option>大型</option></select><select id="dx"><option>1年未満</option><option>1〜3年</option><option>3〜5年</option><option>5年以上</option></select><button class="primary" onclick="saveDriver()">登録する</button></div>`;return}$('content').innerHTML=`<div class="card"><h2>プロフィール</h2><p><b>氏名</b> ${e(currentDriver.name)}</p><p><b>電話</b> ${e(currentDriver.phone||'')}</p><p><b>希望エリア</b> ${e(currentDriver.preferred_area||'')}</p><p><b>免許</b> ${e(currentDriver.license_type||'')}</p><p><b>経験</b> ${e(currentDriver.experience||'')}</p><p style="margin-top:20px"><button class="primary" onclick="location.href='./driver-profile-setup.html'">プロフィール情報を変更</button></p><hr style="margin:28px 0;border:0;border-top:1px solid #e5eaf1"><h3>休会・利用再開</h3><p><span class="decision ${currentDriver.is_paused?'yellow':'green'}">${currentDriver.is_paused?'休会中':'利用中'}</span></p><p>休会中は、希望エリアに合う新しい求人のメール・LINE通知を停止します。プロフィール・応募履歴・勤怠等の登録情報は残り、いつでも利用再開できます。</p><button id="pauseBtn" class="${currentDriver.is_paused?'primary':''}" onclick="setMembershipPaused(${!currentDriver.is_paused})">${currentDriver.is_paused?'利用を再開する':'休会する'}</button><p id="pauseMsg" role="status" aria-live="polite"></p><hr style="margin:28px 0;border:0;border-top:1px solid #e5eaf1"><h3>退会</h3><p>退会すると、プロフィール・応募履歴・勤怠・レビュー等の登録情報は削除され、元に戻せません。</p><button class="danger" onclick="deleteAccount()">退会して情報を削除する</button></div>`}async function setMembershipPaused(paused){
if(!currentUser||!currentDriver)return;
if(!confirm(paused?'休会して、新しい求人のメール・LINE通知を停止しますか？登録情報は残ります。':'利用を再開しますか？求人通知はプロフィールのメール通知設定に従って再開します。'))return;
const button=$('pauseBtn'),message=$('pauseMsg');
button.disabled=true;button.textContent='保存中…';
try{
const r=await db.from('drivers').update({is_paused:paused}).eq('user_id',currentUser.id).select('is_paused').single();
if(r.error)throw r.error;
if(!r.data||r.data.is_paused!==paused)throw new Error('休会状態を保存できませんでした。');
await showDriver();
$('pauseMsg').style.color='#16803c';$('pauseMsg').textContent=paused?'休会しました。新しい求人のメール・LINE通知を停止しています。':'利用を再開しました。';
}catch(err){
message.style.color='#c62828';message.textContent='保存に失敗しました：'+(err.message||err);
button.disabled=false;button.textContent=paused?'休会する':'利用を再開する';
}
}async function deleteAccount(){if(!currentUser)return;if(!confirm('退会すると登録情報はすべて削除され、元に戻せません。退会しますか？'))return;if(!confirm('最終確認です。本当に退会してすべての情報を削除しますか？'))return;let r=await db.functions.invoke('delete-account',{body:{}});if(r.error||r.data?.error)return alert('退会処理に失敗しました。'+(r.data?.error||r.error?.message||''));await db.auth.signOut();alert('退会が完了しました。登録情報を削除しました。');location.href='./'}async function saveDriver(){let r=await db.from('drivers').insert({user_id:currentUser.id,name:v('dn'),phone:v('dp'),preferred_area:v('da'),license_type:v('dl'),experience:v('dx')});if(r.error)return alert(r.error.message);loadJobs()}loadJobs();</script></body></html>
